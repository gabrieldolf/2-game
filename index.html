<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Heave Ho - Toque Geométrico Perfeito</title>
    <style>
        body { margin:0; background:#111; display:flex; font-family:Arial, sans-serif; overflow:hidden; height:100vh; }
        #sidebar { width:260px; background:#222; color:#fff; padding:15px; display:flex; flex-direction:column; gap:10px; border-right:2px solid #444; z-index:10; font-size:13px; box-sizing:border-box; overflow-y:auto; }
        #canvas-container { flex-grow:1; display:flex; justify-content:center; align-items:center; position:relative; }
        button { background:#444; color:white; border:none; padding:8px; cursor:pointer; border-radius:4px; font-weight:bold; width:100%; }
        button:hover { background:#555; } button.active { background:#00ff00; color:black; }
        .section { border-top:1px solid #444; padding-top:10px; display:flex; flex-direction:column; gap:6px; }
        .prop-row { display:flex; justify-content:space-between; align-items:center; gap:10px; }
        input[type="number"], select { width:80px; background:#333; color:white; border:1px solid #555; padding:4px; border-radius:4px; }
        input[type="checkbox"] { width:18px; height:18px; cursor: pointer; }
        h3 { margin:0; font-size:12px; color:#aaa; text-transform:uppercase; }
    </style>
    <script src="phaser.min.js"></script>
</head>
<body>

<div id="sidebar">
    <h2>EDITOR</h2>
    <div class="section"><h3>Controles</h3><p style="font-size:11px; color:#aaa; margin:0;">Aperte <b>Select/Back</b> no gamepad para Respawn.</p></div>
    <div>
        <button id="btn-create" class="active" onclick="setFerramenta('create')">Criar Novo Objeto</button>
        <button id="btn-select" style="margin-top:5px;" onclick="setFerramenta('select')">Selecionar e Mover</button>
    </div>
    <div class="section">
        <h3>Auxílios</h3>
        <div class="prop-row"><label>Mostrar Grade:</label><input type="checkbox" id="prop-grid-active" onchange="alternarVisibilidadeGrade()"></div>
        <div class="prop-row"><label>Tamanho Grade:</label><input type="number" id="prop-grid-size" value="64" min="8" max="128" onchange="alternarVisibilidadeGrade()"></div>
        <div class="prop-row"><label style="color:#55ff55; font-weight:bold;">Alinhamento Ímã:</label><input type="checkbox" id="prop-snap-active" checked></div>
    </div>
    <div class="section">
        <h3 id="status-modo" style="color:#55ff55;">Criando novos objetos</h3>
        <div class="prop-row"><label>Forma:</label><select id="prop-shape" onchange="atualizarInterfaceForma(); atualizarObjetoExistente();"><option value="box">Retângulo</option><option value="circle">Esfera</option></select></div>
        <div class="prop-row" id="row-w"><label id="label-w">Largura (px):</label><input type="number" id="prop-w" value="100" min="10" max="400" onchange="atualizarObjetoExistente()"></div>
        <div class="prop-row" id="row-h"><label>Altura (px):</label><input type="number" id="prop-h" value="100" min="10" max="400" onchange="atualizarObjetoExistente()"></div>
        <div class="prop-row"><label>Gravidade:</label><input type="checkbox" id="prop-gravity" onchange="atualizarObjetoExistente()"></div>
        
        <div class="prop-row"><label>Fixar Posição (Eixo X/Y):</label><input type="checkbox" id="prop-lock-pos" onchange="atualizarObjetoExistente()"></div>
        <div class="prop-row"><label>Bloquear Rotação:</label><input type="checkbox" id="prop-lock-rot" onchange="atualizarObjetoExistente()"></div>
        <div class="prop-row"><label style="color:#3498db; font-weight:bold;">Resistência a Rotação:</label><input type="number" id="prop-inertia-mult" value="1.0" step="0.2" min="0.1" max="50.0" onchange="atualizarObjetoExistente()"></div>
        
        <div class="prop-row"><label>Massa (Peso):</label><input type="number" id="prop-mass" value="1.0" step="0.1" onchange="atualizarObjetoExistente()"></div>
        <div class="prop-row"><label>Arrasto Ar:</label><input type="number" id="prop-air" value="0.02" step="0.01" onchange="atualizarObjetoExistente()"></div>
        <div class="prop-row"><label>Elasticidade:</label><input type="number" id="prop-bounce" value="0.1" step="0.05" min="0" max="1" onchange="atualizarObjetoExistente()"></div>
        <button id="btn-delete" style="background:#ff4757; display:none; margin-top:5px;" onclick="deletarObjetoSelecionado()">Deletar Objeto</button>
    </div>
</div>
<div id="canvas-container"></div>

<script>
const SCREEN_WIDTH = 1024, SCREEN_HEIGHT = 768, WORLD_WIDTH = 3000, WORLD_HEIGHT = 2000;
const config = {
    type: Phaser.AUTO, width: SCREEN_WIDTH, height: SCREEN_HEIGHT, parent: 'canvas-container', backgroundColor: '#4488aa',
    physics: { default: 'matter', matter: { gravity: { y:1.5 }, debug: false } },
    input: { gamepad: true }, scene: { preload: function(){}, create: create, update: update }
};
const game = new Phaser.Game(config);
let player1, player2, ferramentaAtual = 'create', objetoSelecionado = null, listaObjetosEditaveis = [];
let gridGraphics, garrasAtivas = [], bordasFixasDoCenario = [];
const CAT_AMBIENTE = 0x0001, CAT_PLAYER = 0x0002;

function create() {
    this.matter.world.setBounds(0, 0, WORLD_WIDTH, WORLD_HEIGHT, 100, true, true, true, true);
    this.cameras.main.setBounds(0, 0, WORLD_WIDTH, WORLD_HEIGHT);
    gridGraphics = this.add.graphics().setDepth(1);
    const ambConf = { isStatic:true, label:'ambiente', friction:0.8, restitution:0.1, collisionFilter: { category: CAT_AMBIENTE, mask: CAT_PLAYER | CAT_AMBIENTE } };
    const borda = (s, x, y, w, h) => {
        let b = s.matter.add.rectangle(x, y, w, h, ambConf); b.isStaticBorder = true; bordasFixasDoCenario.push(b);
        s.add.graphics().fillStyle(0x1a1a1a, 1).fillRect(x - w/2, y - h/2, w, h).setDepth(2);
    };
    borda(this, WORLD_WIDTH/2, WORLD_HEIGHT-25, WORLD_WIDTH, 50); borda(this, WORLD_WIDTH/2, 25, WORLD_WIDTH, 50);
    borda(this, 25, WORLD_HEIGHT/2, 50, WORLD_HEIGHT); borda(this, WORLD_WIDTH-25, WORLD_HEIGHT/2, 50, WORLD_HEIGHT);
    this.input.on('pointerdown', (p) => {
        if (ferramentaAtual === 'create') executarCriacaoObjeto(this, p.worldX, p.worldY);
        else executarSelecaoObjeto(this, p.worldX, p.worldY, p);
    });
    this.input.on('pointermove', function(p) {
        if (ferramentaAtual === 'select' && objetoSelecionado && p.isDown) {
            let pos = { x: p.worldX, y: p.worldY };
            if (document.getElementById('prop-snap-active').checked) {
                pos = calcularAlinhamentoPorProximidade(this, pos.x, pos.y, objetoSelecionado.w, objetoSelecionado.h, objetoSelecionado.shape, objetoSelecionado.body);
            }
            this.matter.body.setPosition(objetoSelecionado.body, { x: pos.x, y: pos.y });
            this.matter.body.setVelocity(objetoSelecionado.body, { x:0, y:0 });
            objetoSelecionado.posicaoTravadaX = pos.x; objetoSelecionado.posicaoTravadaY = pos.y;
        }
    }, this);
    this.input.gamepad.on('down', (pad) => {
        if (pad.index === 0 && !player1) player1 = createHeaveHoCharacter(this, 300, WORLD_HEIGHT-150, pad, 0, 0x00ff00);
        if (pad.index === 1 && !player2) player2 = createHeaveHoCharacter(this, 500, WORLD_HEIGHT-150, pad, 1, 0xffff00);
    });
    atualizarInterfaceForma(); alternarVisibilidadeGrade();
}

function alternarVisibilidadeGrade() {
    gridGraphics.clear(); if (!document.getElementById('prop-grid-active').checked) return;
    const gSize = parseInt(document.getElementById('prop-grid-size').value) || 64; gridGraphics.lineStyle(1, 0xffffff, 0.15);
    for (let x = 0; x < WORLD_WIDTH; x += gSize) gridGraphics.lineBetween(x, 0, x, WORLD_HEIGHT);
    for (let y = 0; y < WORLD_HEIGHT; y += gSize) gridGraphics.lineBetween(0, y, WORLD_WIDTH, y);
}
function calcularAlinhamentoPorProximidade(scene, x, y, w, h, shape, ignorarCorpo) {
    let finalX = x, finalY = y; const DISTANCIA_IMA = 20, corpos = scene.matter.world.localWorld.bodies;
    const r = w, mE = x - r, mD = x + r;
    const mT = y - (shape === 'circle' ? w : h/2), mB = y + (shape === 'circle' ? w : h/2);
    for (let i = 0; i < corpos.length; i++) {
        let b = corpos[i]; if (!b || b === ignorarCorpo || b.label !== 'ambiente') continue;
        const oE = b.bounds.min.x, oD = b.bounds.max.x, oT = b.bounds.min.y, oB = b.bounds.max.y;
        if (mD >= oE - DISTANCIA_IMA && mE <= oD + DISTANCIA_IMA) {
            if (Math.abs(mB - oT) < DISTANCIA_IMA) { finalY = oT - (shape === 'circle' ? w : h/2); break; }
            if (Math.abs(mT - oB) < DISTANCIA_IMA) { finalY = oB + (shape === 'circle' ? w : h/2); break; }
        }
        if (mB >= oT - DISTANCIA_IMA && mT <= oB + DISTANCIA_IMA) {
            if (Math.abs(mD - oE) < DISTANCIA_IMA) { finalX = oE - r; break; }
            if (Math.abs(mE - oD) < DISTANCIA_IMA) { finalX = oD + r; break; }
        }
    }
    return { x: finalX, y: finalY };
}
function setFerramenta(tipo) {
    ferramentaAtual = tipo; document.getElementById('btn-select').classList.remove('active'); document.getElementById('btn-create').classList.remove('active');
    document.getElementById(tipo === 'select' ? 'btn-select' : 'btn-create').classList.add('active'); desmarcarObjetoDoEditor();
    let s = document.getElementById('status-modo'); s.innerText = tipo === 'create' ? "Criando objetos" : "Nenhum selecionado"; s.style.color = tipo === 'create' ? "#55ff55" : "#aaa";
}
function atualizarInterfaceForma() {
    const s = document.getElementById('prop-shape').value; document.getElementById('row-h').style.display = s === 'circle' ? 'none' : 'flex';
    document.getElementById('label-w').innerText = s === 'circle' ? "Raio (px):" : "Largura (px):";
}
function extrairCamposPainel() {
    return {
        shape: document.getElementById('prop-shape').value, w: parseFloat(document.getElementById('prop-w').value) || 50, h: parseFloat(document.getElementById('prop-h').value) || 50,
        gravity: document.getElementById('prop-gravity').checked, lockPos: document.getElementById('prop-lock-pos').checked, lockRot: document.getElementById('prop-lock-rot').checked,
        inertiaMult: parseFloat(document.getElementById('prop-inertia-mult').value) || 1.0, mass: parseFloat(document.getElementById('prop-mass').value) || 1, air: parseFloat(document.getElementById('prop-air').value) || 0.02, bounce: parseFloat(document.getElementById('prop-bounce').value) || 0
    };
}
function executarCriacaoObjeto(scene, x, y) {
    let ax = x, ay = y; const c = extrairCamposPainel();
    if (document.getElementById('prop-snap-active').checked) { let pos = calcularAlinhamentoPorProximidade(scene, ax, ay, c.w, c.h, c.shape, null); ax = pos.x; ay = pos.y; }
    let conf = { isStatic: false, label: 'ambiente', ignoreGravity: !c.gravity, mass: c.mass, friction: 0.6, frictionAir: c.air, restitution: c.bounce, collisionFilter: { category: CAT_AMBIENTE, mask: CAT_PLAYER | CAT_AMBIENTE } };
    let body = (c.shape === 'box') ? scene.matter.add.rectangle(ax, ay, c.w, c.h, conf) : scene.matter.add.circle(ax, ay, c.w, conf);
    let novaInercia = c.lockRot ? Infinity : (body.inertia * c.inertiaMult); scene.matter.body.setInertia(body, novaInercia);
    listaObjetosEditaveis.push({ body: body, gfx: scene.add.graphics().setDepth(3), shape: c.shape, w: c.w, h: c.h, gravity: c.gravity, lockPos: c.lockPos, lockRot: c.lockRot, inertiaMult: c.inertiaMult, mass: c.mass, air: c.air, bounce: c.bounce, posicaoTravadaX: ax, posicaoTravadaY: ay, ultimaPos: { x: ax, y: ay }, ultimaRot: 0 });
}
function executarSelecaoObjeto(scene, x, y, pointer) {
    const bodies = scene.matter.world.localWorld.bodies.filter(b => b && b.label === 'ambiente' && !b.isStaticBorder);
    let prox = null, mDist = Infinity;
    bodies.forEach(b => {
        let objRef = listaObjetosEditaveis.find(o => o && o.body === b);
        if (objRef) {
            // CORREÇÃO MOUSE: Usa o detector geométrico real do Matter para saber se o ponteiro clicou dentro da forma rotacionada
            let dentro = scene.matter.vector.contains(b.vertices, { x: x, y: y });
            let dist = Math.sqrt((b.position.x - x)**2 + (b.position.y - y)**2);
            if (dentro && dist < mDist) { mDist = dist; prox = objRef; }
        }
    });
    if (prox) selecionarObjetoDoEditor(prox); else if (!pointer.leftButtonDown()) desmarcarObjetoDoEditor();
}
function selecionarObjetoDoEditor(obj) {
    objetoSelecionado = obj; document.getElementById('btn-delete').style.display = 'block';
    let s = document.getElementById('status-modo'); s.innerText = "Editando selecionado"; s.style.color = "#ffea00";
    document.getElementById('prop-shape').value = obj.shape; document.getElementById('prop-w').value = obj.w; document.getElementById('prop-h').value = obj.h;
    document.getElementById('prop-gravity').checked = obj.gravity; document.getElementById('prop-lock-pos').checked = obj.lockPos;
    document.getElementById('prop-lock-rot').checked = obj.lockRot; document.getElementById('prop-inertia-mult').value = obj.inertiaMult;
    document.getElementById('prop-mass').value = obj.body.mass.toFixed(1); document.getElementById('prop-air').value = obj.body.frictionAir;
    document.getElementById('prop-bounce').value = obj.body.restitution; atualizarInterfaceForma();
}
function desmarcarObjetoDoEditor() { objetoSelecionado = null; document.getElementById('btn-delete').style.display = 'none'; }
function atualizarObjetoExistente() {
    if (ferramentaAtual !== 'select' || !objetoSelecionado) return;
    let obj = objetoSelecionado, scene = game.scene.getScene('default'), c = extrairCamposPainel();
    obj.shape = c.shape; obj.w = c.w; obj.h = c.h; obj.gravity = c.gravity; obj.lockPos = c.lockPos; obj.lockRot = c.lockRot; obj.inertiaMult = c.inertiaMult; obj.mass = c.mass; obj.air = c.air; obj.bounce = c.bounce;
    const px = obj.body.position.x, py = obj.body.position.y; scene.matter.world.remove(obj.body);
    let conf = { isStatic: false, label: 'ambiente', ignoreGravity: !obj.gravity, mass: obj.mass, friction: 0.6, frictionAir: c.air, restitution: c.bounce, collisionFilter: { category: CAT_AMBIENTE, mask: CAT_PLAYER | CAT_AMBIENTE } };
    obj.body = (obj.shape === 'box') ? scene.matter.add.rectangle(px, py, obj.w, obj.h, conf) : scene.matter.add.circle(px, py, obj.w, conf);
    let novaInercia = obj.lockRot ? Infinity : (obj.body.inertia * obj.inertiaMult); scene.matter.body.setInertia(obj.body, novaInercia);
    obj.ultimaPos = { x: px, y: py }; obj.ultimaRot = obj.body.angle;
}
function deletarObjetoSelecionado() {
    if (!objetoSelecionado) return; let scene = game.scene.getScene('default');
    if (scene?.matter?.world) scene.matter.world.remove(objetoSelecionado.body);
    objetoSelecionado.gfx.clear(); listaObjetosEditaveis = listaObjetosEditaveis.filter(o => o !== objetoSelecionado); desmarcarObjetoDoEditor();
}
function desenharObjetoEditor(obj) {
    if (!obj?.body) return; let g = obj.gfx; g.clear(); g.x = obj.body.position.x; g.y = obj.body.position.y; g.rotation = obj.body.angle;
    g.fillStyle((obj === objetoSelecionado) ? 0xffea00 : 0xe67e22, 1).lineStyle(2, 0xffffff, 0.6);
    if (obj.shape === 'box') { g.fillRect(-obj.w/2, -obj.h/2, obj.w, obj.h); g.strokeRect(-obj.w/2, -obj.h/2, obj.w, obj.h); }
    else { g.fillCircle(0, 0, obj.w); g.strokeCircle(0, 0, obj.w); g.lineBetween(0, 0, obj.w, 0); }
}
function createArmSegment(scene, bA, bB, num, len, id, grp, list) {
    let last = bA;
    for (let i = 0; i < num; i++) {
        const lastLink = (i === num - 1);
        let link = lastLink ? bB : scene.matter.add.rectangle(bA.position.x, bA.position.y, 10, len, { density: 0.005, frictionAir: 0.02, label: `p${id}_braco`, collisionFilter: { category: CAT_PLAYER, mask: CAT_AMBIENTE | CAT_PLAYER, group: grp } });
        if (!lastLink) list.push(link);
        scene.matter.add.constraint(last, link, len, 1.0, { pointA: last === bA ? { x:0, y:0 } : { x:0, y: len/2 }, pointB: lastLink ? { x:0, y:0 } : { x:0, y: -len/2 } });
        link.ultimaPos = { x: bA.position.x, y: bA.position.y }; link.ultimaRot = 0; last = link;
    }
}
function executarRespawnIndividual(scene, pNum) {
    const cList = scene.matter.world.localWorld.constraints, pref = `p${pNum}_`;
    const p = (pNum === 0) ? player1 : player2; if (!p) return;
    for (let i = cList.length - 1; i >= 0; i--) { let c = cList[i]; if (c && ((c.bodyA?.label?.includes(pref)) || (c.bodyB?.label?.includes(pref)))) scene.matter.world.remove(c); }
    scene.matter.world.remove(p.body); scene.matter.world.remove(p.leftHand); scene.matter.world.remove(p.rightHand);
    p.leftElos.forEach(e => scene.matter.world.remove(e)); p.rightElos.forEach(e => scene.matter.world.remove(e)); p.gfx.clear();
    if (pNum === 0) player1 = createHeaveHoCharacter(scene, 300, WORLD_HEIGHT - 150, p.pad, 0, 0x00ff00);
    else player2 = createHeaveHoCharacter(scene, 500, WORLD_HEIGHT - 150, p.pad, 1, 0xffff00);
}
function createHeaveHoCharacter(scene, x, y, pad, id, col) {
    const grp = scene.matter.world.nextGroup(true), flt = { category: CAT_PLAYER, mask: CAT_AMBIENTE | CAT_PLAYER, group: grp };
    const b = scene.matter.add.circle(x, y, 22, { friction: 0.3, density: 0.05, label: `p${id}_body`, collisionFilter: flt });
    const lH = scene.matter.add.circle(x - 50, y, 14, { density: 0.01, friction: 0.8, frictionAir: 0.01, label: `p${id}_leftHand`, collisionFilter: flt });
    const rH = scene.matter.add.circle(x + 50, y, 14, { density: 0.01, friction: 0.8, frictionAir: 0.01, label: `p${id}_rightHand`, collisionFilter: flt });
    b.ultimaPos = { x: x, y: y }; b.ultimaRot = 0; lH.ultimaPos = { x: x-50, y: y }; lH.ultimaRot = 0; rH.ultimaPos = { x: x+50, y: y }; rH.ultimaRot = 0;
    let lL = [], rL = []; createArmSegment(scene, b, lH, 3, 16, id, grp, lL); createArmSegment(scene, b, rH, 3, 16, id, grp, rL);
    return { id: id, body: b, leftHand: lH, rightHand: rH, leftElos: lL, rightElos: rL, gfx: scene.add.graphics().setDepth(10), bodyColor: col, pad: pad, leftJoint: null, rightJoint: null };
}
function aplicarLimiteFrame(scene, body, maxDist, maxRot) {
    if (!body || !body.position) return;
    if (body.ultimaPos) {
        let dx = body.position.x - body.ultimaPos.x, dy = body.position.y - body.ultimaPos.y, distSq = dx*dx + dy*dy;
        if (distSq > maxDist * maxDist) {
            let dist = Math.sqrt(distSq);
            scene.matter.body.setPosition(body, { x: body.ultimaPos.x + (dx / dist) * maxDist, y: body.ultimaPos.y + (dy / dist) * maxDist });
            scene.matter.body.setVelocity(body, { x: (dx/dist)*2, y: (dy/dist)*2 });
        }
    }
    if (body.ultimaRot !== undefined) {
        let dRot = body.angle - body.ultimaRot;
        if (Math.abs(dRot) > maxRot) { scene.matter.body.setAngle(body, body.ultimaRot + Math.sign(dRot) * maxRot); body.angularVelocity = Math.sign(dRot) * 0.01; }
    }
    body.ultimaPos = { x: body.position.x, y: body.position.y }; body.ultimaRot = body.angle;
}
function update() {
    let sAct = game.scene.getScene('default'); if (!sAct) return;
    if (player1) { handlePlayerInput(this, player1); desenharJogador(player1); } if (player2) { handlePlayerInput(this, player2); desenharJogador(player2); }
    [player1, player2].forEach(p => { if (!p) return; aplicarLimiteFrame(sAct, p.body, 10, 0.08); aplicarLimiteFrame(sAct, p.leftHand, 12, 0.1); aplicarLimiteFrame(sAct, p.rightHand, 12, 0.1); p.leftElos.forEach(elo => aplicarLimiteFrame(sAct, elo, 10, 0.1)); p.rightElos.forEach(elo => aplicarLimiteFrame(sAct, elo, 10, 0.1)); });
    garrasAtivas = []; if (player1) { if (player1.leftJoint) garrasAtivas.push(player1.leftJointTarget); if (player1.rightJoint) garrasAtivas.push(player1.rightJointTarget); } if (player2) { if (player2.leftJoint) garrasAtivas.push(player2.leftJointTarget); if (player2.rightJoint) garrasAtivas.push(player2.rightJointTarget); }
    listaObjetosEditaveis.forEach(obj => {
        if (!obj?.body?.velocity) return; const agarrado = garrasAtivas.includes(obj.body);
        if (obj.torque !== 0.0 && !obj.lockRot) { sAct.matter.body.setAngularVelocity(obj.body, obj.body.angularVelocity + (obj.torque * 0.005)); }
        if (obj.lockPos) { sAct.matter.body.setPosition(obj.body, { x: obj.posicaoTravadaX, y: obj.posicaoTravadaY }); sAct.matter.body.setVelocity(obj.body, { x:0, y:0 }); }
        if (!obj.lockPos || agarrado) aplicarLimiteFrame(sAct, obj.body, agarrado ? 5 : 8, agarrado ? 0.02 : 0.04);
        desenharObjetoEditor(obj); obj.body.frictionAir = agarrado ? 0.25 : obj.air;
        const maxV = agarrado ? 6 : 14; let v = obj.body.velocity;
        if (Math.abs(v.x) > maxV || Math.abs(v.y) > maxV) sAct?.matter?.body?.setVelocity(obj.body, { x: Phaser.Math.Clamp(v.x, -maxV, maxV), y: Phaser.Math.Clamp(v.y, -maxV, maxV) });
    });
    if (player1 && player2) {
        const mX = (player1.body.position.x + player2.body.position.x) / 2, mY = (player1.body.position.y + player2.body.position.y) / 2;
        let z = Math.min(SCREEN_WIDTH / (Math.abs(player1.body.position.x - player2.body.position.x) + 250), SCREEN_HEIGHT / (Math.abs(player1.body.position.y - player2.body.position.y) + 250));
        z = Phaser.Math.Clamp(z, 0.45, 1.0); this.cameras.main.scrollX = Phaser.Math.Linear(this.cameras.main.scrollX, (mX - SCREEN_WIDTH / 2), 0.08);
        this.cameras.main.scrollY = Phaser.Math.Linear(this.cameras.main.scrollY, (mY - SCREEN_HEIGHT / 2), 0.08); this.cameras.main.setZoom(Phaser.Math.Linear(this.cameras.main.zoom, z, 0.05));
    } else if (player1) { this.cameras.main.centerOn(player1.body.position.x, player1.body.position.y); }
}
function isButtonPressed(p, i) { return p.buttons[i] ? (p.buttons[i].pressed || p.buttons[i].value > 0.1) : false; }
function desenharJogador(p) {
    const g = p.gfx; g.clear(); const lL = isButtonPressed(p.pad, 6) || isButtonPressed(p.pad, 4), rR = isButtonPressed(p.pad, 7) || isButtonPressed(p.pad, 5); g.lineStyle(12, 0x000000, 1);
    const fil = (el, m) => { g.beginPath(); g.moveTo(p.body.position.x, p.body.position.y); el.forEach(e => g.lineTo(e.position.x, e.position.y)); g.lineTo(m.position.x, m.position.y); g.strokePath(); };
    fil(p.leftElos, p.leftHand); fil(p.rightElos, p.rightHand); g.fillStyle(p.bodyColor, 1).fillCircle(p.body.position.x, p.body.position.y, 22);
    g.fillStyle(lL ? 0xff8888 : 0xff0000, 1).fillCircle(p.leftHand.position.x, p.leftHand.position.y, 14).fillStyle(rR ? 0x8888ff : 0x0000ff, 1).fillCircle(p.rightHand.position.x, p.rightHand.position.y, 14);
}
// CORREÇÃO DA GARRA: Filtra colisões físicas exatas usando o detector de intersecção poligonal real do Matter.js
function processarGarra(s, p, h, jKey, grab, enemy) {
    if (grab && !p[jKey]) {
        const todosOsCorpos = s.matter.world.localWorld.bodies;
        const alvoValido = todosOsCorpos.find(b => {
            if (b.label !== 'ambiente' && !b.label.startsWith(enemy)) return false;
            
            // Usa o Matter.Query.collides nativo para testar se as formas geométricas colidiram de verdade (pele com casca)
            let colisaoReal = s.matter.Query.collides(h, [b]);
            return (colisaoReal && colisaoReal.length > 0);
        });
        if (alvoValido) { 
            p[jKey] = s.matter.add.constraint(h, alvoValido, 0, 0.15, { 
                pointA: { x:0, y:0 }, 
                pointB: { x: h.position.x - alvoValido.position.x, y: h.position.y - alvoValido.position.y } 
            }); 
            p[jKey + 'Target'] = alvoValido; 
        }
    } else if (!grab && p[jKey]) { s.matter.world.remove(p[jKey]); p[jKey] = null; p[jKey + 'Target'] = null; }
}
function handlePlayerInput(s, p) {
    const pad = p.pad; if (!pad) return; const lL = isButtonPressed(pad, 6) || isButtonPressed(pad, 4), rR = isButtonPressed(pad, 7) || isButtonPressed(pad, 5), enemy = p.id === 0 ? "p1_" : "p0_";
    if (isButtonPressed(pad, 8)) { PlayerId = p.id; executarRespawnIndividual(s, PlayerId); return; }
    let mL = 1.0, mR = 1.0; if (p.leftJoint && p.rightJoint && p.leftJointTarget === p.rightJointTarget && !p.leftJointTarget.isStatic) { mL = 0.5; mR = 0.5; }
    if (pad.leftStick) {
        let f = p.leftJoint ? p.body : p.leftHand, m = p.leftJoint ? 0.045 : 0.018; s.matter.body.applyForce(f, f.position, { x: pad.leftStick.x * m, y: pad.leftStick.y * m });
        if (p.leftJoint && p.leftJointTarget && !p.leftJointTarget.isStatic) s.matter.body.applyForce(p.leftJointTarget, p.leftHand.position, { x: -pad.leftStick.x * m * 0.9 * mL, y: -pad.leftStick.y * m * 0.9 * mL });
    }
    if (pad.rightStick) {
        let f = p.rightJoint ? p.body : p.rightHand, m = p.rightJoint ? 0.045 : 0.018; s.matter.body.applyForce(f, f.position, { x: pad.rightStick.x * m, y: pad.rightStick.y * m });
        if (p.rightJoint && p.rightJointTarget && !p.rightJointTarget.isStatic) s.matter.body.applyForce(p.rightJointTarget, p.rightHand.position, { x: -pad.rightStick.x * m * 0.9 * mR, y: -pad.rightStick.y * m * 0.9 * mR });
    }
    processarGarra(s, p, p.leftHand, 'leftJoint', lL, enemy); processarGarra(s, p, p.rightHand, 'rightJoint', rR, enemy);
}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Clone Heave Ho - Multiplayer Local</title>
    <style>
        body { margin: 0; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        canvas { box-shadow: 0 0 20px rgba(0,0,0,0.8); }
    </style>
    <!-- ALTERADO: Agora aponta para o arquivo local dentro do seu repositório -->
    <script src="phaser.min.js"></script>
</head>
<body>

<script>
const config = {
    type: Phaser.AUTO,
    width: 1024,
    height: 768,
    backgroundColor: '#4488aa',
    physics: {
        default: 'matter',
        matter: {
            gravity: { y: 1 },
            debug: true // Linhas verdes ajudam a ver as juntas e conexões físicas
        }
    },
    input: { gamepad: true },
    scene: { preload: preload, create: create, update: update }
};

const game = new Phaser.Game(config);
let player1, player2;

function preload() {}

function create() {
    this.add.text(20, 20, "Conecte os Controles. L2/R2 (ou L1/R1) para AGARRAR.", { font: "20px Arial", fill: "#ffffff" });

    // Criando o chão e blocos fixos no cenário
    this.matter.add.rectangle(512, 700, 900, 50, { isStatic: true }); 
    this.matter.add.rectangle(200, 450, 250, 40, { isStatic: true }); 
    this.matter.add.rectangle(800, 350, 250, 40, { isStatic: true }); 

    // Sistema de detecção de novos controles
    this.input.gamepad.on('down', (pad, button, index) => {
        if (pad.index === 0 && !player1) {
            player1 = createHeaveHoCharacter(this, 200, 300, '#ff4757', pad);
        }
        if (pad.index === 1 && !player2) {
            player2 = createHeaveHoCharacter(this, 800, 200, '#1e90ff', pad);
        }
    });
}

function createHeaveHoCharacter(scene, x, y, color, gamepad) {
    // Corpo principal do boneco
    const body = scene.matter.add.circle(x, y, 25, { friction: 0.1, label: 'body' });
    
    // Mãos (esquerda e direita)
    const leftHand = scene.matter.add.circle(x - 50, y, 15, { frictionAir: 0.02, label: 'leftHand' });
    const rightHand = scene.matter.add.circle(x + 50, y, 15, { frictionAir: 0.02, label: 'rightHand' });

    // Juntas físicas que ligam os braços ao corpo
    scene.matter.add.constraint(body, leftHand, 60, 0.2);
    scene.matter.add.constraint(body, rightHand, 60, 0.2);

    return {
        body: body,
        leftHand: leftHand,
        rightHand: rightHand,
        pad: gamepad,
        leftJoint: null, // Armazena a trava se a mão esquerda agarrar algo
        rightJoint: null  // Armazena a trava se a mão direita agarrar algo
    };
}

function update() {
    if (player1) handlePlayerInput(this, player1);
    if (player2) handlePlayerInput(this, player2);
}

function handlePlayerInput(scene, player) {
    const pad = player.pad;
    if (!pad) return;

    // 1. MOVIMENTAÇÃO DOS BRAÇOS (Analógicos)
    if (pad.leftStick) {
        scene.matter.body.applyForce(player.leftHand, player.leftHand.position, { x: pad.leftStick.x * 0.003, y: pad.leftStick.y * 0.003 });
    }
    if (pad.rightStick) {
        scene.matter.body.applyForce(player.rightHand, player.rightHand.position, { x: pad.rightStick.x * 0.003, y: pad.rightStick.y * 0.003 });
    }

    // 2. SISTEMA DE GARRA (MÃO ESQUERDA)
    // Gatilho L2 (botão index 6) ou L1 (botão index 4) para controles comuns
    const grabbingLeft = pad.buttons[6].pressed || pad.buttons[4].pressed;
    
    if (grabbingLeft && !player.leftJoint) {
        // Procura corpos estáticos próximos à mão esquerda para fixar
        const targets = scene.matter.query.point(scene.matter.world.localWorld.bodies, player.leftHand.position);
        const staticTarget = targets.find(b => b.isStatic && b.label !== 'leftHand');
        
        if (staticTarget) {
            // Cria um elo físico permanente entre a mão e o cenário
            player.leftJoint = scene.matter.add.constraint(player.leftHand, staticTarget, 0, 1, {
                pointA: { x: 0, y: 0 },
                pointB: { x: player.leftHand.position.x - staticTarget.position.x, y: player.leftHand.position.y - staticTarget.position.y }
            });
        }
    } else if (!grabbingLeft && player.leftJoint) {
        // Solta o botão: destrói a trava física imediatamente
        scene.matter.world.remove(player.leftJoint);
        player.leftJoint = null;
    }

    // 3. SISTEMA DE GARRA (MÃO DIREITA)
    // Gatilho R2 (botão index 7) ou R1 (botão index 5)
    const grabbingRight = pad.buttons[7].pressed || pad.buttons[5].pressed;

    if (grabbingRight && !player.rightJoint) {
        const targets = scene.matter.query.point(scene.matter.world.localWorld.bodies, player.rightHand.position);
        const staticTarget = targets.find(b => b.isStatic && b.label !== 'rightHand');
        
        if (staticTarget) {
            player.rightJoint = scene.matter.add.constraint(player.rightHand, staticTarget, 0, 1, {
                pointA: { x: 0, y: 0 },
                pointB: { x: player.rightHand.position.x - staticTarget.position.x, y: player.rightHand.position.y - staticTarget.position.y }
            });
        }
    } else if (!grabbingRight && player.rightJoint) {
        scene.matter.world.remove(player.rightJoint);
        player.rightJoint = null;
    }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>bbbbbbbbbbbbbbbb</title>
    <script src="phaser.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #111; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        #editor-ui { position: absolute; top: 10px; left: 10px; width: 280px; max-height: calc(100vh - 40px); background: rgba(20, 20, 20, 0.95); border: 2px solid #444; border-radius: 8px; color: #fff; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 10px; z-index: 1000; overflow-y: auto; }
        #editor-ui::-webkit-scrollbar { width: 6px; }
        #editor-ui::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
        h3 { margin: 0 0 5px 0; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #3498db; border-bottom: 1px solid #333; padding-bottom: 4px; }
        .section { display: flex; flex-direction: column; gap: 6px; margin-bottom: 5px; }
        .prop-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12px; }
        .prop-row label { flex: 1; color: #ccc; }
        .prop-row input[type="number"], .prop-row select, .prop-row input[type="text"] { width: 90px; background: #222; border: 1px solid #444; color: #fff; padding: 4px 6px; border-radius: 4px; font-size: 12px; }
        .prop-row input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
        button { background: #2980b9; border: none; color: white; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background 0.2s, transform 0.1s; font-size: 12px; }
        button:hover { background: #3498db; }
        button:active { transform: scale(0.98); }
        button.active { background: #27ae60 !important; border: 2px solid #fff; }
        #btn-delete { background: #c0392b; display: none; }
        #btn-delete:hover { background: #e74c3c; }
        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        #alerta-salvamento { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: #27ae60; color: white; padding: 10px 20px; border-radius: 20px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: none; z-index: 2000; }
    </style>
</head>
<body>

<div id="canvas-container"></div>

<div id="editor-ui">
    <div class="section" style="background:#2c3e50; padding:8px; border-radius:4px; margin-bottom:5px;">
        <h3 style="color:#3498db; font-weight:bold;">Ajuste do Ragdoll</h3>
        <div class="prop-row">
            <label style="color:#fff; font-size:11px;">Modificador Peso Queda:</label>
            <input type="number" id="prop-fall-weight-mod" value="1.0" min="0.0" step="0.1" onchange="if(this.value<0)this.value=0;">
        </div>
    </div>
    
    <div class="section">
        <h3>Controles</h3>
        <p style="font-size:11px; color:#aaa; margin:0;">Use as <b>Setas</b> para mover a câmera. No modo Polígono, clique na tela para criar vértices e aperte Enter para finalizar.</p>
    </div>
    
    <div class="btn-row">
        <button id="btn-create" class="active" onclick="setFerramenta('create')">Criar Objeto</button>
        <button id="btn-select" onclick="setFerramenta('select')">Selecionar/Mover</button>
    </div>
    
    <div class="section">
        <h3>Auxílios</h3>
        <div class="prop-row"><label>Mostrar Grade:</label><input type="checkbox" id="prop-grid-active" checked onchange="alternarVisibilidadeGrade()"></div>
        <div class="prop-row"><label>Tamanho Grade:</label><input type="number" id="prop-grid-size" value="64" min="8" max="128" onchange="alternarVisibilidadeGrade()"></div>
        <div class="prop-row"><label style="color:#55ff55; font-weight:bold;">Alinhamento Ímã:</label><input type="checkbox" id="prop-snap-active" checked></div>
    </div>
    
    <div class="section">
        <h3 id="status-modo" style="color:#55ff55;">Criando novos objetos</h3>
        <div class="prop-row">
            <label>Forma:</label>
            <select id="prop-shape" onchange="atualizarInterfaceForma(); atualizarObjetoExistente();">
                <option value="box">Retângulo</option>
                <option value="circle">Esfera</option>
                <option value="polygon">Polígono Customizado</option>
                <option value="rope">Corda / Corrente</option>
            </select>
        </div>
        <div id="painel-propriedades-comuns">
            <div class="prop-row" style="background:#27ae60; padding:6px; border-radius:4px;"><label style="color:#fff; font-weight:bold;">Objeto Manuseável:</label><input type="checkbox" id="prop-manuseavel" onchange="atualizarObjetoExistente()"></div>
            <div class="prop-row"><label>Fixar no Ar (Estático):</label><input type="checkbox" id="prop-is-static" checked onchange="atualizarObjetoExistente()"></div>
            <div class="prop-row" id="row-w"><label>Largura (Raio):</label><input type="number" id="prop-w" value="64" min="4" onchange="atualizarObjetoExistente()"></div>
            <div class="prop-row" id="row-h"><label>Altura:</label><input type="number" id="prop-h" value="64" min="4" onchange="atualizarObjetoExistente()"></div>
            <div class="prop-row"><label>Sofrer Gravidade:</label><input type="checkbox" id="prop-gravity" onchange="atualizarObjetoExistente()"></div>
            <div class="prop-row"><label>Fixar posição (Eixo X/Y):</label><input type="checkbox" id="prop-lock-pos" onchange="atualizarObjetoExistente()"></div>
            <div class="prop-row"><label>Bloquear Rotação:</label><input type="checkbox" id="prop-lock-rot" onchange="atualizarObjetoExistente()"></div>
            <div class="prop-row" id="row-mass"><label>Massa (Peso):</label><input type="number" id="prop-mass" value="1.0" step="0.1" onchange="atualizarObjetoExistente()"></div>
            <div class="prop-row" id="row-air"><label>Arrasto Ar:</label><input type="number" id="prop-air" value="0.02" step="0.01" onchange="atualizarObjetoExistente()"></div>
            <div class="prop-row" id="row-bounce"><label>Elasticidade:</label><input type="number" id="prop-bounce" value="0.1" step="0.05" min="0" max="1" onchange="atualizarObjetoExistente()"></div>
            <!-- INPUTS ADICIONADOS PARA LIMITES DE VELOCIDADE INDIVIDUAIS -->
            <div class="prop-row" id="row-max-vel"><label style="color:#ffaa00;">Limite Vel. (px):</label><input type="number" id="prop-max-vel" value="0" min="0" max="100" step="1" title="0 significa sem limite" onchange="atualizarObjetoExistente()"></div>
            <div class="prop-row" id="row-max-rot"><label style="color:#ffaa00;">Limite Giro (rad):</label><input type="number" id="prop-max-rot" value="0" min="0" max="2" step="0.01" title="0 significa sem limite" onchange="atualizarObjetoExistente()"></div>
        </div>
        
        <div id="painel-propriedades-corda" style="display:none; background:#8e44ad; padding:8px; border-radius:4px; flex-direction:column; gap:6px;">
            <div class="prop-row"><label style="color:#fff;">Comprimento Total:</label><input type="number" id="prop-rope-len" value="192" min="32"></div>
            <div class="prop-row"><label style="color:#fff;">Qtd Segmentos:</label><input type="number" id="prop-rope-segments" value="6" min="2" max="30"></div>
            <div class="prop-row"><label style="color:#fff;">Cor da Corda:</label><input type="color" id="prop-rope-color" value="#7f8c8d"></div>
        </div>
    </div>
    
    <div class="section" style="border-top:1px solid #333; padding-top:10px;">
        <button id="btn-delete" onclick="deletarObjetoSelecionado()">Excluir Selecionado</button>
        <button id="btn-toggle-editor" style="background:#e67e22;" onclick="alternarModoEditor()">Testar Fase (Jogar)</button>
    </div>
</div>

<div id="alerta-salvamento">Fase salva com sucesso na memória!</div>

<script>
const SCREEN_WIDTH = 1280, SCREEN_HEIGHT = 720, WORLD_WIDTH = 3200, WORLD_HEIGHT = 1200;
const CAT_AMBIENTE = 0x0001, CAT_PLAYER = 0x0002;

let config = {
    type: Phaser.AUTO, width: SCREEN_WIDTH, height: SCREEN_HEIGHT, parent: 'canvas-container',
    physics: { default: 'matter', matter: { gravity: { y: 1.2 }, debug: true, constraintIterations: 4 } },
    scene: { preload: preload, create: create, update: update }
};

let game = new Phaser.Game(config);
let player1 = null, player2 = null;
let cursorsKeyboard, cursors;
let modoEditorAtivo = true, ferramentaAtual = 'create', objetoSelecionado = null;
let listaObjetosEditaveis = [], bordasFixasDoCenario = [], verticesCriacaoAtiva = [];
let gridGraphics, previewGraphicsPoligono;

function preload() {}

function create() {
    this.cameras.main.setBounds(0, 0, WORLD_WIDTH, WORLD_HEIGHT);
    this.matter.world.setBounds(0, 0, WORLD_WIDTH, WORLD_HEIGHT, 64, true, true, true, true);
    
    // Armazena as 4 bordas pretas limites fixas do mundo Matter para colisões das mãos
    this.matter.world.walls.left.label = 'borda_fixa';
    this.matter.world.walls.right.label = 'borda_fixa';
    this.matter.world.walls.top.label = 'borda_fixa';
    this.matter.world.walls.bottom.label = 'borda_fixa';
    bordasFixasDoCenario = [this.matter.world.walls.left, this.matter.world.walls.right, this.matter.world.walls.top, this.matter.world.walls.bottom];
    
    gridGraphics = this.add.graphics().setDepth(1);
    previewGraphicsPoligono = this.add.graphics().setDepth(9999);
    alternarVisibilidadeGrade();
    
    cursorsKeyboard = this.input.keyboard.createCursorKeys();
    cursors = this.input.keyboard.addKeys({
        up: Phaser.Input.Keyboard.KeyCodes.W, down: Phaser.Input.Keyboard.KeyCodes.S,
        left: Phaser.Input.Keyboard.KeyCodes.A, right: Phaser.Input.Keyboard.KeyCodes.D,
        respawnP1: Phaser.Input.Keyboard.KeyCodes.R, respawnP2: Phaser.Input.Keyboard.KeyCodes.P,
        actionL1: Phaser.Input.Keyboard.KeyCodes.C, actionR1: Phaser.Input.Keyboard.KeyCodes.V,
        actionL2: Phaser.Input.Keyboard.KeyCodes.N, actionR2: Phaser.Input.Keyboard.KeyCodes.M
    });
    this.input.keyboard.on('keydown-ENTER', () => {
        if (modoEditorAtivo && document.getElementById('prop-shape').value === 'polygon') {
            finalizarCriacaoPoligono(this);
        }
    });

    this.input.keyboard.on('keydown-TAB', (event) => {
        event.preventDefault();
        alternarModoEditor();
    });

    // LISTENER DE CLIQUE: Inicializa o preview e guarda vértices de forma síncrona com a rolagem da câmera
    this.input.on('pointerdown', (p) => {
        if (!modoEditorAtivo) return;
        if (document.getElementById('prop-shape').value === 'polygon') {
            if (!this.listaBolinhasGuiaCena) { this.listaBolinhasGuiaCena = []; }
            if (!previewGraphicsPoligono) { previewGraphicsPoligono = this.add.graphics().setDepth(9999); }
            
            verticesCriacaoAtiva.push({ x: p.worldX, y: p.worldY });
            console.log(`[POLÍGONO] Vértice adicionado: X=${Math.round(p.worldX)}, Y=${Math.round(p.worldY)}`);
            
            let bolaVisual = this.add.circle(p.worldX, p.worldY, 7, 0xff0000).setStrokeStyle(2, 0xffffff).setDepth(9999);
            this.listaBolinhasGuiaCena.push(bolaVisual);
            
            previewGraphicsPoligono.clear();
            if (verticesCriacaoAtiva.length > 1) {
                previewGraphicsPoligono.lineStyle(3, 0xff0000, 0.9);
                previewGraphicsPoligono.beginPath();
                previewGraphicsPoligono.moveTo(verticesCriacaoAtiva[0].x, verticesCriacaoAtiva[0].y);
                for (let i = 1; i < verticesCriacaoAtiva.length; i++) {
                    previewGraphicsPoligono.lineTo(verticesCriacaoAtiva[i].x, verticesCriacaoAtiva[i].y);
                }
                previewGraphicsPoligono.strokePath();
            }
        } else if (ferramentaAtual === 'create') {
            executarCriacaoObjeto(this, p.worldX, p.worldY);
        } else {
            executarSelecaoObjeto(this, p.worldX, p.worldY, p);
        }
    });

    configurarEventosDeColisao(this);
    document.getElementById('prop-manuseavel').checked = false;
    atualizarInterfaceForma();
}

function alternarVisibilidadeGrade() {
    gridGraphics.clear();
    if (!document.getElementById('prop-grid-active').checked) return;
    let size = parseInt(document.getElementById('prop-grid-size').value) || 64;
    gridGraphics.lineStyle(1, 0x333333, 0.5);
    for (let x = 0; x < WORLD_WIDTH; x += size) { gridGraphics.lineBetween(x, 0, x, WORLD_HEIGHT); }
    for (let y = 0; y < WORLD_HEIGHT; y += size) { gridGraphics.lineBetween(0, y, WORLD_WIDTH, y); }
}

function setFerramenta(modo) {
    ferramentaAtual = modo;
    document.getElementById('btn-create').classList.toggle('active', modo === 'create');
    document.getElementById('btn-select').classList.toggle('active', modo === 'select');
    if (modo === 'create' && objetoSelecionado) { desmarcarObjeto(); }
}

function atualizarInterfaceForma() {
    let shape = document.getElementById('prop-shape').value;
    let cordaAtiva = (shape === 'rope');
    document.getElementById('painel-propriedades-comuns').style.display = cordaAtiva ? 'none' : 'flex';
    document.getElementById('painel-propriedades-corda').style.display = cordaAtiva ? 'flex' : 'none';
    document.getElementById('row-h').style.display = (shape === 'box') ? 'flex' : 'none';
    document.getElementById('row-w').style.substring = (shape === 'box') ? 'Largura:' : ((shape === 'circle') ? 'Raio:' : '');
    document.getElementById('row-w').style.display = (shape === 'polygon' || shape === 'rope') ? 'none' : 'flex';
}
function extrairCamposPainel() {
    return {
        shape: document.getElementById('prop-shape').value, manuseavel: document.getElementById('prop-manuseavel').checked, isStatic: document.getElementById('prop-is-static').checked,
        w: parseFloat(document.getElementById('prop-w').value) || 64, h: parseFloat(document.getElementById('prop-h').value) || 64,
        gravity: document.getElementById('prop-gravity').checked, lockPos: document.getElementById('prop-lock-pos').checked, lockRot: document.getElementById('prop-lock-rot').checked,
        mass: parseFloat(document.getElementById('prop-mass').value) || 1, air: parseFloat(document.getElementById('prop-air').value) || 0.02, bounce: parseFloat(document.getElementById('prop-bounce').value) || 0,
        ropeLen: parseFloat(document.getElementById('prop-rope-len').value) || 192, ropeSegments: parseInt(document.getElementById('prop-rope-segments').value) || 6, ropeColor: document.getElementById('prop-rope-color').value,
        // CAPTURA DOS NOVOS LIMITES DE VELOCIDADE DA BARRA LATERAL
        maxVel: parseFloat(document.getElementById('prop-max-vel').value) || 0,
        maxRot: parseFloat(document.getElementById('prop-max-rot').value) || 0
    };
}

function executarCriacaoObjeto(scene, x, y) {
    let ax = x, ay = y;
    if (document.getElementById('prop-snap-active').checked) {
        let size = parseInt(document.getElementById('prop-grid-size').value) || 64;
        ax = Math.round(x / size) * size; ay = Math.round(y / size) * size;
    }
    const c = extrairCamposPainel();
    if (c.shape === 'rope') {
        let elos = [], constraints = []; let segmentLen = c.ropeLen / c.ropeSegments; let lastBody = null;
        for (let i = 0; i < c.ropeSegments; i++) {
            let elo = scene.matter.add.rectangle(ax, ay + (i * segmentLen) + segmentLen/2, 14, (i === c.ropeSegments - 1) ? segmentLen : (segmentLen + 6), { 
                isStatic: false, isSensor: true, density: 0.008, frictionAir: 0.008, label: 'corpo_elo',
                collisionFilter: { category: CAT_AMBIENTE, mask: CAT_PLAYER | CAT_AMBIENTE } 
            });
            elo.manuseavel = false; elos.push(elo);
            if (i === 0) constraints.push(scene.matter.add.worldConstraint(elo, 0, 1.0, { pointA: { x: ax, y: ay }, pointB: { x: 0, y: -segmentLen/2 } }));
            else constraints.push(scene.matter.add.constraint(lastBody, elo, 0, 1.0, { pointA: { x: 0, y: segmentLen/2 }, pointB: { x: 0, y: -segmentLen/2 } }));
            lastBody = elo;
        }
        listaObjetosEditaveis.push({ body: null, gfx: scene.add.graphics().setDepth(3), shape: 'rope', w: 14, h: c.ropeLen, ropeElos: elos, ropeConstraints: constraints, ropeColor: c.ropeColor, ropeSegments: c.ropeSegments, ropeLen: c.ropeLen, maxVel: 0, maxRot: 0, posicaoTravadaX: ax, posicaoTravadaY: ay, visualX: ax, visualY: ay, manuseavel: false });
        return;
    }
    let conf = { isStatic: c.isStatic, label: 'ambiente', ignoreGravity: !c.gravity, mass: c.mass, friction: 0.8, frictionAir: c.air, restitution: c.bounce, collisionFilter: { category: CAT_AMBIENTE, mask: CAT_PLAYER | CAT_AMBIENTE } };
    let body = (c.shape === 'box') ? scene.matter.add.rectangle(ax, ay, c.w, c.h, conf) : scene.matter.add.circle(ax, ay, c.w, conf);
    body.manuseavel = c.manuseavel; if (!body.isStatic) { scene.matter.body.setInertia(body, c.lockRot ? Infinity : body.inertia); }
    // Armazena propriedades de teto maxVel e maxRot na estrutura do objeto
    listaObjetosEditaveis.push({ body: body, shape: c.shape, w: c.w, h: c.h, gravity: c.gravity, lockPos: c.lockPos, lockRot: c.lockRot, mass: c.mass, air: c.air, bounce: c.bounce, maxVel: c.maxVel, maxRot: c.maxRot, posicaoTravadaX: ax, posicaoTravadaY: ay, physicsActive: true, visualX: ax, visualY: ay, dadosDesenhoVisual: null, manuseavel: c.manuseavel, isStatic: c.isStatic, gfx: scene.add.graphics().setDepth(3) });
}

function limparBolinhasGuiaDoPoligono(scene) {
    if (typeof previewGraphicsPoligono !== 'undefined' && previewGraphicsPoligono) { previewGraphicsPoligono.clear(); }
    if (scene && scene.listaBolinhasGuiaCena) {
        scene.listaBolinhasGuiaCena.forEach(bola => { if (bola && bola.destroy) { bola.destroy(); } });
        scene.listaBolinhasGuiaCena = [];
    }
}

function finalizarCriacaoPoligono(scene) {
    if (verticesCriacaoAtiva.length < 3) { alert("Polígonos precisam de pelo menos 3 vértices!"); return; }
    const c = extrairCamposPainel();
    let somatorioX = 0, somatorioY = 0; verticesCriacaoAtiva.forEach(v => { somatorioX += v.x; somatorioY += v.y; });
    let centroX = somatorioX / verticesCriacaoAtiva.length, centroY = somatorioY / verticesCriacaoAtiva.length;
    let conf = { isStatic: c.isStatic, label: 'ambiente', ignoreGravity: !c.gravity, mass: c.manuseavel ? (c.mass / verticesCriacaoAtiva.length) : c.mass, friction: 0.8, frictionAir: c.air, restitution: c.bounce, collisionFilter: { category: CAT_AMBIENTE, mask: CAT_PLAYER | CAT_AMBIENTE } };
    let partesFisicasTriangulares = [];
    for (let i = 0; i < verticesCriacaoAtiva.length; i++) {
        let p1 = verticesCriacaoAtiva[i], p2 = verticesCriacaoAtiva[(i + 1) % verticesCriacaoAtiva.length];
        let corpoFatiaPuro = Phaser.Physics.Matter.Matter.Bodies.fromVertices((centroX+p1.x+p2.x)/3, (centroY+p1.y+p2.y)/3, [{ x: centroX, y: centroY }, { x: p1.x, y: p1.y }, { x: p2.x, y: p2.y }], conf);
        if (corpoFatiaPuro) partesFisicasTriangulares.push(corpoFatiaPuro);
    }
    let body = scene.matter.body.create({ parts: partesFisicasTriangulares, isStatic: c.isStatic, label: 'ambiente', ignoreGravity: !c.gravity });
    body.manuseavel = c.manuseavel; scene.matter.world.add(body); scene.matter.body.setPosition(body, { x: centroX, y: centroY });
    if (!body.isStatic) { scene.matter.body.setInertia(body, c.lockRot ? Infinity : body.inertia); }
    let verticesLocaisRelativos = verticesCriacaoAtiva.map(v => { return { x: v.x - centroX, y: v.y - centroY }; });
    listaObjetosEditaveis.push({ body: body, shape: 'polygon', w: 0, h: 0, gravity: c.gravity, lockPos: c.lockPos, lockRot: c.lockRot, mass: c.mass, air: c.air, bounce: c.bounce, maxVel: c.maxVel, maxRot: c.maxRot, posicaoTravadaX: centroX, posicaoTravadaY: centroY, physicsActive: true, visualX: centroX, visualY: centroY, dadosDesenhoVisual: verticesLocaisRelativos, manuseavel: c.manuseavel, isStatic: c.isStatic, gfx: scene.add.graphics().setDepth(3) });
    verticesCriacaoAtiva = []; limparBolinhasGuiaDoPoligono(scene);
}
function executarSelecaoObjeto(scene, x, y, ponteiro) {
    let encontrado = null;
    for (let i = listaObjetosEditaveis.length - 1; i >= 0; i--) {
        let obj = listaObjetosEditaveis[i];
        if (obj.shape === 'rope' && obj.ropeElos) {
            if (Phaser.Math.Distance.Between(x, y, obj.posicaoTravadaX, obj.posicaoTravadaY) < 30) { encontrado = obj; break; }
        } else if (obj.body) {
            if (scene.matter.query.point([obj.body], { x: x, y: y }).length > 0) { encontrado = obj; break; }
        }
    }
    if (encontrado) { selecionarObjetoDoEditor(encontrado); if (ponteiro && encontrado.body) { encontrado.isDragging = true; } }
    else { desmarcarObjeto(); }
}

function selecionarObjetoDoEditor(obj) {
    objetoSelecionado = obj; document.getElementById('btn-delete').style.display = 'block';
    let s = document.getElementById('status-modo'); s.innerText = "Editando selecionado"; s.style.color = "#ffea00";
    document.getElementById('prop-shape').value = obj.shape; atualizarInterfaceForma();
    if (obj.shape !== 'rope') {
        document.getElementById('prop-w').value = obj.w; document.getElementById('prop-h').value = obj.h; document.getElementById('prop-gravity').checked = obj.gravity; 
        document.getElementById('prop-lock-pos').checked = obj.lockPos; document.getElementById('prop-lock-rot').checked = obj.lockRot; document.getElementById('prop-manuseavel').checked = obj.manuseavel;
        document.getElementById('prop-is-static').checked = obj.body ? obj.body.isStatic : obj.isStatic; document.getElementById('prop-mass').value = obj.body ? obj.body.mass.toFixed(1) : obj.mass;
        document.getElementById('prop-air').value = obj.air; document.getElementById('prop-bounce').value = obj.bounce;
        // Alimenta a interface com as novas propriedades salvas do bloco
        document.getElementById('prop-max-vel').value = obj.maxVel || 0;
        document.getElementById('prop-max-rot').value = obj.maxRot || 0;
    }
}

function desmarcarObjeto() { objetoSelecionado = null; document.getElementById('btn-delete').style.display = 'none'; let s = document.getElementById('status-modo'); s.innerText = "Criando novos objetos"; s.style.color = "#55ff55"; }

function atualizarObjetoExistente() {
    if (!objetoSelecionado || objetoSelecionado.shape === 'rope') return;
    const c = extrairCamposPainel(); let b = objetoSelecionado.body;
    objetoSelecionado.gravity = c.gravity; objetoSelecionado.lockPos = c.lockPos; objetoSelecionado.lockRot = c.lockRot;
    objetoSelecionado.air = c.air; objetoSelecionado.bounce = c.bounce; objetoSelecionado.manuseavel = c.manuseavel;
    objetoSelecionado.maxVel = c.maxVel; objetoSelecionado.maxRot = c.maxRot;
    if (b) {
        let sAct = game.scene.getScene('default');
        sAct.matter.body.setStatic(b, c.isStatic); b.label = 'ambiente'; b.manuseavel = c.manuseavel;
        sAct.matter.body.setMass(b, c.mass); b.frictionAir = c.air; b.restitution = c.bounce;
        b.ignoreGravity = !c.gravity; sAct.matter.body.setInertia(b, c.lockRot ? Infinity : b.inertia);
    }
}

function deletarObjetoSelecionado() {
    if (!objetoSelecionado) return; let scene = game.scene.getScene('default');
    if (objetoSelecionado.shape === 'rope' && objetoSelecionado.ropeElos) {
        objetoSelecionado.ropeConstraints.forEach(c => scene.matter.world.remove(c));
        objetoSelecionado.ropeElos.forEach(e => scene.matter.world.remove(e));
    } else if (objetoSelecionado.body) { scene.matter.world.remove(objetoSelecionado.body); }
    if (objetoSelecionado.gfx) objetoSelecionado.gfx.destroy();
    listaObjetosEditaveis = listaObjetosEditaveis.filter(o => o !== objetoSelecionado);
    desmarcarObjeto();
}

function alternarModoEditor() {
    modoEditorAtivo = !modoEditorAtivo; desmarcarObjeto();
    let scene = game.scene.getScene('default');
    document.getElementById('editor-ui').style.display = modoEditorAtivo ? 'flex' : 'none';
    if (modoEditorAtivo) {
        if (player1) { executarRespawnIndividual(scene, 0); player1.gfx.clear(); player1 = null; }
        if (player2) { executarRespawnIndividual(scene, 1); player2.gfx.clear(); player2 = null; }
    } else {
        player1 = createHeaveHoCharacter(scene, 300, WORLD_HEIGHT - 150, { left: scene.input.keyboard.addKey('A'), right: scene.input.keyboard.addKey('D'), up: scene.input.keyboard.addKey('W') }, 0, 0x00ff00);
        player2 = createHeaveHoCharacter(scene, 500, WORLD_HEIGHT - 150, { left: scene.input.keyboard.addKey('LEFT'), right: scene.input.keyboard.addKey('RIGHT'), up: scene.input.keyboard.addKey('UP') }, 1, 0xffff00);
    }
}
function desenharObjetoEditor(obj) {
    if (!obj) return; let g = obj.gfx; g.clear();
    if (obj.shape === 'rope' && obj.ropeElos) {
        let corPuraHex = parseInt(obj.ropeColor.replace('#', '0x')); g.lineStyle(obj === objetoSelecionado ? 6 : 4, obj === objetoSelecionado ? 0xffea00 : corPuraHex, 1.0);
        g.beginPath(); g.moveTo(obj.posicaoTravadaX, obj.posicaoTravadaY); obj.ropeElos.forEach(elo => g.lineTo(elo.position.x, elo.position.y));
        g.strokePath(); g.fillStyle(0x111111, 0.7); obj.ropeElos.forEach(elo => g.fillCircle(elo.position.x, elo.position.y, 4)); return;
    }
    let posX = obj.body ? obj.body.position.x : obj.visualX; let posY = obj.body ? obj.body.position.y : obj.visualY;
    g.x = posX; g.y = posY; g.rotation = obj.body ? obj.body.angle : 0;
    g.fillStyle(obj.manuseavel ? 0x8b5a2b : (obj === objetoSelecionado ? 0xffea00 : 0x2c3e50), 1.0); g.lineStyle(2, 0xffffff, 0.8);
    if (obj.shape === 'box') { g.fillRect(-obj.w/2, -obj.h/2, obj.w, obj.h); g.strokeRect(-obj.w/2, -obj.h/2, obj.w, obj.h); }
    else if (obj.shape === 'circle') { g.fillCircle(0, 0, obj.w); g.strokeCircle(0, 0, obj.w); }
    else if (obj.shape === 'polygon' && obj.dadosDesenhoVisual) {
        g.beginPath(); g.moveTo(obj.dadosDesenhoVisual[0].x, obj.dadosDesenhoVisual[0].y);
        for (let i = 1; i < obj.dadosDesenhoVisual.length; i++) g.lineTo(obj.dadosDesenhoVisual[i].x, obj.dadosDesenhoVisual[i].y);
        g.closePath(); g.fillPath(); g.strokePath();
    }
}

function handlePlayerInput(s, p) {
    const pad = p.pad; if (!pad) return;
    const lL = pad.left.isDown; const rR = pad.right.isDown;
    if (pad.up.isDown) { executarRespawnIndividual(s, p.id); return; }
    
    let campoMod = document.getElementById('prop-fall-weight-mod'); let valorModificador = campoMod ? parseFloat(campoMod.value) : 1.0;
    let massaCalculadaCorpo = 6.8; let totalmenteLivreNoVazio = (!p.leftJoint && !p.rightJoint);
    if (p.body.velocity.y > 0.5 && totalmenteLivreNoVazio) {
        let deltaYEsq = Math.max(0, p.body.position.y - p.leftHand.position.y); let deltaYDir = Math.max(0, p.body.position.y - p.rightHand.position.y);
        massaCalculadaCorpo += (deltaYEsq + deltaYDir) * valorModificador * 0.1;
    }
    if (p.body.mass !== massaCalculadaCorpo) s.matter.body.setMass(p.body, massaCalculadaCorpo);
    
    const FORCA_ESCALADA_CENARIO = 0.045, FORCA_MOVER_CAIXA = 0.038, RAIO_ORBITA_BRACO = 96;
    let time = s.time.now;
    
    // Órbita da Mão Esquerda via teclado (C e V emulando analógicos esquerdo/direito)
    if (p.leftJoint && p.leftJointTarget && !p.leftJointTarget.manuseavel) {
        s.matter.body.applyForce(p.body, p.body.position, { x: 0, y: -FORCA_ESCALADA_CENARIO * 0.4 });
    } else if (!p.leftJoint) {
        let a = time * 0.005;
        let posXAlvo = p.body.position.x + Math.cos(a)*RAIO_ORBITA_BRACO; let posYAlvo = p.body.position.y + Math.sin(a)*RAIO_ORBITA_BRACO;
        s.matter.body.setVelocity(p.leftHand, { x: (posXAlvo - p.leftHand.position.x)*0.22, y: (posYAlvo - p.leftHand.position.y)*0.22 });
    }
    
    // Órbita da Mão Direita via teclado
    if (p.rightJoint && p.rightJointTarget && !p.rightJointTarget.manuseavel) {
        s.matter.body.applyForce(p.body, p.body.position, { x: 0, y: -FORCA_ESCALADA_CENARIO * 0.4 });
    } else if (!p.rightJoint) {
        let a = time * 0.005 + Math.PI;
        let posXAlvo = p.body.position.x + Math.cos(a)*RAIO_ORBITA_BRACO; let posYAlvo = p.body.position.y + Math.sin(a)*RAIO_ORBITA_BRACO;
        s.matter.body.setVelocity(p.rightHand, { x: (posXAlvo - p.rightHand.position.x)*0.22, y: (posYAlvo - p.rightHand.position.y)*0.22 });
    }
    
    let gEsq = (p.id === 0) ? s.input.keyboard.addKey('C').isDown : s.input.keyboard.addKey('N').isDown;
    let gDir = (p.id === 0) ? s.input.keyboard.addKey('V').isDown : s.input.keyboard.addKey('M').isDown;
    processarGarra(s, p, p.leftHand, 'leftJoint', gEsq); processarGarra(s, p, p.rightHand, 'rightJoint', gDir);
}
// CONGELADO: Processamento de garra por região com filtro de borda real (collides) e orientação por radianos
function processarGarra(s, p, h, jKey, grab) {
    if (grab && !p[jKey]) {
        let lado = (jKey === 'leftJoint') ? 'Esquerda' : 'Direita';
        let alvoCorpo = null;
        let caixaDeteccao = { min: { x: h.position.x - 16, y: h.position.y - 16 }, max: { x: h.position.x + 16, y: h.position.y + 16 } };
        
        for (let i = 0; i < bordasFixasDoCenario.length; i++) {
            let b = bordasFixasDoCenario[i]; if (!b) continue;
            if (s.matter.query.region([b], caixaDeteccao).length > 0) { alvoCorpo = b; break; }
        }
        if (!alvoCorpo) {
            for (let i = 0; i < listaObjetosEditaveis.length; i++) {
                let obj = listaObjetosEditaveis[i]; if (!obj) continue;
                if (obj.body && s.matter.query.region([obj.body], caixaDeteccao).length > 0) { alvoCorpo = obj.body; break; }
                else if (obj.shape === 'rope' && obj.ropeElos) {
                    for (let j = 0; j < obj.ropeElos.length; j++) {
                        if (s.matter.query.region([obj.ropeElos[j]], caixaDeteccao).length > 0) { alvoCorpo = obj.ropeElos[j]; break; }
                    }
                    if (alvoCorpo) break;
                }
            }
        }

        if (alvoCorpo) {
            // VALIDAÇÃO DE BORDA: Garante que as fronteiras físicas se interceptem antes do pino prender
            let colisaoDetectada = s.matter.query.collides(h, [alvoCorpo]).length > 0;
            if (!colisaoDetectada) { return; }

            let alvoValido = alvoCorpo.parent ? alvoCorpo.parent : alvoCorpo;
            let rigidezConexao = (alvoValido.manuseavel === true) ? 1.0 : 0.95;
            
            let flashGfx = s.add.graphics().setDepth(20);
            flashGfx.lineStyle(4, 0xffea00, 1); flashGfx.lineBetween(h.position.x, h.position.y, h.position.x, h.position.y + 4);
            s.time.delayedCall(150, () => { flashGfx.clear(); flashGfx.destroy(); });

            s.matter.body.setVelocity(h, { x: 0, y: 0 }); s.matter.body.setAngularVelocity(h, 0);
            
            let dx = h.position.x - alvoValido.position.x, dy = h.position.y - alvoValido.position.y;
            let r = alvoValido.rotation ? alvoValido.rotation : 0; if (isNaN(r)) r = 0;
            
            // Projeção inversa em radianos mantida cirúrgica
            let localOffset = {
                x: dx * Math.cos(-r) - dy * Math.sin(-r),
                y: dx * Math.sin(-r) + dy * Math.cos(-r)
            };

            if (alvoValido.isStatic) {
                p[jKey + 'PontoPivorMundo'] = { x: h.position.x, y: h.position.y };
                p[jKey] = s.matter.add.worldConstraint(h, 0, 1.0, { pointA: { x: h.position.x, y: h.position.y }, pointB: { x: 0, y: 0 } });
            } else {
                p[jKey + 'PontoPivorMundo'] = null; 
                p[jKey] = s.matter.add.constraint(h, alvoValido, 0, rigidezConexao, { pointA: { x: 0, y: 0 }, pointB: localOffset });
            }
            p[jKey + 'Target'] = alvoValido; p[jKey + 'PivotBody'] = null; p[jKey + 'LocalOffset'] = localOffset;
            s.matter.body.setVelocity(p.body, { x: p.body.velocity.x * 0.1, y: p.body.velocity.y * 0.1 });
        }
    } else if (!grab && p[jKey]) {
        if (p[jKey]) s.matter.world.remove(p[jKey]);
        p[jKey] = null; p[jKey + 'Target'] = null; p[jKey + 'PivotBody'] = null; p[jKey + 'LocalOffset'] = null; p[jKey + 'PontoPivorMundo'] = null;
    }
}

function createArmSegment(scene, bA, bB, num, len, id, grp, list, listaJuntas) {
    let last = bA;
    for (let i = 0; i < num; i++) {
        const lastLink = (i === num - 1);
        let link = lastLink ? bB : scene.matter.add.rectangle(bA.position.x, bA.position.y, 12, len, { density: 0.005, frictionAir: 0.01, label: `p${id}_braco`, collisionFilter: { category: CAT_PLAYER, mask: CAT_AMBIENTE | CAT_PLAYER, group: grp } });
        if (!lastLink) list.push(link);
        let c = scene.matter.add.constraint(last, link, 0, 1.0, { pointA: last === bA ? { x:0, y:0 } : { x:0, y: len/2 }, pointB: lastLink ? { x:0, y:0 } : { x:0, y: -len/2 }, stiffness: 1.0, damping: 0.01 });
        if (listaJuntas) listaJuntas.push(c);
        last = link;
    }
}
function createHeaveHoCharacter(scene, x, y, pad, id, col) {
    const grp = scene.matter.world.nextGroup(true), flt = { category: CAT_PLAYER, mask: CAT_AMBIENTE | CAT_PLAYER, group: grp };
    const b = scene.matter.add.circle(x, y, 22, { friction: 0.3, density: 0.05, label: `p${id}_body`, collisionFilter: flt });
    const lH = scene.matter.add.circle(x - 100, y, 14, { density: 0.0005, friction: 0.8, frictionAir: 0.01, label: `p${id}_leftHand`, collisionFilter: flt });
    const rH = scene.matter.add.circle(x + 100, y, 14, { density: 0.0005, friction: 0.8, frictionAir: 0.01, label: `p${id}_rightHand`, collisionFilter: flt });
    lH.corpoTocadoAgora = null; rH.corpoTocadoAgora = null; let lL = [], rL = [], juntasBraço = [];
    createArmSegment(scene, b, lH, 3, 32, id, grp, lL, juntasBraço); createArmSegment(scene, b, rH, 3, 32, id, grp, rL, juntasBraço);
    return { id: id, body: b, leftHand: lH, rightHand: rH, leftElos: lL, rightElos: rL, juntasEstruturaisDosBramos: juntasBraço, gfx: scene.add.graphics().setDepth(10), bodyColor: col, pad: pad, leftJoint: null, rightJoint: null };
}

function desenharJogador(p) {
    if (!p || !p.gfx) return; let g = p.gfx; g.clear();
    g.lineStyle(10, 0x333333, 1.0); g.beginPath(); g.moveTo(p.body.position.x, p.body.position.y);
    p.leftElos.forEach(e => g.lineTo(e.position.x, e.position.y)); g.lineTo(p.leftHand.position.x, p.leftHand.position.y); g.strokePath();
    g.beginPath(); g.moveTo(p.body.position.x, p.body.position.y); p.rightElos.forEach(e => g.lineTo(e.position.x, e.position.y)); g.lineTo(p.rightHand.position.x, p.rightHand.position.y); g.strokePath();
    g.fillStyle(p.bodyColor, 1.0); g.lineStyle(2, 0x000000, 1.0); g.fillCircle(p.body.position.x, p.body.position.y, 22); g.strokeCircle(p.body.position.x, p.body.position.y, 22);
    g.fillStyle(0xffffff, 1.0); g.fillCircle(p.body.position.x - 6, p.body.position.y - 4, 6); g.fillCircle(p.body.position.x + 6, p.body.position.y - 4, 6);
    g.fillStyle(0x000000, 1.0); g.fillCircle(p.body.position.x - 6, p.body.position.y - 4, 2); g.fillCircle(p.body.position.x + 6, p.body.position.y - 4, 2);
    g.fillStyle(p.leftJoint ? 0xffea00 : 0xcccccc, 1.0); g.fillCircle(p.leftHand.position.x, p.leftHand.position.y, 14); g.strokeCircle(p.leftHand.position.x, p.leftHand.position.y, 14);
    g.fillStyle(p.rightJoint ? 0xffea00 : 0xcccccc, 1.0); g.fillCircle(p.rightHand.position.x, p.rightHand.position.y, 14); g.strokeCircle(p.rightHand.position.x, p.rightHand.position.y, 14);
}

function configurarEventosDeColisao(scene) {}

function executarRespawnIndividual(scene, pNum) {
    let p = (pNum === 0) ? player1 : player2; if (!p) return;
    if (p.leftJoint) scene.matter.world.remove(p.leftJoint); if (p.rightJoint) scene.matter.world.remove(p.rightJoint);
    if (p.juntasEstruturaisDosBramos) p.juntasEstruturaisDosBramos.forEach(j => scene.matter.world.remove(j));
    scene.matter.world.remove(p.body); scene.matter.world.remove(p.leftHand); scene.matter.world.remove(p.rightHand);
    if (p.leftElos) p.leftElos.forEach(e => scene.matter.world.remove(e)); if (p.rightElos) p.rightElos.forEach(e => scene.matter.world.remove(e));
    if (p.gfx) { p.gfx.clear(); p.gfx.destroy(); }
    if (pNum === 0) player1 = createHeaveHoCharacter(scene, 300, WORLD_HEIGHT - 150, p.pad, 0, 0x00ff00);
    else player2 = createHeaveHoCharacter(scene, 500, WORLD_HEIGHT - 150, p.pad, 1, 0xffff00);
}

function limparBolinhasGuiaDoPoligono(scene) {
    if (typeof previewGraphicsPoligono !== 'undefined' && previewGraphicsPoligono) { previewGraphicsPoligono.clear(); }
    if (scene && scene.listaBolinhasGuiaCena) {
        scene.listaBolinhasGuiaCena.forEach(bola => { if (bola && bola.destroy) { bola.destroy(); } });
        scene.listaBolinhasGuiaCena = [];
    }
}

function update() {
    let sAct = game.scene.getScene('default'); if (!sAct) return;
    
    // RENDERIZAÇÃO DE VÉRTICES: Bolinhas e contornos desenhados frame a frame com profundidade máxima
    if (modoEditorAtivo && document.getElementById('prop-shape').value === 'polygon') {
        if (!previewGraphicsPoligono || !previewGraphicsPoligono.scene) { previewGraphicsPoligono = this.add.graphics(); }
        previewGraphicsPoligono.clear(); previewGraphicsPoligono.setDepth(9999);
        verticesCriacaoAtiva.forEach(v => {
            previewGraphicsPoligono.lineStyle(2, 0xffffff, 1); previewGraphicsPoligono.fillStyle(0xff0000, 1);
            previewGraphicsPoligono.fillCircle(v.x, v.y, 6); previewGraphicsPoligono.strokeCircle(v.x, v.y, 6);
        });
        if (verticesCriacaoAtiva.length > 1) {
            previewGraphicsPoligono.lineStyle(3, 0xff0000, 0.9); previewGraphicsPoligono.beginPath();
            previewGraphicsPoligono.moveTo(verticesCriacaoAtiva[0].x, verticesCriacaoAtiva[0].y);
            for (let i = 1; i < verticesCriacaoAtiva.length; i++) { previewGraphicsPoligono.lineTo(verticesCriacaoAtiva[i].x, verticesCriacaoAtiva[i].y); }
            previewGraphicsPoligono.strokePath();
        }
    } else if (previewGraphicsPoligono) { previewGraphicsPoligono.clear(); }
    
    if (modoEditorAtivo) {
        let camSpeed = 12;
        if (cursorsKeyboard.left.isDown) this.cameras.main.scrollX -= camSpeed; if (cursorsKeyboard.right.isDown) this.cameras.main.scrollX += camSpeed;
        if (cursorsKeyboard.up.isDown) this.cameras.main.scrollY -= camSpeed; if (cursorsKeyboard.down.isDown) this.cameras.main.scrollY += camSpeed;
        listaObjetosEditaveis.forEach(obj => { if (obj && obj.body && obj.isDragging) { sAct.matter.body.setPosition(obj.body, { x: sAct.input.activePointer.worldX, y: sAct.input.activePointer.worldY }); obj.posicaoTravadaX = obj.body.position.x; obj.posicaoTravadaY = obj.body.position.y; if (sAct.input.activePointer.isUp) obj.isDragging = false; } desenharObjetoEditor(obj); });
        return;
    }
    if (player1) handlePlayerInput(this, player1); if (player2) handlePlayerInput(this, player2);
    [player1, player2].forEach(p => { if (!p) return; aplicarLimiteFrame(sAct, p.body, 10); });
    
    // TRAVA DE ELASTICIDADE ZERO: Corrige folgas milimétricas de frames nas garras fixas do mundo
    [player1, player2].forEach(p => {
        if (!p) return;
        if (p.leftJoint && p.leftJointPontoPivorMundo) { sAct.matter.body.setPosition(p.leftHand, { x: p.leftJointPontoPivorMundo.x, y: p.leftJointPontoPivorMundo.y }); sAct.matter.body.setVelocity(p.leftHand, { x: 0, y: 0 }); }
        if (p.rightJoint && p.rightJointPontoPivorMundo) { sAct.matter.body.setPosition(p.rightHand, { x: p.rightJointPontoPivorMundo.x, y: p.rightJointPontoPivorMundo.y }); sAct.matter.body.setVelocity(p.rightHand, { x: 0, y: 0 }); }
    });

    if (player1) desenharJogador(player1); if (player2) desenharJogador(player2);
    
    listaObjetosEditaveis.forEach(obj => {
        if (!obj || !obj.body || obj.body.isStatic) return;

        // 1. FILTRO SÍNCRONO DE TETO DE VELOCIDADE LINEAR (MOVIMENTO)
        if (obj.maxVel && obj.maxVel > 0) {
            let velX = obj.body.velocity.x, velY = obj.body.velocity.y;
            let velocidadeLinearCombinada = Math.sqrt(velX * velX + velY * velY);
            if (velocidadeLinearCombinada > obj.maxVel) {
                sAct.matter.body.setVelocity(obj.body, { x: (velX / velocidadeLinearCombinada) * obj.maxVel, y: (velY / velocidadeLinearCombinada) * obj.maxVel });
            }
        }

        // 2. FILTRO SÍNCRONO DE TETO DE VELOCIDADE ANGULAR (GIRO/ROTAÇÃO)
        if (obj.maxRot && obj.maxRot > 0) {
            let velocidadeGiroAtual = obj.body.angularVelocity;
            if (Math.abs(velocidadeGiroAtual) > obj.maxRot) {
                sAct.matter.body.setAngularVelocity(obj.body, obj.maxRot * Math.sign(velocidadeGiroAtual));
            }
        }

        // Trava do Eixo X/Y opera mantendo os limites sem interferir na rotação
        if (obj.lockPos) {
            if (obj.body.position.x !== obj.posicaoTravadaX || obj.body.position.y !== obj.posicaoTravadaY) {
                sAct.matter.body.setPosition(obj.body, { x: obj.posicaoTravadaX, y: obj.posicaoTravadaY });
                sAct.matter.body.setVelocity(obj.body, { x: 0, y: 0 });
            }
        }
        desenharObjetoEditor(obj);
    });

    if (player1 && player2) {
        const mX = (player1.body.position.x + player2.body.position.x) / 2, mY = (player1.body.position.y + player2.body.position.y) / 2;
        let z = Math.min(SCREEN_WIDTH / (Math.abs(player1.body.position.x - player2.body.position.x) + 250), SCREEN_HEIGHT / (Math.abs(player1.body.position.y - player2.body.position.y) + 250));
        z = Phaser.Math.Clamp(z, 0.45, 1.0); this.cameras.main.scrollX = Phaser.Math.Linear(this.cameras.main.scrollX, (mX - SCREEN_WIDTH / 2), 0.08); this.cameras.main.scrollY = Phaser.Math.Linear(this.cameras.main.scrollY, (mY - SCREEN_HEIGHT / 2), 0.08); this.cameras.main.setZoom(Phaser.Math.Linear(this.cameras.main.zoom, z, 0.05));
    } else if (player1) {
        this.cameras.main.scrollX = Phaser.Math.Linear(this.cameras.main.scrollX, (player1.body.position.x - SCREEN_WIDTH / 2), 0.08); this.cameras.main.scrollY = Phaser.Math.Linear(this.cameras.main.scrollY, (player1.body.position.y - SCREEN_HEIGHT / 2), 0.08);
    }
}

function aplicarLimiteFrame(scene, body, maxDist) {
    if (!body || !body.position || body.isStatic) return;
    if (body.ultimaPos && !isNaN(body.position.x)) { 
        let dx = body.position.x - body.ultimaPos.x, dy = body.position.y - body.ultimaPos.y; 
        if (dx*dx + dy*dy > maxDist*maxDist) { 
            let d = Math.sqrt(dx*dx + dy*dy); 
            if (d > 0) scene.matter.body.setPosition(body, { x: body.ultimaPos.x + (dx/d)*maxDist, y: body.ultimaPos.y + (dy/d)*maxDist }); 
        } 
    }
    body.ultimaPos = { x: body.position.x, y: body.position.y };
}

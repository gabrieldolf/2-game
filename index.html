<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Clone Heave Ho - Colisão Impenetrável</title>
    <style>
        body { margin: 0; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        canvas { box-shadow: 0 0 20px rgba(0,0,0,0.8); }
    </style>
    <script src="phaser.min.js"></script>
</head>
<body>

<script>
const config = {
    type: Phaser.AUTO,
    width: 1024,
    height: 768,
    backgroundColor: '#4488aa',
    physics: {
        default: 'matter',
        matter: {
            gravity: { y: 1.5 }, 
            debug: true 
        }
    },
    input: { gamepad: true },
    scene: { preload: preload, create: create, update: update }
};

const game = new Phaser.Game(config);
let player1, player2;

// Categorias de colisão para organizar o mundo físico
const CAT_AMBIENTE = 0x0001;
const CAT_PLAYER = 0x0002;

function preload() {}

function create() {
    this.add.text(20, 20, "Colisões Sólidas Ativadas. L2 / R2 para AGARRAR.", { font: "20px Arial", fill: "#ffffff" });

    // CORREÇÃO: O ambiente agora aceita colisões de tudo o que estiver na categoria CAT_PLAYER
    const ambienteConfig = { 
        isStatic: true, 
        label: 'ambiente', 
        friction: 0.5,
        collisionFilter: { 
            category: CAT_AMBIENTE,
            mask: CAT_PLAYER // Bloqueia fisicamente os jogadores, mãos e braços
        }
    };

    // Fronteiras do mapa
    this.matter.add.rectangle(512, 740, 1024, 50, ambienteConfig); 
    this.matter.add.rectangle(512, 25, 1024, 50, ambienteConfig);  
    this.matter.add.rectangle(25, 384, 50, 768, ambienteConfig);  
    this.matter.add.rectangle(999, 384, 50, 768, ambienteConfig);  

    // Plataformas
    this.matter.add.rectangle(250, 450, 300, 40, ambienteConfig); 
    this.matter.add.rectangle(774, 350, 300, 40, ambienteConfig); 

    this.input.gamepad.on('down', (pad, button, index) => {
        if (pad.index === 0 && !player1) player1 = createHeaveHoCharacter(this, 250, 300, pad, 0);
        if (pad.index === 1 && !player2) player2 = createHeaveHoCharacter(this, 750, 200, pad, 1);
    });
}

function createArmSegment(scene, bodyA, bodyB, numLinks, linkLength, id, groupIndex) {
    let lastBody = bodyA;

    for (let i = 0; i < numLinks; i++) {
        const isLast = (i === numLinks - 1);
        let link;
        
        if (isLast) {
            link = bodyB;
        } else {
            link = scene.matter.add.rectangle(bodyA.position.x, bodyA.position.y, 10, linkLength, { 
                density: 0.005, 
                frictionAir: 0.02,
                label: `p${id}_braco`,
                collisionFilter: { 
                    category: CAT_PLAYER,
                    mask: CAT_AMBIENTE | CAT_PLAYER, // Braco colide com cenário e com outro player
                    group: groupIndex // Evita colidir com o próprio corpo/mão do mesmo jogador
                }
            });
        }

        scene.matter.add.constraint(lastBody, link, linkLength, 1.0, {
            pointA: lastBody === bodyA ? { x: 0, y: 0 } : { x: 0, y: linkLength / 2 },
            pointB: isLast ? { x: 0, y: 0 } : { x: 0, y: -linkLength / 2 }
        });

        lastBody = link;
    }
}

function createHeaveHoCharacter(scene, x, y, gamepad, id) {
    // Cria um grupo exclusivo negativo para este jogador (ex: p0 não colide internamente consigo mesmo)
    const playerGroup = scene.matter.world.nextGroup(true);
    
    const pFilter = { 
        category: CAT_PLAYER, 
        mask: CAT_AMBIENTE | CAT_PLAYER, // Colide com o cenário e com o outro jogador
        group: playerGroup 
    };

    const body = scene.matter.add.circle(x, y, 22, { friction: 0.3, density: 0.05, label: `p${id}_body`, collisionFilter: pFilter });
    const leftHand = scene.matter.add.circle(x - 50, y, 14, { density: 0.01, friction: 0.8, frictionAir: 0.01, label: `p${id}_leftHand`, collisionFilter: pFilter });
    const rightHand = scene.matter.add.circle(x + 50, y, 14, { density: 0.01, friction: 0.8, frictionAir: 0.01, label: `p${id}_rightHand`, collisionFilter: pFilter });

    createArmSegment(scene, body, leftHand, 3, 16, id, playerGroup);
    createArmSegment(scene, body, rightHand, 3, 16, id, playerGroup);

    return {
        id: id,
        body: body,
        leftHand: leftHand,
        rightHand: rightHand,
        pad: gamepad,
        leftJoint: null,
        rightJoint: null
    };
}

function update() {
    if (player1) handlePlayerInput(this, player1);
    if (player2) handlePlayerInput(this, player2);
}

function isButtonPressed(pad, index) {
    const btn = pad.buttons[index];
    if (!btn) return false;
    return btn.pressed || btn.value > 0.1;
}

function handlePlayerInput(scene, player) {
    const pad = player.pad;
    if (!pad) return;

    const grabbingLeft = isButtonPressed(pad, 6) || isButtonPressed(pad, 4);
    const grabbingRight = isButtonPressed(pad, 7) || isButtonPressed(pad, 5);

    const enemyPrefix = player.id === 0 ? "p1_" : "p0_";

    // 1. MOVIMENTO DA MÃO ESQUERDA
    if (pad.leftStick) {
        const forceX = pad.leftStick.x;
        const forceY = pad.leftStick.y;
        if (player.leftJoint) {
            scene.matter.body.applyForce(player.body, player.body.position, { x: forceX * 0.07, y: forceY * 0.07 });
        } else {
            scene.matter.body.applyForce(player.leftHand, player.leftHand.position, { x: forceX * 0.018, y: forceY * 0.018 });
        }
    }

    // 2. MOVIMENTO DA MÃO DIREITA
    if (pad.rightStick) {
        const forceX = pad.rightStick.x;
        const forceY = pad.rightStick.y;
        if (player.rightJoint) {
            scene.matter.body.applyForce(player.body, player.body.position, { x: forceX * 0.07, y: forceY * 0.07 });
        } else {
            scene.matter.body.applyForce(player.rightHand, player.rightHand.position, { x: forceX * 0.018, y: forceY * 0.018 });
        }
    }

    // 3. SELETOR DE GARRA - MÃO ESQUERDA
    if (grabbingLeft && !player.leftJoint) {
        const bodies = scene.matter.world.localWorld.bodies;
        const targets = scene.matter.query.region(bodies, {
            min: { x: player.leftHand.position.x - 25, y: player.leftHand.position.y - 25 },
            max: { x: player.leftHand.position.x + 25, y: player.leftHand.position.y + 25 }
        });
        
        const validTarget = targets.find(b => b.label === 'ambiente' || b.label.startsWith(enemyPrefix));
        
        if (validTarget) {
            player.leftJoint = scene.matter.add.constraint(player.leftHand, validTarget, 0, 1.0, {
                pointA: { x: 0, y: 0 },
                pointB: { x: player.leftHand.position.x - validTarget.position.x, y: player.leftHand.position.y - validTarget.position.y }
            });
        }
    } else if (!grabbingLeft && player.leftJoint) {
        scene.matter.world.remove(player.leftJoint);
        player.leftJoint = null;
    }

    // 4. SELETOR DE GARRA - MÃO DIREITA
    if (grabbingRight && !player.rightJoint) {
        const bodies = scene.matter.world.localWorld.bodies;
        const targets = scene.matter.query.region(bodies, {
            min: { x: player.rightHand.position.x - 25, y: player.rightHand.position.y - 25 },
            max: { x: player.rightHand.position.x + 25, y: player.rightHand.position.y + 25 }
        });
        
        const validTarget = targets.find(b => b.label === 'ambiente' || b.label.startsWith(enemyPrefix));
        
        if (validTarget) {
            player.rightJoint = scene.matter.add.constraint(player.rightHand, validTarget, 0, 1.0, {
                pointA: { x: 0, y: 0 },
                pointB: { x: player.rightHand.position.x - validTarget.position.x, y: player.rightHand.position.y - validTarget.position.y }
            });
        }
    } else if (!grabbingRight && player.rightJoint) {
        scene.matter.world.remove(player.rightJoint);
        player.rightJoint = null;
    }
}
</script>
</body>
</html>

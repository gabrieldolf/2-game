<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Clone Heave Ho - Câmera Dinâmica Integrada</title>
    <style>
        body { margin: 0; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        canvas { box-shadow: 0 0 20px rgba(0,0,0,0.8); }
    </style>
    <script src="phaser.min.js"></script>
</head>
<body>

<script>
const SCREEN_WIDTH = 1024;
const SCREEN_HEIGHT = 768;
const WORLD_WIDTH = 3000;
const WORLD_HEIGHT = 2000;

const config = {
    type: Phaser.AUTO,
    width: SCREEN_WIDTH,
    height: SCREEN_HEIGHT,
    backgroundColor: '#4488aa',
    physics: {
        default: 'matter',
        matter: { gravity: { y: 1.5 }, debug: false }
    },
    input: { gamepad: true },
    scene: { preload: preload, create: create, update: update }
};

const game = new Phaser.Game(config);
let player1, player2;
const CAT_AMBIENTE = 0x0001;
const CAT_PLAYER = 0x0002;

function preload() {}

function create() {
    this.matter.world.setBounds(0, 0, WORLD_WIDTH, WORLD_HEIGHT, 100, true, true, true, true);
    
    const ambienteConfig = { 
        isStatic: true, label: 'ambiente', friction: 0.5,
        collisionFilter: { category: CAT_AMBIENTE, mask: CAT_PLAYER }
    };

    const criarPlataforma = (scene, x, y, w, h) => {
        scene.matter.add.rectangle(x, y, w, h, ambienteConfig);
        let g = scene.add.graphics();
        g.fillStyle(0x224466, 1);
        g.fillRect(x - w/2, y - h/2, w, h);
    };

    // Fronteiras do mapa estendido
    criarPlataforma(this, WORLD_WIDTH / 2, WORLD_HEIGHT - 25, WORLD_WIDTH, 50); 
    criarPlataforma(this, WORLD_WIDTH / 2, 25, WORLD_WIDTH, 50);               
    criarPlataforma(this, 25, WORLD_HEIGHT / 2, 50, WORLD_HEIGHT);              
    criarPlataforma(this, WORLD_WIDTH - 25, WORLD_HEIGHT / 2, 50, WORLD_HEIGHT); 

    // Estruturas e plataformas espalhadas pelo cenário gigante
    criarPlataforma(this, 400, WORLD_HEIGHT - 300, 300, 40); 
    criarPlataforma(this, 800, WORLD_HEIGHT - 500, 300, 40); 
    criarPlataforma(this, 1300, WORLD_HEIGHT - 400, 400, 40); 
    criarPlataforma(this, 1800, WORLD_HEIGHT - 600, 300, 40); 
    criarPlataforma(this, 2300, WORLD_HEIGHT - 450, 400, 40); 
    criarPlataforma(this, 600, WORLD_HEIGHT - 900, 250, 40);
    criarPlataforma(this, 1100, WORLD_HEIGHT - 1100, 350, 40);
    criarPlataforma(this, 1600, WORLD_HEIGHT - 950, 200, 40);
    criarPlataforma(this, 2100, WORLD_HEIGHT - 1200, 400, 40);

    // Ajuste da câmera principal estável
    this.cameras.main.setBounds(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

    // Texto de interface que acompanha a rolagem da tela
    let txt = this.add.text(20, 20, "Câmera de Zoom Dinâmico Ativada! Explorem o mapa sem perder o foco.", { font: "20px Arial", fill: "#ffffff" });
    txt.setScrollFactor(0).setDepth(2000);

    this.input.gamepad.on('down', (pad, button, index) => {
        if (pad.index === 0 && !player1) player1 = createHeaveHoCharacter(this, 300, WORLD_HEIGHT - 150, pad, 0, 0x00ff00);
        if (pad.index === 1 && !player2) player2 = createHeaveHoCharacter(this, 500, WORLD_HEIGHT - 150, pad, 1, 0xffff00);
    });
}

function createArmSegment(scene, bodyA, bodyB, numLinks, linkLength, id, groupIndex, listaElos) {
    let lastBody = bodyA;
    for (let i = 0; i < numLinks; i++) {
        const isLast = (i === numLinks - 1);
        let link = isLast ? bodyB : scene.matter.add.rectangle(bodyA.position.x, bodyA.position.y, 10, linkLength, { 
            density: 0.005, frictionAir: 0.02, label: `p${id}_braco`,
            collisionFilter: { category: CAT_PLAYER, mask: CAT_AMBIENTE | CAT_PLAYER, group: groupIndex }
        });
        if (!isLast) listaElos.push(link);

        scene.matter.add.constraint(lastBody, link, linkLength, 1.0, {
            pointA: lastBody === bodyA ? { x: 0, y: 0 } : { x: 0, y: linkLength / 2 },
            pointB: isLast ? { x: 0, y: 0 } : { x: 0, y: -linkLength / 2 }
        });
        lastBody = link;
    }
}
function createHeaveHoCharacter(scene, x, y, gamepad, id, bodyColor) {
    const playerGroup = scene.matter.world.nextGroup(true);
    const pFilter = { category: CAT_PLAYER, mask: CAT_AMBIENTE | CAT_PLAYER, group: playerGroup };

    const body = scene.matter.add.circle(x, y, 22, { friction: 0.3, density: 0.05, label: `p${id}_body`, collisionFilter: pFilter });
    const leftHand = scene.matter.add.circle(x - 50, y, 14, { density: 0.01, friction: 0.8, frictionAir: 0.01, label: `p${id}_leftHand`, collisionFilter: pFilter });
    const rightHand = scene.matter.add.circle(x + 50, y, 14, { density: 0.01, friction: 0.8, frictionAir: 0.01, label: `p${id}_rightHand`, collisionFilter: pFilter });

    let leftElos = [], rightElos = [];
    createArmSegment(scene, body, leftHand, 3, 16, id, playerGroup, leftElos);
    createArmSegment(scene, body, rightHand, 3, 16, id, playerGroup, rightElos);

    let pGfx = scene.add.graphics();
    pGfx.setDepth(10);

    return {
        id: id, body: body, leftHand: leftHand, rightHand: rightHand,
        leftElos: leftElos, rightElos: rightElos, gfx: pGfx,
        bodyColor: bodyColor, pad: gamepad, leftJoint: null, rightJoint: null
    };
}

function update() {
    if (player1) { handlePlayerInput(this, player1); desenharJogador(player1); }
    if (player2) { handlePlayerInput(this, player2); desenharJogador(player2); }

    // CORREÇÃO DEFINITIVA DA TELA AZUL: Controle Unificado Inteligente de Câmera Única
    if (player1 && player2) {
        // Encontra a posição média central exata entre os dois personagens
        const midX = (player1.body.position.x + player2.body.position.x) / 2;
        const midY = (player1.body.position.y + player2.body.position.y) / 2;

        // Mede o distanciamento horizontal e vertical absoluto entre eles
        const dx = Math.abs(player1.body.position.x - player2.body.position.x);
        const dy = Math.abs(player1.body.position.y - player2.body.position.y);

        // Calcula qual nível de zoom é necessário para manter ambos dentro das margens da tela
        const zoomX = SCREEN_WIDTH / (dx + 250); // 250 pixels de margem segura nas pontas
        const zoomY = SCREEN_HEIGHT / (dy + 250);
        
        // Escolhe o menor zoom para garantir que ninguém fique cortado para fora da visão
        let zoomAlvo = Math.min(zoomX, zoomY);
        
        // Estabelece limites saudáveis de proximidade: não aproxima mais que 1.0x e não afasta menos que 0.45x
        if (zoomAlvo > 1.0) zoomAlvo = 1.0;
        if (zoomAlvo < 0.45) zoomAlvo = 0.45;

        // Desloca o foco e o zoom de forma suave (Efeito amortecido lerp) para não dar trancos
        this.cameras.main.scrollX = Phaser.Math.Linear(this.cameras.main.scrollX, (midX - SCREEN_WIDTH / 2), 0.08);
        this.cameras.main.scrollY = Phaser.Math.Linear(this.cameras.main.scrollY, (midY - SCREEN_HEIGHT / 2), 0.08);
        this.cameras.main.setZoom(Phaser.Math.Linear(this.cameras.main.zoom, zoomAlvo, 0.05));

    } else if (player1) {
        // Se houver apenas um jogador ativo, a câmera apenas trava e segue o corpo dele em tamanho real
        this.cameras.main.centerOn(player1.body.position.x, player1.body.position.y);
        this.cameras.main.setZoom(1.0);
    }
}

function isButtonPressed(pad, index) {
    const btn = pad.buttons[index];
    return btn ? (btn.pressed || btn.value > 0.1) : false;
}

function desenharJogador(player) {
    const g = player.gfx; g.clear();
    const pad = player.pad;
    const grabL = isButtonPressed(pad, 6) || isButtonPressed(pad, 4);
    const grabR = isButtonPressed(pad, 7) || isButtonPressed(pad, 5);

    g.lineStyle(12, 0x000000, 1);
    const filamento = (elos, mao) => {
        g.beginPath(); g.moveTo(player.body.position.x, player.body.position.y);
        elos.forEach(e => g.lineTo(e.position.x, e.position.y));
        g.lineTo(mao.position.x, mao.position.y); g.strokePath();
    };
    filamento(player.leftElos, player.leftHand);
    filamento(player.rightElos, player.rightHand);

    g.fillStyle(player.bodyColor, 1); g.fillCircle(player.body.position.x, player.body.position.y, 22);
    g.fillStyle(grabL ? 0xff8888 : 0xff0000, 1); g.fillCircle(player.leftHand.position.x, player.leftHand.position.y, 14);
    g.fillStyle(grabR ? 0x8888ff : 0x0000ff, 1); g.fillCircle(player.rightHand.position.x, player.rightHand.position.y, 14);
}

function processarGarra(scene, player, hand, jointKey, isGrabbing, enemyPrefix) {
    if (isGrabbing && !player[jointKey]) {
        const bodies = scene.matter.world.localWorld.bodies;
        const targets = scene.matter.query.region(bodies, {
            min: { x: hand.position.x - 16, y: hand.position.y - 16 },
            max: { x: hand.position.x + 16, y: hand.position.y + 16 }
        });
        const validTarget = targets.find(b => b.label === 'ambiente' || b.label.startsWith(enemyPrefix));
        if (validTarget) {
            player[jointKey] = scene.matter.add.constraint(hand, validTarget, 0, 1.0, {
                pointA: { x: 0, y: 0 },
                pointB: { x: hand.position.x - validTarget.position.x, y: hand.position.y - validTarget.position.y }
            });
        }
    } else if (!isGrabbing && player[jointKey]) {
        scene.matter.world.remove(player[jointKey]); player[jointKey] = null;
    }
}

function handlePlayerInput(scene, player) {
    const pad = player.pad; if (!pad) return;
    const grabL = isButtonPressed(pad, 6) || isButtonPressed(pad, 4);
    const grabR = isButtonPressed(pad, 7) || isButtonPressed(pad, 5);
    const enemyPrefix = player.id === 0 ? "p1_" : "p0_";

    if (pad.leftStick) {
        let f = player.leftJoint ? player.body : player.leftHand;
        let m = player.leftJoint ? 0.045 : 0.018;
        scene.matter.body.applyForce(f, f.position, { x: pad.leftStick.x * m, y: pad.leftStick.y * m });
    }
    if (pad.rightStick) {
        let f = player.rightJoint ? player.body : player.rightHand;
        let m = player.rightJoint ? 0.045 : 0.018;
        scene.matter.body.applyForce(f, f.position, { x: pad.rightStick.x * m, y: pad.rightStick.y * m });
    }
    processarGarra(scene, player, player.leftHand, 'leftJoint', grabL, enemyPrefix);
    processarGarra(scene, player, player.rightHand, 'rightJoint', grabR, enemyPrefix);
}
</script>
</body>
</html>

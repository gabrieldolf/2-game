<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Heave Ho - Peso por Comando na Queda</title>
    <style>
        body { margin:0; background:#111; display:flex; font-family:Arial, sans-serif; overflow:hidden; height:100vh; }
        #sidebar { width:260px; background:#222; color:#fff; padding:15px; display:none; flex-direction:column; gap:10px; border-right:2px solid #444; z-index:10; font-size:13px; box-sizing:border-box; overflow-y:auto; }
        #canvas-container { flex-grow:1; display:flex; justify-content:center; align-items:center; position:relative; }
        button { background:#444; color:white; border:none; padding:8px; cursor:pointer; border-radius:4px; font-weight:bold; width:100%; }
        button:hover { background:#555; } button.active { background:#00ff00; color:black; }
        .section { border-top:1px solid #444; padding-top:10px; display:flex; flex-direction:column; gap:6px; }
        .prop-row { display:flex; justify-content:space-between; align-items:center; gap:10px; }
        input[type="number"], select { width:80px; background:#333; color:white; border:1px solid #555; padding:4px; border-radius:4px; }
        input[type="checkbox"] { width:18px; height:18px; cursor: pointer; }
        h3 { margin:0; font-size:12px; color:#aaa; text-transform:uppercase; }
        #aviso-modo { position:absolute; top:10px; left:10px; background:rgba(0,0,0,0.7); color:#fff; padding:8px 12px; border-radius:5px; font-weight:bold; font-size:14px; pointer-events:none; z-index:5; }
    </style>
    <script src="phaser.min.js"></script>
</head>
<body>

<div id="sidebar">
    <h2>EDITOR</h2>
    <div class="section" style="background:#2c3e50; padding:8px; border-radius:4px; margin-bottom:5px;">
        <h3 style="color:#3498db; font-weight:bold;">Ajuste do Ragdoll</h3>
        <div class="prop-row">
            <label style="color:#fff; font-size:11px;">Modificador Peso Queda:</label>
            <!-- REQUISITO: Valor inicial alterado para 10.0 -->
            <input type="number" id="prop-fall-weight-mod" value="10.0" min="0.0" step="0.1" onchange="if(this.value<0)this.value=0;">
        </div>
    </div>
    <div class="section"><h3>Controles</h3><p style="font-size:11px; color:#aaa; margin:0;">Use as <b>Setas</b> para mover a câmera. No modo Polígono, clique na tela para criar vértices e aperte Enter para finalizar.</p></div>
    <div>
        <button id="btn-create" class="active" onclick="setFerramenta('create')">Criar Novo Objeto</button>
        <button id="btn-select" style="margin-top:5px;" onclick="setFerramenta('select')">Selecionar e Mover</button>
    </div>
    <div class="section">
        <h3>Auxílios</h3>
        <div class="prop-row"><label>Mostrar Grade:</label><input type="checkbox" id="prop-grid-active" onchange="alternarVisibilidadeGrade()"></div>
        <div class="prop-row"><label>Tamanho Grade:</label><input type="number" id="prop-grid-size" value="64" min="8" max="128" onchange="alternarVisibilidadeGrade()"></div>
        <div class="prop-row"><label style="color:#55ff55; font-weight:bold;">Alinhamento Ímã:</label><input type="checkbox" id="prop-snap-active" checked></div>
    </div>
    <div class="section">
        <h3 id="status-modo" style="color:#55ff55;">Criando novos objetos</h3>
        <div class="prop-row"><label>Forma:</label><select id="prop-shape" onchange="atualizarInterfaceForma(); atualizarObjetoExistente();"><option value="box">Retângulo</option><option value="circle">Esfera</option><option value="polygon">Polígono Customizado</option></select></div>
        
        <div class="prop-row" style="background:#27ae60; padding:6px; border-radius:4px;"><label style="color:#fff; font-weight:bold;">Objeto Manuseável:</label><input type="checkbox" id="prop-manuseavel" checked onchange="atualizarObjetoExistente()"></div>
        
        <div class="prop-row" id="row-w"><label id="label-w">Largura (px):</label><input type="number" id="prop-w" value="100" min="10" max="400" onchange="atualizarObjetoExistente()"></div>
        <div class="prop-row" id="row-h"><label>Altura (px):</label><input type="number" id="prop-h" value="100" min="10" max="400" onchange="atualizarObjetoExistente()"></div>
        <div class="prop-row"><label>Gravidade:</label><input type="checkbox" id="prop-gravity" checked onchange="atualizarObjetoExistente()"></div>
        
        <div class="prop-row"><label style="color:#3498db; font-weight:bold;">Fixar Posição (Eixo X/Y):</label><input type="checkbox" id="prop-lock-pos" onchange="atualizarObjetoExistente()"></div>
        <div class="prop-row"><label>Bloquear Rotação:</label><input type="checkbox" id="prop-lock-rot" onchange="atualizarObjetoExistente()"></div>
        
        <div class="prop-row"><label>Massa (Peso):</label><input type="number" id="prop-mass" value="1.0" step="0.1" onchange="atualizarObjetoExistente()"></div>
        <div class="prop-row"><label>Arrasto Ar:</label><input type="number" id="prop-air" value="0.02" step="0.01" onchange="atualizarObjetoExistente()"></div>
        <div class="prop-row"><label>Elasticidade:</label><input type="number" id="prop-bounce" value="0.1" step="0.05" min="0" max="1" onchange="atualizarObjetoExistente()"></div>
        <button id="btn-delete" style="background:#ff4757; display:none; margin-top:5px;" onclick="deletarObjetoSelecionado()">Deletar Objeto</button>
    </div>
</div>
<div id="canvas-container">
    <div id="aviso-modo">Aperte [E] para abrir o Editor</div>
</div>

<script>
const SCREEN_WIDTH = 1024, SCREEN_HEIGHT = 768, WORLD_WIDTH = 3000, WORLD_HEIGHT = 2000;
const config = {
    type: Phaser.AUTO, width: SCREEN_WIDTH, height: SCREEN_HEIGHT, parent: 'canvas-container', backgroundColor: '#4488aa',
    physics: { default: 'matter', matter: { gravity: { y:1.5 }, debug: true } },
    input: { gamepad: true }, scene: { preload: preload, create: create, update: update }
};
const game = new Phaser.Game(config);
let player1, player2, ferramentaAtual = 'create', objetoSelecionado = null, listaObjetosEditaveis = [];
let gridGraphics, bordasFixasDoCenario = [], cursorsKeyboard;
let modoEditorAtivo = false, cameraSalvaX = 0, cameraSalvaY = 0, cameraSalvaZoom = 1;
let clickOffsetX = 0, clickOffsetY = 0;

let verticesCriacaoAtiva = [], previewGraphicsPoligono = null;
const CAT_AMBIENTE = 0x0001, CAT_PLAYER = 0x0002;

function preload() {
    let canvas = document.createElement('canvas'); canvas.width = 16; canvas.height = 16;
    let ctx = canvas.getContext('2d');
    let grad = ctx.createRadialGradient(8, 8, 0, 8, 8, 8);
    grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
    grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(8, 8, 8, 0, Math.PI * 2); ctx.fill();
    this.textures.addCanvas('spark', canvas);
}

function create() {
    this.matter.world.setBounds(0, 0, WORLD_WIDTH, WORLD_HEIGHT, 100, true, true, true, true);
    this.cameras.main.setBounds(0, 0, WORLD_WIDTH, WORLD_HEIGHT);
    gridGraphics = this.add.graphics().setDepth(1);
    previewGraphicsPoligono = this.add.graphics().setDepth(15);
    cursorsKeyboard = this.input.keyboard.createCursorKeys();
    
    const ambConf = { isStatic:true, label:'ambiente', friction:0.8, restitution:0.1, collisionFilter: { category: CAT_AMBIENTE, mask: CAT_PLAYER | CAT_AMBIENTE } };
    const borda = (s, x, y, w, h) => {
        let b = s.matter.add.rectangle(x, y, w, h, ambConf); 
        b.isStaticBorder = true; b.manuseavel = false; bordasFixasDoCenario.push(b);
        s.add.graphics().fillStyle(0x1a1a1a, 1).fillRect(x - w/2, y - h/2, w, h).setDepth(2);
    };
    borda(this, WORLD_WIDTH/2, WORLD_HEIGHT-25, WORLD_WIDTH, 50); borda(this, WORLD_WIDTH/2, 25, WORLD_WIDTH, 50);
    borda(this, 25, WORLD_HEIGHT/2, 50, WORLD_HEIGHT); borda(this, WORLD_WIDTH-25, WORLD_HEIGHT/2, 50, WORLD_HEIGHT);
    
    this.matter.world.on('collisionstart', (event) => {
        event.pairs.forEach(pair => {
            let bodyA = pair.bodyA, bodyB = pair.bodyB;
            processarToqueParaContato(bodyA, bodyB, pair); processarToqueParaContato(bodyB, bodyA, pair);
        });
    });
    this.matter.world.on('collisionactive', (event) => {
        event.pairs.forEach(pair => {
            let bodyA = pair.bodyA, bodyB = pair.bodyB;
            processarToqueParaContato(bodyA, bodyB, pair); processarToqueParaContato(bodyB, bodyA, pair);
        });
    });
    this.matter.world.on('collisionend', (event) => {
        event.pairs.forEach(pair => {
            let bodyA = pair.bodyA, bodyB = pair.bodyB;
            quebrarToqueParaContato(bodyA, bodyB); quebrarToqueParaContato(bodyB, bodyA);
        });
    });

    this.input.on('pointerdown', (p) => {
        if (!modoEditorAtivo) return;
        if (ferramentaAtual === 'create') {
            if (document.getElementById('prop-shape').value === 'polygon') {
                verticesCriacaoAtiva.push({ x: p.worldX, y: p.worldY });
            } else {
                executarCriacaoObjeto(this, p.worldX, p.worldY);
            }
        } else {
            executarSelecaoObjeto(this, p.worldX, p.worldY, p);
        }
    });
    
    this.input.on('pointermove', function(p) {
        if (modoEditorAtivo && ferramentaAtual === 'select' && objetoSelecionado && p.isDown) {
            let pos = { x: p.worldX - clickOffsetX, y: p.worldY - clickOffsetY };
            if (document.getElementById('prop-snap-active').checked && objetoSelecionado.shape !== 'polygon') {
                pos = calcularAlinhamentoPorProximidade(this, pos.x, pos.y, objetoSelecionado.w, objetoSelecionado.h, objetoSelecionado.shape, objetoSelecionado.body);
            }
            if (objetoSelecionado.body) {
                this.matter.body.setPosition(objetoSelecionado.body, { x: pos.x, y: pos.y });
                this.matter.body.setVelocity(objetoSelecionado.body, { x:0, y:0 });
            } else {
                objetoSelecionado.visualX = pos.x; objetoSelecionado.visualY = pos.y;
            }
            objetoSelecionado.posicaoTravadaX = pos.x; objetoSelecionado.posicaoTravadaY = pos.y;
        }
    }, this);
    this.input.keyboard.on('keydown-E', () => { alternarModoEditor(this); });
    
    this.input.keyboard.on('keydown-ENTER', () => {
        if (modoEditorAtivo && ferramentaAtual === 'create' && document.getElementById('prop-shape').value === 'polygon') {
            finalizarCriacaoPoligono(this);
        }
    });

    this.input.gamepad.on('down', (pad) => {
        if (pad.index === 0 && !player1) player1 = createHeaveHoCharacter(this, 300, WORLD_HEIGHT-150, pad, 0, 0x00ff00);
        if (pad.index === 1 && !player2) player2 = createHeaveHoCharacter(this, 500, WORLD_HEIGHT-150, pad, 1, 0xffff00);
    });
    atualizarInterfaceForma(); alternarVisibilidadeGrade();
}

function alternarModoEditor(scene) {
    modoEditorAtivo = !modoEditorAtivo;
    const panel = document.getElementById('sidebar');
    const aviso = document.getElementById('aviso-modo');
    verticesCriacaoAtiva = []; previewGraphicsPoligono.clear();
    
    if (modoEditorAtivo) {
        cameraSalvaX = scene.cameras.main.scrollX; cameraSalvaY = scene.cameras.main.scrollY; cameraSalvaZoom = scene.cameras.main.zoom;
        scene.cameras.main.setZoom(1.0); scene.matter.world.pause();
        panel.style.display = 'flex'; aviso.innerText = "Modo Editor Ativo - Aperte [E] para Jogar"; aviso.style.color = "#00ff00";
    } else {
        desmarcarObjetoDoEditor(); scene.cameras.main.scrollX = cameraSalvaX; scene.cameras.main.scrollY = cameraSalvaY; scene.cameras.main.setZoom(cameraSalvaZoom);
        scene.matter.world.resume(); panel.style.display = 'none'; aviso.innerText = "Aperte [E] para abrir o Editor"; aviso.style.color = "#fff";
    }
    alternarVisibilidadeGrade();
}

function alternarVisibilidadeGrade() {
    gridGraphics.clear(); if (!modoEditorAtivo || !document.getElementById('prop-grid-active').checked) return;
    const gSize = parseInt(document.getElementById('prop-grid-size').value) || 64; gridGraphics.lineStyle(1, 0xffffff, 0.15);
    for (let x = 0; x < WORLD_WIDTH; x += gSize) gridGraphics.lineBetween(x, 0, x, WORLD_HEIGHT);
    for (let y = 0; y < WORLD_HEIGHT; y += gSize) gridGraphics.lineBetween(0, y, WORLD_WIDTH, y);
}
function atualizarInterfaceForma() {
    const s = document.getElementById('prop-shape').value;
    document.getElementById('row-h').style.display = (s === 'circle' || s === 'polygon') ? 'none' : 'flex';
    document.getElementById('row-w').style.display = (s === 'polygon') ? 'none' : 'flex';
    document.getElementById('label-w').innerText = s === 'circle' ? "Raio (px):" : "Largura (px):";
}

function extrairCamposPainel() {
    return {
        shape: document.getElementById('prop-shape').value,
        manuseavel: document.getElementById('prop-manuseavel').checked,
        physicsActive: true,
        w: parseFloat(document.getElementById('prop-w').value) || 50, h: parseFloat(document.getElementById('prop-h').value) || 50,
        gravity: document.getElementById('prop-gravity').checked, lockPos: document.getElementById('prop-lock-pos').checked, lockRot: document.getElementById('prop-lock-rot').checked,
        mass: parseFloat(document.getElementById('prop-mass').value) || 1, air: parseFloat(document.getElementById('prop-air').value) || 0.02, bounce: parseFloat(document.getElementById('prop-bounce').value) || 0
    };
}

function executarCriacaoObjeto(scene, x, y) {
    let ax = x, ay = y; const c = extrairCamposPainel();
    if (document.getElementById('prop-snap-active').checked) { let pos = calcularAlinhamentoPorProximidade(scene, ax, ay, c.w, c.h, c.shape, null); ax = pos.x; ay = pos.y; }
    
    let conf = { 
        isStatic: !c.manuseavel, 
        label: 'ambiente', 
        ignoreGravity: !c.gravity, 
        mass: c.mass, 
        friction: 0.8, 
        frictionAir: c.air, 
        restitution: c.bounce, 
        collisionFilter: { category: CAT_AMBIENTE, mask: CAT_PLAYER | CAT_AMBIENTE } 
    };
    
    let body = (c.shape === 'box') ? scene.matter.add.rectangle(ax, ay, c.w, c.h, conf) : scene.matter.add.circle(ax, ay, c.w, conf);
    body.manuseavel = c.manuseavel;
    if (!body.isStatic) { scene.matter.body.setInertia(body, c.lockRot ? Infinity : body.inertia); }
    
    listaObjetosEditaveis.push({ body: body, gfx: scene.add.graphics().setDepth(3), shape: c.shape, w: c.w, h: c.h, gravity: c.gravity, lockPos: c.lockPos, lockRot: c.lockRot, mass: c.mass, air: c.air, bounce: c.bounce, posicaoTravadaX: ax, posicaoTravadaY: ay, physicsActive: true, visualX: ax, visualY: ay, dadosDesenhoVisual: null, manuseavel: c.manuseavel });
}

function finalizarCriacaoPoligono(scene) {
    if (verticesCriacaoAtiva.length < 3) { alert("Polígonos precisam de pelo menos 3 vértices!"); return; }
    const c = extrairCamposPainel();
    
    let somatorioX = 0, somatorioY = 0; verticesCriacaoAtiva.forEach(v => { somatorioX += v.x; somatorioY += v.y; });
    let centroX = somatorioX / verticesCriacaoAtiva.length; let centroY = somatorioY / verticesCriacaoAtiva.length;
    
    let conf = { 
        isStatic: !c.manuseavel, 
        label: 'ambiente', 
        ignoreGravity: !c.gravity, 
        mass: c.manuseavel ? (c.mass / verticesCriacaoAtiva.length) : c.mass, 
        friction: 0.8, 
        frictionAir: c.air, 
        restitution: c.bounce, 
        collisionFilter: { category: CAT_AMBIENTE, mask: CAT_PLAYER | CAT_AMBIENTE } 
    };
    
    let partesFisicasTriangulares = [];
    for (let i = 0; i < verticesCriacaoAtiva.length; i++) {
        let p1 = verticesCriacaoAtiva[i]; let p2 = verticesCriacaoAtiva[(i + 1) % verticesCriacaoAtiva.length];
        let trianguloVertices = [{ x: centroX, y: centroY }, { x: p1.x, y: p1.y }, { x: p2.x, y: p2.y }];
        let corpoFatiaPuro = Phaser.Physics.Matter.Matter.Bodies.fromVertices((centroX + p1.x + p2.x)/3, (centroY + p1.y + p2.y)/3, trianguloVertices, conf);
        if (corpoFatiaPuro) partesFisicasTriangulares.push(corpoFatiaPuro);
    }
    
    let body = scene.matter.body.create({ parts: partesFisicasTriangulares, isStatic: !c.manuseavel, label: 'ambiente', ignoreGravity: !c.gravity });
    body.manuseavel = c.manuseavel;
    scene.matter.world.add(body); scene.matter.body.setPosition(body, { x: centroX, y: centroY });
    if (!body.isStatic) { scene.matter.body.setInertia(body, c.lockRot ? Infinity : body.inertia); }
    
    let verticesLocaisRelativos = verticesCriacaoAtiva.map(v => { return { x: v.x - centroX, y: v.y - centroY }; });
    listaObjetosEditaveis.push({ body: body, gfx: scene.add.graphics().setDepth(3), shape: 'polygon', w: 0, h: 0, gravity: c.gravity, lockPos: c.lockPos, lockRot: c.lockRot, mass: c.mass, air: c.air, bounce: c.bounce, posicaoTravadaX: centroX, posicaoTravadaY: centroY, physicsActive: true, visualX: centroX, visualY: centroY, dadosDesenhoVisual: verticesLocaisRelativos, manuseavel: c.manuseavel });
    verticesCriacaoAtiva = []; previewGraphicsPoligono.clear();
}
function executarSelecaoObjeto(scene, x, y, pointer) {
    let prox = null, mDist = Infinity;
    listaObjetosEditaveis.forEach(obj => {
        let colidiu = false;
        if (obj.body) {
            colidiu = Phaser.Physics.Matter.Matter.Vertices.contains(obj.body.vertices, { x: x, y: y });
        } else {
            let d = Math.sqrt((obj.visualX - x)**2 + (obj.visualY - y)**2);
            if (obj.shape === 'circle' && d <= obj.w) colidiu = true;
            else if (obj.shape === 'box' && Math.abs(obj.visualX - x) <= obj.w/2 && Math.abs(obj.visualY - y) <= obj.h/2) colidiu = true;
            else if (obj.shape === 'polygon' && obj.dadosDesenhoVisual) {
                let verticesGlobaisEsteticos = obj.dadosDesenhoVisual.map(v => { return { x: v.x + obj.visualX, y: v.y + obj.visualY }; });
                colidiu = Phaser.Physics.Matter.Matter.Vertices.contains(verticesGlobaisEsteticos, { x: x, y: y });
            }
        }
        if (colidiu) {
            let posX = obj.body ? obj.body.position.x : obj.visualX; let posY = obj.body ? obj.body.position.y : obj.visualY;
            let dist = Math.sqrt((posX - x)**2 + (posY - y)**2); if (dist < mDist) { mDist = dist; prox = obj; }
        }
    });
    if (prox) {
        selecionarObjetoDoEditor(prox);
        let posX = prox.body ? prox.body.position.x : prox.visualX; let posY = prox.body ? prox.body.position.y : prox.visualY;
        clickOffsetX = x - posX; clickOffsetY = y - posY;
    } else if (!pointer.leftButtonDown()) { desmarcarObjetoDoEditor(); }
}

function selecionarObjetoDoEditor(obj) {
    objetoSelecionado = obj; document.getElementById('btn-delete').style.display = 'block';
    let s = document.getElementById('status-modo'); s.innerText = "Editando selecionado"; s.style.color = "#ffea00";
    document.getElementById('prop-shape').value = obj.shape; document.getElementById('prop-w').value = obj.w; document.getElementById('prop-h').value = obj.h;
    document.getElementById('prop-gravity').checked = obj.gravity; document.getElementById('prop-lock-pos').checked = obj.lockPos;
    document.getElementById('prop-lock-rot').checked = obj.lockRot; document.getElementById('prop-manuseavel').checked = obj.manuseavel;
    document.getElementById('prop-mass').value = obj.body ? obj.body.mass.toFixed(1) : obj.mass; document.getElementById('prop-air').value = obj.air;
    document.getElementById('prop-bounce').value = obj.bounce;
    atualizarInterfaceForma();
}
function desmarcarObjetoDoEditor() { objetoSelecionado = null; document.getElementById('btn-delete').style.display = 'none'; clickOffsetX = 0; clickOffsetY = 0; }
function atualizarObjetoExistente() {
    if (ferramentaAtual !== 'select' || !objetoSelecionado) return;
    let obj = objetoSelecionado, scene = game.scene.getScene('default'), c = extrairCamposPainel();
    let px = obj.body ? obj.body.position.x : obj.visualX; let py = obj.body ? obj.body.position.y : obj.visualY;
    let anguloSalvo = obj.body ? obj.body.angle : 0;
    
    if (obj.body) scene.matter.world.remove(obj.body); obj.body = null;
    obj.shape = c.shape; obj.w = c.w; obj.h = c.h; obj.gravity = c.gravity; obj.lockPos = c.lockPos; obj.lockRot = c.lockRot; obj.mass = c.mass; obj.air = c.air; obj.bounce = c.bounce; obj.visualX = px; obj.visualY = py; obj.manuseavel = c.manuseavel;
    
    let conf = { 
        isStatic: !c.manuseavel, 
        label: 'ambiente', 
        ignoreGravity: !obj.gravity, 
        mass: obj.mass / (obj.dadosDesenhoVisual ? obj.dadosDesenhoVisual.length : 1), 
        friction: 0.8, 
        frictionAir: c.air, 
        restitution: c.bounce, 
        collisionFilter: { category: CAT_AMBIENTE, mask: CAT_PLAYER | CAT_AMBIENTE } 
    };
    
    if (obj.shape === 'box') obj.body = scene.matter.add.rectangle(px, py, obj.w, obj.h, conf);
    else if (obj.shape === 'circle') obj.body = scene.matter.add.circle(px, py, obj.w, conf);
    else if (obj.shape === 'polygon' && obj.dadosDesenhoVisual) {
        let partesFisicasTriangulares = [];
        for (let i = 0; i < obj.dadosDesenhoVisual.length; i++) {
            let p1 = obj.dadosDesenhoVisual[i]; let p2 = obj.dadosDesenhoVisual[(i + 1) % obj.dadosDesenhoVisual.length];
            let trianguloVertices = [{ x: 0, y: 0 }, { x: p1.x, y: p1.y }, { x: p2.x, y: p2.y }];
            let corpoFatiaPuro = Phaser.Physics.Matter.Matter.Bodies.fromVertices(px + (p1.x + p2.x)/3, py + (p1.y + p2.y)/3, trianguloVertices, conf);
            if (corpoFatiaPuro) partesFisicasTriangulares.push(corpoFatiaPuro);
        }
        obj.body = scene.matter.body.create({ parts: partesFisicasTriangulares, isStatic: !c.manuseavel, label: 'ambiente', ignoreGravity: !obj.gravity });
        scene.matter.world.add(obj.body); scene.matter.body.setPosition(obj.body, { x: px, y: py });
    }
    
    if (obj.body) {
        obj.body.manuseavel = c.manuseavel;
        if (!obj.body.isStatic) { scene.matter.body.setInertia(obj.body, obj.lockRot ? Infinity : obj.body.inertia); scene.matter.body.setAngle(obj.body, anguloSalvo); }
    }
}

function calcularAlinhamentoPorProximidade(scene, x, y, w, h, shape, ignorarCorpo) {
    let finalX = x, finalY = y; const DISTANCIA_IMA = 20, corpos = scene.matter.world.localWorld.bodies;
    const r = w, mE = x - r, mD = x + r;
    const mT = y - (shape === 'circle' ? w : h/2), mB = y + (shape === 'circle' ? w : h/2);
    for (let i = 0; i < corpos.length; i++) {
        let b = corpos[i]; if (!b || b === ignorarCorpo || b.label !== 'ambiente') continue;
        const oE = b.bounds.min.x, oD = b.bounds.max.x, oT = b.bounds.min.y, oB = b.bounds.max.y;
        if (mD >= oE - DISTANCIA_IMA && mE <= oD + DISTANCIA_IMA) {
            if (Math.abs(mB - oT) < DISTANCIA_IMA) { finalY = oT - (shape === 'circle' ? w : h/2); break; }
            if (Math.abs(mT - oB) < DISTANCIA_IMA) { finalY = oB + (shape === 'circle' ? w : h/2); break; }
        }
        if (mB >= oT - DISTANCIA_IMA && mT <= oB + DISTANCIA_IMA) {
            if (Math.abs(mD - oE) < DISTANCIA_IMA) { finalX = oE - r; break; }
            if (Math.abs(mE - oD) < DISTANCIA_IMA) { finalX = oD + r; break; }
        }
    }
    return { x: finalX, y: finalY };
}
function desenharObjetoEditor(obj) {
    if (!obj) return; let g = obj.gfx; g.clear();
    let posX = obj.body ? obj.body.position.x : obj.visualX; let posY = obj.body ? obj.body.position.y : obj.visualY;
    let angulo = obj.body ? obj.body.angle : 0;
    
    g.x = posX; g.y = posY; g.rotation = angulo;
    
    let colOrObjeto = obj.manuseavel ? 0x8b5a2b : 0x2c3e50;
    if (obj === objetoSelecionado) colOrObjeto = 0xffea00;
    else if (obj.lockPos) colOrObjeto = 0xf1c40f;
    
    g.fillStyle(colOrObjeto, 1.0);
    g.lineStyle(2, obj.manuseavel ? 0xffffff : 0x111111, 0.8);
    
    if (obj.shape === 'box') { g.fillRect(-obj.w/2, -obj.h/2, obj.w, obj.h); g.strokeRect(-obj.w/2, -obj.h/2, obj.w, obj.h); }
    else if (obj.shape === 'circle') { g.fillCircle(0, 0, obj.w); g.strokeCircle(0, 0, obj.w); g.lineBetween(0, 0, obj.w, 0); }
    else if (obj.shape === 'polygon' && obj.dadosDesenhoVisual && obj.dadosDesenhoVisual.length > 0) {
        g.beginPath();
        g.moveTo(obj.dadosDesenhoVisual.x, obj.dadosDesenhoVisual.y);
        for(let i = 1; i < obj.dadosDesenhoVisual.length; i++) { 
            g.lineTo(obj.dadosDesenhoVisual[i].x, obj.dadosDesenhoVisual[i].y); 
        }
        g.closePath(); g.fill(); g.strokePath();
    }
}

function createArmSegment(scene, bA, bB, num, len, id, grp, list) {
    let last = bA;
    for (let i = 0; i < num; i++) {
        const lastLink = (i === num - 1);
        let link = lastLink ? bB : scene.matter.add.rectangle(bA.position.x, bA.position.y, 10, len, { density: 0.005, frictionAir: 0.02, label: `p${id}_braco`, collisionFilter: { category: CAT_PLAYER, mask: CAT_AMBIENTE | CAT_PLAYER, group: grp } });
        if (!lastLink) list.push(link);
        scene.matter.add.constraint(last, link, len, 1.0, { pointA: last === bA ? { x:0, y:0 } : { x:0, y: len/2 }, pointB: lastLink ? { x:0, y:0 } : { x:0, y: -len/2 } });
        last = link;
    }
}
function processarToqueParaContato(h, b, pair) {
    if (h.label && (h.label.includes('_leftHand') || h.label.includes('_rightHand'))) {
        if (b.label === 'ambiente' || b.label.startsWith('p0_') || b.label.startsWith('p1_')) {
            if (b.label !== h.label.substring(0, 3) + 'body' && !b.label.includes('braco')) {
                h.corpoTocadoAgora = b;
                if (pair.activeContacts && pair.activeContacts.length > 0) {
                    h.pontoDeContatoGlobal = { x: pair.activeContacts.vertex.x, y: pair.activeContacts.vertex.y };
                } else {
                    h.pontoDeContatoGlobal = { x: h.position.x, y: h.position.y };
                }
            }
        }
    }
}

function quebrarToqueParaContato(h, b) {
    if (h.label && (h.label.includes('_leftHand') || h.label.includes('_rightHand'))) {
        if (h.corpoTocadoAgora === b) { h.corpoTocadoAgora = null; h.pontoDeContatoGlobal = null; }
    }
}

function verificarEForcarRedesenhoDebug(scene) {
    if (scene.matter.world.drawDebug && scene.matter.world.debugGraphics) {
        scene.matter.world.debugGraphics.clear(); scene.matter.world.drawDebug();
    }
}
function isButtonPressed(p, i) { return p.buttons[i] ? (p.buttons[i].pressed || p.buttons[i].value > 0.1) : false; }

function desenharJogador(p) {
    const g = p.gfx; g.clear(); g.lineStyle(12, 0x000000, 1);
    g.beginPath(); g.moveTo(p.body.position.x, p.body.position.y); p.leftElos.forEach(e => g.lineTo(e.position.x, e.position.y)); g.lineTo(p.leftHand.position.x, p.leftHand.position.y);
    g.lineStyle(12, 0xff0000, 1); g.strokePath();
    g.beginPath(); g.moveTo(p.body.position.x, p.body.position.y); p.rightElos.forEach(e => g.lineTo(e.position.x, e.position.y)); g.lineTo(p.rightHand.position.x, p.rightHand.position.y);
    g.lineStyle(12, 0x0000ff, 1); g.strokePath();
    g.fillStyle(p.bodyColor, 1).fillCircle(p.body.position.x, p.body.position.y, 22);
    const pad = p.pad; const lL = isButtonPressed(pad, 6) || isButtonPressed(pad, 4), rR = isButtonPressed(pad, 7) || isButtonPressed(pad, 5);
    g.fillStyle(lL ? 0xff8888 : 0xff0000, 1).fillCircle(p.leftHand.position.x, p.leftHand.position.y, 14); g.fillStyle(rR ? 0x8888ff : 0x0000ff, 1).fillCircle(p.rightHand.position.x, p.rightHand.position.y, 14);
}

function processarGarra(s, p, h, jKey, grab, enemy) {
    if (grab && !p[jKey]) {
        let corpoTocado = h.corpoTocadoAgora; let pontoGlobal = h.pontoDeContatoGlobal;
        if (corpoTocado && pontoGlobal) {
            let alvoValido = corpoTocado.parent ? corpoTocado.parent : corpoTocado;
            let rigidezConexao = (alvoValido.manuseavel === true) ? 1.0 : 0.85;
            let pivotLeveCinematico = s.matter.add.circle(h.position.x, h.position.y, 6, { 
                isStatic: false, isSensor: true, ignoreGravity: true, mass: 0, visible: false
            });
            p[jKey] = s.matter.add.constraint(h, pivotLeveCinematico, 1, rigidezConexao, { pointA: { x: 0, y: 0 }, pointB: { x: 0, y: 0 } });
            p[jKey + 'Target'] = alvoValido; p[jKey + 'PivotBody'] = pivotLeveCinematico;
            let dx = h.position.x - alvoValido.position.x, dy = h.position.y - alvoValido.position.y;
            let cos = Math.cos(-alvoValido.angle), sin = Math.sin(-alvoValido.angle);
            p[jKey + 'LocalOffset'] = { x: dx * cos - dy * sin, y: dx * sin + dy * cos };
        }
    } else if (!grab && p[jKey]) {
        if (p[jKey] && typeof p[jKey] === 'object') { s.matter.world.remove(p[jKey]); }
        if (p[jKey + 'PivotBody']) { s.matter.world.remove(p[jKey + 'PivotBody']); }
        p[jKey] = null; p[jKey + 'Target'] = null; p[jKey + 'PivotBody'] = null; p[jKey + 'LocalOffset'] = null;
    }
}
function handlePlayerInput(s, p) {
    const pad = p.pad; if (!pad) return; 
    const lL = isButtonPressed(pad, 6) || isButtonPressed(pad, 4);
    const rR = isButtonPressed(pad, 7) || isButtonPressed(pad, 5);
    const enemy = p.id === 0 ? "p1_" : "p0_";
    
    if (isButtonPressed(pad, 8)) { PlayerId = p.id; executarRespawnIndividual(s, PlayerId); return; }
    
    let campoMod = document.getElementById('prop-fall-weight-mod');
    let valorModificador = campoMod ? parseFloat(campoMod.value) : 10.0;
    if (isNaN(valorModificador) || valorModificador < 0) { valorModificador = 0; if(campoMod) campoMod.value = 0; }
    
    let MASSA_PADRAO = 6.8;
    let massaCalculadaCorpo = MASSA_PADRAO;
    
    // REQUISITOS DE VALIDAÇÃO REVISADOS:
    let totalmenteLivreNoVazio = (!p.leftJoint && !p.rightJoint);
    let estaCaindo = (p.body.velocity.y > 0.5);
    
    // REQUISITO: Detecção anatômica correta da inversão do motor (Eixo Y negativo = Analógico empurrado para CIMA)
    const ZONA_MORTA_CIMA = -0.15;
    let esquerdoParaCima = pad.leftStick && (pad.leftStick.y < ZONA_MORTA_CIMA);
    let direitoParaCima = pad.rightStick && (pad.rightStick.y < ZONA_MORTA_CIMA);
    let algumAnalogicoParaCima = (esquerdoParaCima || direitoParaCima);
    
    // CONDIÇÃO ATUALIZADA: Caindo AND Algum analógico para cima além da zona morta AND Sem agarrar nada
    if (estaCaindo && algumAnalogicoParaCima && totalmenteLivreNoVazio) {
        let pesoExtraEsq = 0;
        let pesoExtraDir = 0;
        
        let deltaYEsq = p.body.position.y - p.leftHand.position.y;
        if (deltaYEsq > 0) {
            pesoExtraEsq = deltaYEsq * valorModificador * 0.1; 
        }
        
        let deltaYDir = p.body.position.y - p.rightHand.position.y;
        if (deltaYDir > 0) {
            pesoExtraDir = deltaYDir * valorModificador * 0.1;
        }
        
        massaCalculadaCorpo += (pesoExtraEsq + pesoExtraDir);
    }
    
    if (p.body.mass !== massaCalculadaCorpo) { s.matter.body.setMass(p.body, massaCalculadaCorpo); }
    
    const FORCA_ESCALADA_CENARIO = 0.045; 
    const FORCA_MOVER_CAIXA = 0.038;
    const RAIO_ORBITA_BRACO = 75;
    
    let movendoEsquerdo = pad.leftStick && (pad.leftStick.x*pad.leftStick.x + pad.leftStick.y*pad.leftStick.y > 0.15*0.15);
    let movendoDireito = pad.rightStick && (pad.rightStick.x*pad.rightStick.x + pad.rightStick.y*pad.rightStick.y > 0.15*0.15);
    
    if (estaCaindo && (movendoEsquerdo || movendoDireito)) {
        p.particleEmitter.explode(3, p.body.position.x, p.body.position.y + 0);
    }
    
    // CONTROLADOR CONTEXTUAL: MÃO ESQUERDA
    let segurandoNaoManuseavelEsq = p.leftJoint && p.leftJointTarget && (p.leftJointTarget.manuseavel === false || p.leftJointTarget.isStatic);
    let segurandoManuseavelEsq = p.leftJoint && p.leftJointTarget && p.leftJointTarget.manuseavel === true;
    
    if (pad.leftStick) {
        let hX = pad.leftStick.x; let hY = pad.leftStick.y; let distAnalogoSq = hX*hX + hY*hY;
        if (segurandoNaoManuseavelEsq) {
            s.matter.body.applyForce(p.body, p.body.position, { x: hX * FORCA_ESCALADA_CENARIO, y: hY * FORCA_ESCALADA_CENARIO });
        } 
        else if (segurandoManuseavelEsq) {
            s.matter.body.applyForce(p.leftHand, p.leftHand.position, { x: hX * FORCA_MOVER_CAIXA, y: hY * FORCA_MOVER_CAIXA });
        } 
        else {
            if (distAnalogoSq > 0.15 * 0.15) {
                let anguloAnalogo = Math.atan2(hY, hX);
                let posXAlvo = p.body.position.x + Math.cos(anguloAnalogo) * RAIO_ORBITA_BRACO;
                let posYAlvo = p.body.position.y + Math.sin(anguloAnalogo) * RAIO_ORBITA_BRACO;
                s.matter.body.setVelocity(p.leftHand, { x: (posXAlvo - p.leftHand.position.x) * 0.25, y: (posYAlvo - p.leftHand.position.y) * 0.25 });
            }
        }
    }
    
    // CONTROLADOR CONTEXTUAL: MÃO DIREITA
    let segurandoNaoManuseavelDir = p.rightJoint && p.rightJointTarget && (p.rightJointTarget.manuseavel === false || p.rightJointTarget.isStatic);
    let segurandoManuseavelDir = p.rightJoint && p.rightJointTarget && p.rightJointTarget.manuseavel === true;
    
    if (pad.rightStick) {
        let hX = pad.rightStick.x; let hY = pad.rightStick.y; let distAnalogoSq = hX*hX + hY*hY;
        if (segurandoNaoManuseavelDir) {
            s.matter.body.applyForce(p.body, p.body.position, { x: hX * FORCA_ESCALADA_CENARIO, y: hY * FORCA_ESCALADA_CENARIO });
        } 
        else if (segurandoManuseavelDir) {
            s.matter.body.applyForce(p.rightHand, p.rightHand.position, { x: hX * FORCA_MOVER_CAIXA, y: hY * FORCA_MOVER_CAIXA });
        } 
        else {
            if (distAnalogoSq > 0.15 * 0.15) {
                let anguloAnalogo = Math.atan2(hY, hX);
                let posXAlvo = p.body.position.x + Math.cos(anguloAnalogo) * RAIO_ORBITA_BRACO;
                let posYAlvo = p.body.position.y + Math.sin(anguloAnalogo) * RAIO_ORBITA_BRACO;
                s.matter.body.setVelocity(p.rightHand, { x: (posXAlvo - p.rightHand.position.x) * 0.25, y: (posYAlvo - p.rightHand.position.y) * 0.25 });
            }
        }
    }
    
    processarGarra(s, p, p.leftHand, 'leftJoint', lL, enemy); 
    processarGarra(s, p, p.rightHand, 'rightJoint', rR, enemy);
}

function aplicarLimiteFrame(scene, body, maxDist, maxRot) {
    if (!body || !body.position || body.isStatic) return;
    if (body.ultimaPos) {
        let dx = body.position.x - body.ultimaPos.x, dy = body.position.y - body.ultimaPos.y, distSq = dx*dx + dy*dy;
        if (distSq > maxDist * maxDist) {
            let dist = Math.sqrt(distSq);
            scene.matter.body.setPosition(body, { x: body.ultimaPos.x + (dx / dist) * maxDist, y: body.ultimaPos.y + (dy / dist) * maxDist });
        }
    }
    body.ultimaPos = { x: body.position.x, y: body.position.y }; body.ultimaRot = body.angle;
}
function createHeaveHoCharacter(scene, x, y, pad, id, col) {
    const grp = scene.matter.world.nextGroup(true), flt = { category: CAT_PLAYER, mask: CAT_AMBIENTE | CAT_PLAYER, group: grp };
    const b = scene.matter.add.circle(x, y, 22, { friction: 0.3, density: 0.05, label: `p${id}_body`, collisionFilter: flt });
    const lH = scene.matter.add.circle(x - 50, y, 14, { density: 0.01, friction: 0.8, frictionAir: 0.01, label: `p${id}_leftHand`, collisionFilter: flt });
    const rH = scene.matter.add.circle(x + 50, y, 14, { density: 0.01, friction: 0.8, frictionAir: 0.01, label: `p${id}_rightHand`, collisionFilter: flt });
    lH.corpoTocadoAgora = null; lH.pontoDeContatoGlobal = null; rH.corpoTocadoAgora = null; rH.pontoDeContatoGlobal = null;
    b.ultimaPos = { x: x, y: y }; b.ultimaRot = 0; lH.ultimaPos = { x: x-50, y: y }; lH.ultimaRot = 0; rH.ultimaPos = { x: x+50, y: y }; rH.ultimaRot = 0;
    let lL = [], rL = []; createArmSegment(scene, b, lH, 3, 16, id, grp, lL); createArmSegment(scene, b, rH, 3, 16, id, grp, rL);
    
    let manager = scene.add.particles(0, 0, 'spark', {
        speed: { min: 80, max: 250 }, angle: { min: 80, max: 100 }, lifespan: 800, 
        scale: { start: 0.6, end: 2.8 }, alpha: { start: 0.5, end: 0.0 },
        tint: { min: 0x777777, max: 0xaaaaaa }, blendMode: 'NORMAL', depth: 9
    });
    
    return { id: id, body: b, leftHand: lH, rightHand: rH, leftElos: lL, rightElos: rL, gfx: scene.add.graphics().setDepth(10), bodyColor: col, pad: pad, leftJoint: null, rightJoint: null, particleEmitter: manager };
}

function executarRespawnIndividual(scene, pNum) {
    const cList = scene.matter.world.localWorld.constraints; const pref = `p${pNum}_`;
    const p = (pNum === 0) ? player1 : player2; if (!p) return;
    limparGarrasAntesDoRespawn(scene, p);
    if (p.particleEmitter) { p.particleEmitter.destroy(); } 
    for (let i = cList.length - 1; i >= 0; i--) { 
        let c = cList[i]; 
        if (c && ((c.bodyA?.label?.includes(pref)) || (c.bodyB?.label?.includes(pref)))) scene.matter.world.remove(c); 
    }
    scene.matter.world.remove(p.body); scene.matter.world.remove(p.leftHand); scene.matter.world.remove(p.rightHand);
    p.leftElos.forEach(e => scene.matter.world.remove(e)); p.rightElos.forEach(e => scene.matter.world.remove(e)); p.gfx.clear();
    if (pNum === 0) player1 = createHeaveHoCharacter(scene, 300, WORLD_HEIGHT - 150, p.pad, 0, 0x00ff00);
    else player2 = createHeaveHoCharacter(scene, 500, WORLD_HEIGHT - 150, p.pad, 1, 0xffff00);
}

function update() {
    let sAct = game.scene.getScene('default'); if (!sAct) return;
    
    if (modoEditorAtivo) {
        let camSpeed = 12;
        if (cursorsKeyboard.left.isDown) this.cameras.main.scrollX -= camSpeed;
        if (cursorsKeyboard.right.isDown) this.cameras.main.scrollX += camSpeed;
        if (cursorsKeyboard.up.isDown) this.cameras.main.scrollY -= camSpeed;
        if (cursorsKeyboard.down.isDown) this.cameras.main.scrollY += camSpeed;
        
        previewGraphicsPoligono.clear();
        if (verticesCriacaoAtiva.length > 0 && document.getElementById('prop-shape').value === 'polygon') {
            previewGraphicsPoligono.lineStyle(3, 0xff0000, 1.0); previewGraphicsPoligono.fillStyle(0xffffff, 1.0);
            previewGraphicsPoligono.beginPath(); previewGraphicsPoligono.moveTo(verticesCriacaoAtiva.x, verticesCriacaoAtiva.y);
            verticesCriacaoAtiva.forEach(v => { previewGraphicsPoligono.lineTo(v.x, v.y); previewGraphicsPoligono.fillCircle(v.x, v.y, 6); });
            previewGraphicsPoligono.strokePath();
        }
        listaObjetosEditaveis.forEach(obj => { desenharObjetoEditor(obj); });
        if (player1) { player1.gfx.clear(); } if (player2) { player2.gfx.clear(); }
        verificarEForcarRedesenhoDebug(this);
        return;
    }

    if (player1) { handlePlayerInput(this, player1); } if (player2) { handlePlayerInput(this, player2); }
    [player1, player2].forEach(p => { if (!p) return; aplicarLimiteFrame(sAct, p.body, 10, 0.08); });
    
    [player1, player2].forEach(p => {
        if (!p) return;
        ['leftJoint', 'rightJoint'].forEach(jKey => {
            if (p[jKey] && p[jKey + 'PivotBody'] && p[jKey + 'Target']) {
                let target = p[jKey + 'Target']; let pivot = p[jKey + 'PivotBody']; let offset = p[jKey + 'LocalOffset'];
                let cos = Math.cos(target.angle), sin = Math.sin(target.angle);
                let mundoX = target.position.x + (offset.x * cos - offset.y * sin);
                let mundoY = target.position.y + (offset.x * sin + offset.y * cos);
                sAct.matter.body.setPosition(pivot, { x: mundoX, y: mundoY });
                sAct.matter.body.setVelocity(pivot, { x: target.velocity.x, y: target.velocity.y });
                let hand = (jKey === 'leftJoint') ? p.leftHand : p.rightHand;
                if (target.manuseavel !== true) {
                    sAct.matter.body.setPosition(hand, { x: mundoX, y: mundoY }); sAct.matter.body.setVelocity(hand, { x: target.velocity.x, y: target.velocity.y });
                }
            }
        });
        
        let distEsqSq = (p.leftHand.position.x - p.body.position.x)**2 + (p.leftHand.position.y - p.body.position.y)**2;
        let distDirSq = (p.rightHand.position.x - p.body.position.x)**2 + (p.rightHand.position.y - p.body.position.y)**2;
        const LIMITE_ESTIRAMENTO_MAXIMO = 185; 
        if (p.leftJoint && distEsqSq > LIMITE_ESTIRAMENTO_MAXIMO * LIMITE_ESTIRAMENTO_MAXIMO) {
            if (p.leftJoint && typeof p.leftJoint === 'object') { sAct.matter.world.remove(p.leftJoint); }
            if (p.leftJointPivotBody) { sAct.matter.world.remove(p.leftJointPivotBody); }
            p.leftJoint = null; p.leftJointTarget = null; p.leftJointPivotBody = null; p.leftJointLocalOffset = null;
        }
        if (p.rightJoint && distDirSq > LIMITE_ESTIRAMENTO_MAXIMO * LIMITE_ESTIRAMENTO_MAXIMO) {
            if (p.rightJoint && typeof p.rightJoint === 'object') { sAct.matter.world.remove(p.rightJoint); }
            if (p.rightJointPivotBody) { sAct.matter.world.remove(p.rightJointPivotBody); }
            p.rightJoint = null; p.rightJointTarget = null; p.rightJointPivotBody = null; p.rightJointLocalOffset = null;
        }
        if (p.body.position.x < -120 || p.body.position.x > WORLD_WIDTH + 120 || p.body.position.y < -120 || p.body.position.y > WORLD_HEIGHT + 120) {
            executarRespawnIndividual(sAct, p.id); return;
        }
    });

    listaObjetosEditaveis.forEach(obj => {
        if (!obj) return;
        if (obj.lockPos && obj.body) {
            if (obj.body.position.x !== obj.posicaoTravadaX || obj.body.position.y !== obj.posicaoTravadaY) {
                sAct.matter.body.setPosition(obj.body, { x: obj.posicaoTravadaX, y: obj.posicaoTravadaY }); sAct.matter.body.setVelocity(obj.body, { x: 0, y: 0 });
            }
        }
        desenharObjetoEditor(obj);
    });
    
    if (player1 && player2) {
        desenharJogador(player1); desenharJogador(player2);
        const mX = (player1.body.position.x + player2.body.position.x) / 2, mY = (player1.body.position.y + player2.body.position.y) / 2;
        let z = Math.min(SCREEN_WIDTH / (Math.abs(player1.body.position.x - player2.body.position.x) + 250), SCREEN_HEIGHT / (Math.abs(player1.body.position.y - player2.body.position.y) + 250));
        z = Phaser.Math.Clamp(z, 0.45, 1.0); 
        this.cameras.main.scrollX = Phaser.Math.Linear(this.cameras.main.scrollX, (mX - SCREEN_WIDTH / 2), 0.08); 
        this.cameras.main.scrollY = Phaser.Math.Linear(this.cameras.main.scrollY, (mY - SCREEN_HEIGHT / 2), 0.08); 
        this.cameras.main.setZoom(Phaser.Math.Linear(this.cameras.main.zoom, z, 0.05));
    } else if (player1) { 
        desenharJogador(player1); this.cameras.main.centerOn(player1.body.position.x, player1.body.position.y); 
    }
}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Heave Ho Physics Sandbox & Editor</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { margin: 0; padding: 0; background: #111; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        #painel-editor { position: absolute; top: 10px; left: 10px; width: 260px; max-height: calc(100vh - 40px); background: rgba(20, 20, 20, 0.92); border: 2px solid #444; border-radius: 8px; color: #fff; padding: 12px; box-sizing: border-box; font-size: 13px; z-index: 9999; display: flex; flex-direction: column; overflow-y: auto; gap: 8px; }
        h3 { margin: 0 0 5px 0; font-size: 14px; border-bottom: 1px solid #444; padding-bottom: 4px; color: #55ff55; text-transform: uppercase; }
        .section { display: flex; flex-direction: column; gap: 4px; margin-bottom: 5px; }
        .prop-row { display: flex; justify-content: space-between; align-items: center; height: 26px; }
        .prop-row label { font-size: 12px; color: #ccc; }
        .prop-row input[type="number"], .prop-row select, .prop-row input[type="text"] { width: 90px; background: #333; border: 1px solid #555; color: #fff; border-radius: 4px; padding: 2px 4px; box-sizing: border-box; height: 22px; font-size: 12px; }
        .prop-row input[type="checkbox"] { width: 16px; height: 16px; margin: 0; cursor: pointer; }
        button { background: #34495e; border: none; color: white; padding: 6px 12px; text-align: center; font-size: 12px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; transition: background 0.2s; }
        button:hover { background: #4e6a82; }
        button.active { background: #27ae60 !important; box-shadow: 0 0 8px rgba(39,174,96,0.5); }
        #btn-delete { background: #c0392b; display: none; }
        #btn-delete:hover { background: #e74c3c; }
        #modo-indicador { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 14px; font-weight: bold; border: 1px solid #555; pointer-events: none; z-index: 9999; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #777; }
    </style>
</head>
<body>
<div id="modo-indicador" style="color: #ffea00; border-color: #ffea00;">MODO EDITOR (F1 para Alternar)</div>
<div id="painel-editor">
    <div class="section" style="background:#2c3e50; padding:8px; border-radius:4px; margin-bottom:5px;">
        <h3 style="color:#3498db; font-weight:bold;">Ajuste do Ragdoll</h3>
        <div class="prop-row">
            <label style="color:#fff; font-size:11px;">Modificador Peso Queda:</label>
            <!-- PONTO 1 RESOLVIDO: Valor inicial padrão definido para 1.0 -->
            <input type="number" id="prop-fall-weight-mod" value="1.0" min="0.0" step="0.1" onchange="if(this.value<0)this.value=0;">
        </div>
    </div>
    <div class="section"><h3>Controles</h3><p style="font-size:11px; color:#aaa; margin:0;">Use as <b>Setas</b> para mover a câmera. No modo Polígono, clique na tela para criar vértices e aperte Enter para finalizar.</p></div>
    <div>
        <button id="btn-create" class="active" onclick="setFerramenta('create')">Criar Novo Objeto</button>
        <button id="btn-select" style="margin-top:5px;" onclick="setFerramenta('select')">Selecionar e Mover</button>
    </div>
    <div class="section">
        <h3>Auxílios</h3>
        <div class="prop-row"><label>Mostrar Grade:</label><input type="checkbox" id="prop-grid-active" onchange="alternarVisibilidadeGrade()"></div>
        <div class="prop-row"><label>Tamanho Grade:</label><input type="number" id="prop-grid-size" value="64" min="8" max="128" onchange="alternarVisibilidadeGrade()"></div>
        <div class="prop-row"><label style="color:#55ff55; font-weight:bold;">Alinhamento Ímã:</label><input type="checkbox" id="prop-snap-active" checked></div>
    </div>
    <div class="section">
        <h3 id="status-modo" style="color:#55ff55;">Criando novos objetos</h3>
        <div class="prop-row"><label>Forma:</label><select id="prop-shape" onchange="atualizarInterfaceForma(); atualizarObjetoExistente();"><option value="box">Retângulo</option><option value="circle">Esfera</option><option value="polygon">Polígono Customizado</option><option value="rope">Corda / Corrente</option></select></div>
        <div id="painel-propriedades-comuns">
            <!-- PONTO 4 RESOLVIDO: Removido 'checked' para iniciar desativado por padrão -->
            <div class="prop-row" style="background:#27ae60; padding:6px; border-radius:4px;"><label style="color:#fff; font-weight:bold;">Objeto Manuseável:</label><input type="checkbox" id="prop-manuseavel" onchange="atualizarObjetoExistente()"></div>
            <div class="prop-row"><label>Fixar no Ar (isStatic):</label><input type="checkbox" id="prop-is-static" checked onchange="atualizarObjetoExistente()"></div>
            <div class="prop-row" id="row-gravity"><label>Sofrer Gravidade:</label><input type="checkbox" id="prop-gravity" onchange="atualizarObjetoExistente()"></div>
            <div class="prop-row" id="row-lock-pos"><label>Fixar Posição (Eixo X/Y):</label><input type="checkbox" id="prop-lock-pos" onchange="atualizarObjetoExistente()"></div>
            <div class="prop-row" id="row-lock-rot"><label>Travar Rotação (Giro):</label><input type="checkbox" id="prop-lock-rot" onchange="atualizarObjetoExistente()"></div>
            <div class="prop-row" id="row-w"><label id="lbl-w">Largura:</label><input type="number" id="prop-w" value="128" step="5" onchange="atualizarObjetoExistente()"></div>
            <div class="prop-row" id="row-h"><label id="lbl-h">Altura:</label><input type="number" id="prop-h" value="64" step="5" onchange="atualizarObjetoExistente()"></div>
            <div class="prop-row" id="row-mass"><label>Massa (Peso):</label><input type="number" id="prop-mass" value="1.0" step="0.1" onchange="atualizarObjetoExistente()"></div>
            <div class="prop-row" id="row-air"><label>Arrasto Ar:</label><input type="number" id="prop-air" value="0.02" step="0.01" onchange="atualizarObjetoExistente()"></div>
            <div class="prop-row" id="row-bounce"><label>Elasticidade:</label><input type="number" id="prop-bounce" value="0.1" step="0.05" min="0" max="1" onchange="atualizarObjetoExistente()"></div>
            <!-- LIMITES DE VELOCIDADE INCORPORADOS NA BARRA LATERAL -->
            <div class="prop-row" id="row-max-vel"><label style="color:#ffaa00;">Limite Vel. (px):</label><input type="number" id="prop-max-vel" value="0" min="0" max="100" step="1" title="0 significa sem limite" onchange="atualizarObjetoExistente()"></div>
            <div class="prop-row" id="row-max-rot"><label style="color:#ffaa00;">Limite Giro (rad):</label><input type="number" id="prop-max-rot" value="0" min="0" max="2" step="0.01" title="0 significa sem limite" onchange="atualizarObjetoExistente()"></div>
        </div>
        <div id="painel-propriedades-rope" style="display:none; background: rgba(255,255,255,0.05); padding: 6px; border-radius: 4px;">
            <div class="prop-row"><label>Comprimento Total:</label><input type="number" id="prop-rope-len" value="240" step="10"></div>
            <div class="prop-row"><label>Quantidade de Elos:</label><input type="number" id="prop-rope-segments" value="8" min="2" max="20"></div>
            <div class="prop-row"><label>Cor da Corda:</label><input type="text" id="prop-rope-color" value="#00ffea"></div>
        </div>
    </div>
    <button id="btn-delete" onclick="deletarObjetoSelecionado()">Deletar Selecionado</button>
</div>
<div id="canvas-container"></div>

<script>
const SCREEN_WIDTH = 1024, SCREEN_HEIGHT = 576, WORLD_WIDTH = 4000, WORLD_HEIGHT = 2000;
const CAT_PLAYER = 0x0001, CAT_AMBIENTE = 0x0002;

let config = {
    type: Phaser.AUTO, width: SCREEN_WIDTH, height: SCREEN_HEIGHT, parent: 'canvas-container',
    physics: { default: 'matter', matter: { gravity: { y: 1.0 }, debug: true, constraintIterations: 4 } },
    scene: { preload: preload, create: create, update: update }
};

let game = new Phaser.Game(config);
let player1 = null, player2 = null, player1Controls = null, player2Controls = null;
let cursorsKeyboard, keyF1, keyEnter;
let modoEditorAtivo = true;
let ferramentaAtual = 'create'; // 'create' ou 'select'
let objetoSelecionado = null, listaObjetosEditaveis = [], bordasFixasDoCenario = [];
let gridGraphics = null, previewGraphicsPoligono = null, verticesCriacaoAtiva = [];
let arrastandoObjetoAtivo = false, offsetArrastoX = 0, offsetArrastoY = 0;

function preload() {}

function create() {
    this.cameras.main.setBounds(0, 0, WORLD_WIDTH, WORLD_HEIGHT);
    this.matter.world.setBounds(0, 0, WORLD_WIDTH, WORLD_HEIGHT, 64, true, true, true, true);
    
    // Identifica e cataloga as 4 bordas pretas estáticas nativas do cenário para habilitar o encaixe perfeito de região
    this.matter.world.walls.left.label = 'borda_esquerda';
    this.matter.world.walls.right.label = 'borda_direita';
    this.matter.world.walls.top.label = 'borda_topo';
    this.matter.world.walls.bottom.label = 'borda_chao';
    bordasFixasDoCenario = [this.matter.world.walls.left, this.matter.world.walls.right, this.matter.world.walls.top, this.matter.world.walls.bottom];
    bordasFixasDoCenario.forEach(w => w.isStaticBorder = true);

    gridGraphics = this.add.graphics().setDepth(1);
    previewGraphicsPoligono = this.add.graphics().setDepth(9999);
    alternarVisibilidadeGrade();

    // Mapeamento nativo unificado para o Teclado/Controles
    cursorsKeyboard = this.input.keyboard.createCursorKeys();
    keyF1 = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.F1);
    keyEnter = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.ENTER);

    configurarControlesNativos(this);
    atualizarInterfaceForma();

    // Evento unificado de toque ajustado com criação estática do ponto guia visual
    this.input.on('pointerdown', (p) => {
        if (!modoEditorAtivo) return;
        if (document.getElementById('prop-shape').value === 'polygon') {
            if (!this.listaBolinhasGuiaCena) { this.listaBolinhasGuiaCena = []; }
            verticesCriacaoAtiva.push({ x: p.worldX, y: p.worldY });
            // PONTO 2 RESOLVIDO: Instancia círculos fixados no mundo que rolam com a câmera sem sumir
            let bolaVisual = this.add.circle(p.worldX, p.worldY, 7, 0xff0000).setStrokeStyle(2, 0xffffff).setDepth(9999);
            this.listaBolinhasGuiaCena.push(bolaVisual);
        } else if (ferramentaAtual === 'create') {
            executarCriacaoObjeto(this, p.worldX, p.worldY);
        } else {
            executarSelecaoObjeto(this, p.worldX, p.worldY, p);
        }
    });
    this.input.on('pointermove', (p) => {
        if (!modoEditorAtivo || ferramentaAtual !== 'select' || !arrastandoObjetoAtivo || !objetoSelecionado) return;
        let nx = p.worldX - offsetArrastoX, ny = p.worldY - offsetArrastoY;
        if (document.getElementById('prop-snap-active').checked) {
            let gs = parseInt(document.getElementById('prop-grid-size').value) || 64;
            nx = Math.round(nx / gs) * gs; ny = Math.round(ny / gs) * gs;
        }
        if (objetoSelecionado.body) {
            this.matter.body.setPosition(objetoSelecionado.body, { x: nx, y: ny });
            this.matter.body.setVelocity(objetoSelecionado.body, { x: 0, y: 0 });
        } else if (objetoSelecionado.shape === 'rope' && objetoSelecionado.ropeElos) {
            let dx = nx - objetoSelecionado.posicaoTravadaX, dy = ny - objetoSelecionado.posicaoTravadaY;
            objetoSelecionado.ropeElos.forEach(elo => this.matter.body.setPosition(elo, { x: elo.position.x + dx, y: elo.position.y + dy }));
            objetoSelecionado.posicaoTravadaX = nx; objetoSelecionado.posicaoTravadaY = ny;
        }
        objetoSelecionado.posicaoTravadaX = nx; objetoSelecionado.posicaoTravadaY = ny;
        objetoSelecionado.visualX = nx; objetoSelecionado.visualY = ny;
    });

    this.input.on('pointerup', () => { arrastandoObjetoAtivo = false; });

    // Registros nativos de contato contínuo do Matter.js para alimentar as variáveis das mãos
    this.matter.world.on('collisionstart', (ev) => {
        ev.pairs.forEach(pair => {
            let labelA = pair.bodyA.label, labelB = pair.bodyB.label;
            if (labelA.includes('leftHand') || labelA.includes('rightHand')) mapearToqueMao(pair.bodyA, pair.bodyB);
            if (labelB.includes('leftHand') || labelB.includes('rightHand')) mapearToqueMao(pair.bodyB, pair.bodyA);
        });
    });

    this.matter.world.on('collisionactive', (ev) => {
        ev.pairs.forEach(pair => {
            let labelA = pair.bodyA.label, labelB = pair.bodyB.label;
            if (labelA.includes('leftHand') || labelA.includes('rightHand')) mapearToqueMao(pair.bodyA, pair.bodyB);
            if (labelB.includes('leftHand') || labelB.includes('rightHand')) mapearToqueMao(pair.bodyB, pair.bodyA);
        });
    });
}

function mapearToqueMao(corpoMao, corpoTocado) {
    if (corpoTocado.isSensor && corpoTocado.label !== 'corpo_elo') return; 
    let pNum = corpoMao.label.includes('p0_') ? 0 : 1; let p = (pNum === 0) ? player1 : player2; if (!p) return;
    if (corpoMao.label.includes('leftHand')) p.leftHand.corpoTocadoAgora = corpoTocado;
    if (corpoMao.label.includes('rightHand')) p.rightHand.corpoTocadoAgora = corpoTocado;
}

function executarCriacaoObjeto(scene, x, y) {
    let ax = x, ay = y; if (document.getElementById('prop-snap-active').checked) {
        let gs = parseInt(document.getElementById('prop-grid-size').value) || 64;
        ax = Math.round(x / gs) * gs; ay = Math.round(y / gs) * gs;
    }
    const c = extrairCamposPainel();
    // PONTO 6 RESOLVIDO: O construtor injeta 'corpo_elo' na corda permitindo a colisão de garras
    if (c.shape === 'rope') {
        let elos = [], constraints = []; let segmentLen = c.ropeLen / c.ropeSegments; let lastBody = null;
        for (let i = 0; i < c.ropeSegments; i++) {
            let alturaCalculadaElo = (i === c.ropeSegments - 1) ? segmentLen : (segmentLen + 6);
            let elo = scene.matter.add.rectangle(ax, ay + (i * segmentLen) + segmentLen/2, 14, alturaCalculadaElo, { isStatic: false, isSensor: true, density: 0.008, frictionAir: 0.008, label: 'corpo_elo', collisionFilter: { category: CAT_AMBIENTE, mask: CAT_PLAYER | CAT_AMBIENTE } });
            elo.manuseavel = false; elos.push(elo);
            if (i === 0) constraints.push(scene.matter.add.worldConstraint(elo, 0, 1.0, { pointA: { x: ax, y: ay }, pointB: { x: 0, y: -segmentLen/2 } }));
            else constraints.push(scene.matter.add.constraint(lastBody, elo, 0, 1.0, { pointA: { x: 0, y: segmentLen/2 }, pointB: { x: 0, y: -segmentLen/2 } }));
            lastBody = elo;
        }
        listaObjetosEditaveis.push({ body: null, gfx: scene.add.graphics().setDepth(3), shape: 'rope', w: 14, h: c.ropeLen, ropeElos: elos, ropeConstraints: constraints, ropeColor: c.ropeColor, ropeSegments: c.ropeSegments, ropeLen: c.ropeLen, maxVel: 0, maxRot: 0, posicaoTravadaX: ax, posicaoTravadaY: ay, visualX: ax, visualY: ay, manuseavel: false }); return;
    }
    let conf = { isStatic: c.isStatic, label: 'ambiente', ignoreGravity: !c.gravity, mass: c.mass, friction: 0.8, frictionAir: c.air, restitution: c.bounce, collisionFilter: { category: CAT_AMBIENTE, mask: CAT_PLAYER | CAT_AMBIENTE } };
    let body = (c.shape === 'box') ? scene.matter.add.rectangle(ax, ay, c.w, c.h, conf) : scene.matter.add.circle(ax, ay, c.w, conf);
    body.manuseavel = c.manuseavel; if (!body.isStatic) { scene.matter.body.setInertia(body, c.lockRot ? Infinity : body.inertia); }
    listaObjetosEditaveis.push({ body: body, shape: c.shape, w: c.w, h: c.h, gravity: c.gravity, lockPos: c.lockPos, lockRot: c.lockRot, mass: c.mass, air: c.air, bounce: c.bounce, maxVel: c.maxVel, maxRot: c.maxRot, posicaoTravadaX: ax, posicaoTravadaY: ay, physicsActive: true, visualX: ax, visualY: ay, dadosDesenhoVisual: null, manuseavel: c.manuseavel, isStatic: c.isStatic, gfx: scene.add.graphics().setDepth(3) });
}
function limparBolinhasGuiaDoPoligono(scene) {
    if (typeof previewGraphicsPoligono !== 'undefined' && previewGraphicsPoligono) { previewGraphicsPoligono.clear(); }
    if (scene && scene.listaBolinhasGuiaCena) {
        scene.listaBolinhasGuiaCena.forEach(bola => { if (bola && bola.destroy) { bola.destroy(); } });
        scene.listaBolinhasGuiaCena = [];
    }
}

function finalizarCriacaoPoligono(scene) {
    if (verticesCriacaoAtiva.length < 3) { alert("Polígonos precisam de pelo menos 3 vértices!"); return; }
    const c = extrairCamposPainel();
    let somatorioX = 0, somatorioY = 0; verticesCriacaoAtiva.forEach(v => { somatorioX += v.x; somatorioY += v.y; });
    let centroX = somatorioX / verticesCriacaoAtiva.length; let centroY = somatorioY / verticesCriacaoAtiva.length;
    let conf = { isStatic: c.isStatic, label: 'ambiente', ignoreGravity: !c.gravity, mass: c.manuseavel ? (c.mass / verticesCriacaoAtiva.length) : c.mass, friction: 0.8, frictionAir: c.air, restitution: c.bounce, collisionFilter: { category: CAT_AMBIENTE, mask: CAT_PLAYER | CAT_AMBIENTE } };
    let partesFisicasTriangulares = [];
    for (let i = 0; i < verticesCriacaoAtiva.length; i++) {
        let p1 = verticesCriacaoAtiva[i]; let p2 = verticesCriacaoAtiva[(i + 1) % verticesCriacaoAtiva.length];
        let trianguloVertices = [{ x: centroX, y: centroY }, { x: p1.x, y: p1.y }, { x: p2.x, y: p2.y }];
        let corpoFatiaPuro = Phaser.Physics.Matter.Matter.Bodies.fromVertices((centroX + p1.x + p2.x)/3, (centroY + p1.y + p2.y)/3, trianguloVertices, conf);
        if (corpoFatiaPuro) partesFisicasTriangulares.push(corpoFatiaPuro);
    }
    let body = scene.matter.body.create({ parts: partesFisicasTriangulares, isStatic: c.isStatic, label: 'ambiente', ignoreGravity: !c.gravity });
    body.manuseavel = c.manuseavel;
    scene.matter.world.add(body); scene.matter.body.setPosition(body, { x: centroX, y: centroY });
    if (!body.isStatic) { scene.matter.body.setInertia(body, c.lockRot ? Infinity : body.inertia); }
    let verticesLocaisRelativos = verticesCriacaoAtiva.map(v => { return { x: v.x - centroX, y: v.y - centroY }; });
    listaObjetosEditaveis.push({ body: body, shape: 'polygon', w: 0, h: 0, gravity: c.gravity, lockPos: c.lockPos, lockRot: c.lockRot, mass: c.mass, air: c.air, bounce: c.bounce, maxVel: c.maxVel, maxRot: c.maxRot, posicaoTravadaX: centroX, posicaoTravadaY: centroY, physicsActive: true, visualX: centroX, visualY: centroY, dadosDesenhoVisual: verticesLocaisRelativos, manuseavel: c.manuseavel, isStatic: c.isStatic, gfx: scene.add.graphics().setDepth(3) });
    
    // PONTO 2 RESOLVIDO: Reseta e limpa de forma síncrona os GameObjects de bolinhas vermelhas ao fechar a forma
    verticesCriacaoAtiva = []; 
    limparBolinhasGuiaDoPoligono(scene);
}

function executarSelecaoObjeto(scene, x, y, pointer) {
    let encontrado = null;
    for (let i = listaObjetosEditaveis.length - 1; i >= 0; i--) {
        let obj = listaObjetosEditaveis[i];
        if (obj.body) {
            if (scene.matter.query.point([obj.body], { x: x, y: y }).length > 0) { encontrado = obj; break; }
        } else if (obj.shape === 'rope' && obj.ropeElos) {
            for (let j = 0; j < obj.ropeElos.length; j++) {
                if (scene.matter.query.point([obj.ropeElos[j]], { x: x, y: y }).length > 0) { encontrado = obj; break; }
            }
            if (encontrado) break;
        }
    }
    if (encontrado) {
        selecionarObjetoDoEditor(encontrado); arrastandoObjetoAtivo = true;
        offsetArrastoX = x - encontrado.posicaoTravadaX; offsetArrastoY = y - encontrado.posicaoTravadaY;
    } else {
        objetoSelecionado = null; document.getElementById('btn-delete').style.display = 'none';
        let s = document.getElementById('status-modo'); s.innerText = "Criando novos objetos"; s.style.color = "#55ff55";
    }
}

function selecionarObjetoDoEditor(obj) {
    objetoSelecionado = obj; document.getElementById('btn-delete').style.display = 'block';
    let s = document.getElementById('status-modo'); s.innerText = "Editando selecionado"; s.style.color = "#ffea00";
    document.getElementById('prop-shape').value = obj.shape; atualizarInterfaceForma();
    if (obj.shape !== 'rope') {
        document.getElementById('prop-w').value = obj.w; document.getElementById('prop-h').value = obj.h; document.getElementById('prop-gravity').checked = obj.gravity; 
        document.getElementById('prop-lock-pos').checked = obj.lockPos; document.getElementById('prop-lock-rot').checked = obj.lockRot; document.getElementById('prop-manuseavel').checked = obj.manuseavel;
        document.getElementById('prop-is-static').checked = obj.body ? obj.body.isStatic : obj.isStatic; document.getElementById('prop-mass').value = obj.body ? obj.body.mass.toFixed(1) : obj.mass;
        document.getElementById('prop-air').value = obj.air; document.getElementById('prop-bounce').value = obj.bounce;
        document.getElementById('prop-max-vel').value = obj.maxVel || 0; document.getElementById('prop-max-rot').value = obj.maxRot || 0;
    }
}
function atualizarObjetoExistente() {
    if (!objetoSelecionado || objetoSelecionado.shape === 'rope') return;
    const c = extrairCamposPainel(); let sAct = game.scene.getScene('default');
    objetoSelecionado.w = c.w; objetoSelecionado.h = c.h; objetoSelecionado.gravity = c.gravity;
    objetoSelecionado.lockPos = c.lockPos; objetoSelecionado.lockRot = c.lockRot; objetoSelecionado.manuseavel = c.manuseavel;
    objetoSelecionado.air = c.air; objetoSelecionado.bounce = c.bounce; objetoSelecionado.maxVel = c.maxVel; objetoSelecionado.maxRot = c.maxRot;
    objetoSelecionado.isStatic = c.isStatic;
    
    if (objetoSelecionado.body && objetoSelecionado.shape !== 'polygon') {
        let x = objetoSelecionado.body.position.x, y = objetoSelecionado.body.position.y;
        sAct.matter.world.remove(objetoSelecionado.body);

// AJUSTE FINO INCORPORADO: A garra valida o contato real usando query.collides para eliminar o agarre "no vácuo"
function processarGarra(s, p, h, jKey, grab) {
    if (grab && !p[jKey]) {
        let lado = (jKey === 'leftJoint') ? 'Esquerda' : 'Direita';
        let alvoCorpo = null;
        let caixaDeteccao = { min: { x: h.position.x - 16, y: h.position.y - 16 }, max: { x: h.position.x + 16, y: h.position.y + 16 } };
        
        for (let i = 0; i < bordasFixasDoCenario.length; i++) {
            let b = bordasFixasDoCenario[i]; if (!b) continue;
            if (s.matter.query.region([b], caixaDeteccao).length > 0) { alvoCorpo = b; break; }
        }
        if (!alvoCorpo) {
            for (let i = 0; i < listaObjetosEditaveis.length; i++) {
                let obj = listaObjetosEditaveis[i]; if (!obj) continue;
                if (obj.body && s.matter.query.region([obj.body], caixaDeteccao).length > 0) { alvoCorpo = obj.body; break; }
                else if (obj.shape === 'rope' && obj.ropeElos) {
                    for (let j = 0; j < obj.ropeElos.length; j++) {
                        if (s.matter.query.region([obj.ropeElos[j]], caixaDeteccao).length > 0) { alvoCorpo = obj.ropeElos[j]; break; }
                    }
                    if (alvoCorpo) break;
                }
            }
        }
        if (alvoCorpo) {
            // Verifica o contato através das fronteiras circulares reais da luva para barrar vácuos
            let colisaoDetectada = s.matter.query.collides(h, [alvoCorpo]).length > 0;
            if (!colisaoDetectada) return;

            let alvoValido = alvoCorpo.parent ? alvoCorpo.parent : alvoCorpo;
            let rigidezConexao = (alvoValido.manuseavel === true) ? 1.0 : 0.95;
            let flashGfx = s.add.graphics().setDepth(20);
            flashGfx.lineStyle(4, 0xffea00, 1); flashGfx.lineBetween(h.position.x, h.position.y, h.position.x, h.position.y + 4);
            s.time.delayedCall(150, () => { flashGfx.clear(); flashGfx.destroy(); });
            s.matter.body.setVelocity(h, { x: 0, y: 0 }); s.matter.body.setAngularVelocity(h, 0);
            
            let dx = h.position.x - alvoValido.position.x, dy = h.position.y - alvoValido.position.y;
            let r = alvoValido.rotation ? alvoValido.rotation : 0; if (isNaN(r)) r = 0;
            let localOffset = { x: dx * Math.cos(-r) - dy * Math.sin(-r), y: dx * Math.sin(-r) + dy * Math.cos(-r) };
            if (alvoValido.isStatic) {
                p[jKey + 'PontoPivorMundo'] = { x: h.position.x, y: h.position.y };
                p[jKey] = s.matter.add.worldConstraint(h, 0, 1.0, { pointA: { x: h.position.x, y: h.position.y }, pointB: { x: 0, y: 0 } });
            } else {
                p[jKey + 'PontoPivorMundo'] = null;
                p[jKey] = s.matter.add.constraint(h, alvoValido, 0, rigidezConexao, { pointA: { x: 0, y: 0 }, pointB: localOffset });
            }
            p[jKey + 'Target'] = alvoValido; p[jKey + 'PivotBody'] = null; p[jKey + 'LocalOffset'] = localOffset;
            s.matter.body.setVelocity(p.body, { x: p.body.velocity.x * 0.1, y: p.body.velocity.y * 0.1 });
        }
    } else if (!grab && p[jKey]) {
        if (p[jKey]) s.matter.world.remove(p[jKey]);
        p[jKey] = null; p[jKey + 'Target'] = null; p[jKey + 'PivotBody'] = null; p[jKey + 'LocalOffset'] = null; p[jKey + 'PontoPivorMundo'] = null;
    }
}
function handlePlayerInput(s, p) {
    const pad = p.pad; if (!pad) return; 
    const lL = isButtonPressed(pad, 6) || isButtonPressed(pad, 4); const rR = isButtonPressed(pad, 7) || isButtonPressed(pad, 5);
    if (isButtonPressed(pad, 8)) { executarRespawnIndividual(s, p.id); return; }
    
    // Captura o peso de queda usando o input da barra lateral
    let campoMod = document.getElementById('prop-fall-weight-mod'); let valorModificador = campoMod ? parseFloat(campoMod.value) : 1.0;
    let massaCalculadaCorpo = 6.8; let totalmenteLivreNoVazio = (!p.leftJoint && !p.rightJoint);
    if (p.body.velocity.y > 0.5 && (pad.leftStick?.y < -0.15 || pad.rightStick?.y < -0.15) && totalmenteLivreNoVazio) {
        let deltaYEsq = Math.max(0, p.body.position.y - p.leftHand.position.y); let deltaYDir = Math.max(0, p.body.position.y - p.rightHand.position.y);
        massaCalculadaCorpo += (deltaYEsq + deltaYDir) * valorModificador * 0.1;
    }
    if (p.body.mass !== massaCalculadaCorpo) s.matter.body.setMass(p.body, massaCalculadaCorpo);
    const FORCA_ESCALADA_CENARIO = 0.045, FORCA_MOVER_CAIXA = 0.038, RAIO_ORBITA_BRACO = 96;
    let movendoEsquerdo = pad.leftStick && (pad.leftStick.x*pad.leftStick.x + pad.leftStick.y*pad.leftStick.y > 0.02);
    let movendoDireito = pad.rightStick && (pad.rightStick.x*pad.rightStick.x + pad.rightStick.y*pad.rightStick.y > 0.02);
    
    // Mão Esquerda
    if (p.leftJoint && p.leftJointTarget && !p.leftJointTarget.manuseavel) {
        if (pad.leftStick) s.matter.body.applyForce(p.body, p.body.position, { x: pad.leftStick.x * FORCA_ESCALADA_CENARIO, y: pad.leftStick.y * FORCA_ESCALADA_CENARIO });
        let elo = p.leftJointTarget;
        if (pad.leftStick) {
            let dX = p.body.position.x - elo.position.x, dY = p.body.position.y - elo.position.y, dist = Math.sqrt(dX*dX + dY*dY);
            if (dist > 20) { let intensity = Math.sqrt(pad.leftStick.x**2 + pad.leftStick.y**2); let fatorEmbaloX = elo.velocity.x * 0.0015; let forcaX = (dX / dist) * 0.0048 * intensity + fatorEmbaloX; let forcaY = (dY / dist) * 0.0035 * intensity; s.matter.body.applyForce(elo, elo.position, { x: forcaX, y: forcaY }); }
        }
    } else if (p.leftJoint && p.leftJointTarget && p.leftJointTarget.manuseavel) {
        if (pad.leftStick) s.matter.body.applyForce(p.leftHand, p.leftHand.position, { x: pad.leftStick.x * FORCA_MOVER_CAIXA, y: pad.leftStick.y * FORCA_MOVER_CAIXA });
    } else {
        if (movendoEsquerdo && !p.leftJoint) { let a = Math.atan2(pad.leftStick.y, pad.leftStick.x); let posXAlvo = p.body.position.x + Math.cos(a)*RAIO_ORBITA_BRACO; let posYAlvo = p.body.position.y + Math.sin(a)*RAIO_ORBITA_BRACO; s.matter.body.setVelocity(p.leftHand, { x: (posXAlvo - p.leftHand.position.x)*0.22, y: (posYAlvo - p.leftHand.position.y)*0.22 }); }
    }
    
    // Mão Direita
    if (p.rightJoint && p.rightJointTarget && !p.rightJointTarget.manuseavel) {
        if (pad.rightStick) s.matter.body.applyForce(p.body, p.body.position, { x: pad.rightStick.x * FORCA_ESCALADA_CENARIO, y: pad.rightStick.y * FORCA_ESCALADA_CENARIO });
        let elo = p.rightJointTarget;
        if (pad.rightStick) {
            let dX = p.body.position.x - elo.position.x, dY = p.body.position.y - elo.position.y, dist = Math.sqrt(dX*dX + dY*dY);
            if (dist > 20) { let intensity = Math.sqrt(pad.rightStick.x**2 + pad.rightStick.y**2); let fatorEmbaloX = elo.velocity.x * 0.0015; let forcaX = (dX / dist) * 0.0048 * intensity + fatorEmbaloX; let forcaY = (dY / dist) * 0.0035 * intensity; s.matter.body.applyForce(elo, elo.position, { x: forcaX, y: forcaY }); }
        }
    } else if (p.rightJoint && p.rightJointTarget && p.rightJointTarget.manuseavel) {
        if (pad.rightStick) s.matter.body.applyForce(p.rightHand, p.rightHand.position, { x: pad.rightStick.x * FORCA_MOVER_CAIXA, y: pad.rightStick.y * FORCA_MOVER_CAIXA });
    } else {
        if (movendoDireito && !p.rightJoint) { let a = Math.atan2(pad.rightStick.y, pad.rightStick.x); let posXAlvo = p.body.position.x + Math.cos(a)*RAIO_ORBITA_BRACO; let posYAlvo = p.body.position.y + Math.sin(a)*RAIO_ORBITA_BRACO; s.matter.body.setVelocity(p.rightHand, { x: (posXAlvo - p.rightHand.position.x)*0.22, y: (posYAlvo - p.rightHand.position.y)*0.22 }); }
    }
    processarGarra(s, p, p.leftHand, 'leftJoint', lL); processarGarra(s, p, p.rightHand, 'rightJoint', rR);
}

function createArmSegment(scene, bA, bB, num, len, id, grp, list, listaJuntas) {

        let c = scene.matter.add.constraint(last, link, 0, 1.0, { pointA: last === bA ? { x:0, y:0 } : { x:0, y: len/2 }, pointB: lastLink ? { x:0, y:0 } : { x:0, y: -len/2 }, stiffness: 1.0, damping: 0.01 });

    const grp = scene.matter.world.nextGroup(true), flt = { category: CAT_PLAYER, mask: CAT_AMBIENTE | CAT_PLAYER, group: grp };
    const b = scene.matter.add.circle(x, y, 22, { friction: 0.3, density: 0.05, label: `p${id}_body`, collisionFilter: flt });
    const lH = scene.matter.add.circle(x - 100, y, 14, { density: 0.0005, friction: 0.8, frictionAir: 0.01, label: `p${id}_leftHand`, collisionFilter: flt });
    const rH = scene.matter.add.circle(x + 100, y, 14, { density: 0.0005, friction: 0.8, frictionAir: 0.01, label: `p${id}_rightHand`, collisionFilter: flt });
    lH.corpoTocadoAgora = null; rH.corpoTocadoAgora = null; 
    let lL = [], rL = [], juntasBraço = [];
    createArmSegment(scene, b, lH, 3, 32, id, grp, lL, juntasBraço);
    createArmSegment(scene, b, rH, 3, 32, id, grp, rL, juntasBraço);
    return { id: id, body: b, leftHand: lH, rightHand: rH, leftElos: lL, rightElos: rL, juntasEstruturaisDosBramos: juntasBraço, gfx: scene.add.graphics().setDepth(10), bodyColor: col, pad: pad, leftJoint: null, rightJoint: null };
}

function desenharBonecoHeaveHo(p) {
    if (!p || !p.gfx) return; let g = p.gfx; g.clear();
    g.lineStyle(10, 0x333333, 1.0); g.beginPath(); g.moveTo(p.body.position.x, p.body.position.y);
    p.leftElos.forEach(e => g.lineTo(e.position.x, e.position.y)); g.lineTo(p.leftHand.position.x, p.leftHand.position.y); g.strokePath();
    g.beginPath(); g.moveTo(p.body.position.x, p.body.position.y);
    p.rightElos.forEach(e => g.lineTo(e.position.x, e.position.y)); g.lineTo(p.rightHand.position.x, p.rightHand.position.y); g.strokePath();
    g.fillStyle(p.bodyColor, 1.0); g.lineStyle(2, 0x000000, 1.0); g.fillCircle(p.body.position.x, p.body.position.y, 22); g.strokeCircle(p.body.position.x, p.body.position.y, 22);
    g.fillStyle(0xffffff, 1.0); g.fillCircle(p.body.position.x - 6, p.body.position.y - 4, 6); g.fillCircle(p.body.position.x + 6, p.body.position.y - 4, 6);
    g.fillStyle(0x000000, 1.0); g.fillCircle(p.body.position.x - 6, p.body.position.y - 4, 2); g.fillCircle(p.body.position.x + 6, p.body.position.y - 4, 2);
    let corMaoE = p.leftJoint ? 0xffea00 : 0xcccccc, corMaoD = p.rightJoint ? 0xffea00 : 0xcccccc;
    g.fillStyle(corMaoE, 1.0); g.lineStyle(2, 0x000000, 1.0); g.fillCircle(p.leftHand.position.x, p.leftHand.position.y, 14); g.strokeCircle(p.leftHand.position.x, p.leftHand.position.y, 14);
    g.fillStyle(corMaoD, 1.0); g.lineStyle(2, 0x000000, 1.0); g.fillCircle(p.rightHand.position.x, p.rightHand.position.y, 14); g.strokeCircle(p.rightHand.position.x, p.rightHand.position.y, 14);
}
function configurarEventosDeColisao(scene) {
    scene.matter.world.on('collisionstart', (event) => {
        event.pairs.forEach(pair => {
            let bA = pair.bodyA, bB = pair.bodyB;
            if (bA.label === 'p0_leftHand' || bA.label === 'p0_rightHand') bA.corpoTocadoAgora = bB;
            if (bB.label === 'p0_leftHand' || bB.label === 'p0_rightHand') bB.corpoTocadoAgora = bA;
            if (bA.label === 'p1_leftHand' || bA.label === 'p1_rightHand') bA.corpoTocadoAgora = bB;
            if (bB.label === 'p1_leftHand' || bB.label === 'p1_rightHand') bB.corpoTocadoAgora = bA;
        });
    });
}

function processarGarra(s, p, h, jKey, grab) {
    if (grab && !p[jKey]) {
        let alvoCorpo = null;
        let caixaDeteccao = { min: { x: h.position.x - 16, y: h.position.y - 16 }, max: { x: h.position.x + 16, y: h.position.y + 16 } };
        for (let i = 0; i < bordasFixasDoCenario.length; i++) {
            let b = bordasFixasDoCenario[i]; if (!b) continue;
            if (s.matter.query.region([b], caixaDeteccao).length > 0) { alvoCorpo = b; break; }
        }
        if (!alvoCorpo) {
            for (let i = 0; i < listaObjetosEditaveis.length; i++) {
                let obj = listaObjetosEditaveis[i]; if (!obj) continue;
                if (obj.body && s.matter.query.region([obj.body], caixaDeteccao).length > 0) { alvoCorpo = obj.body; break; }
                else if (obj.shape === 'rope' && obj.ropeElos) {
                    for (let j = 0; j < obj.ropeElos.length; j++) {
                        if (s.matter.query.region([obj.ropeElos[j]], caixaDeteccao).length > 0) { alvoCorpo = obj.ropeElos[j]; break; }
                    }
                    if (alvoCorpo) break;
                }
            }
        }
        if (alvoCorpo) {
            let alvoValido = alvoCorpo.parent ? alvoCorpo.parent : alvoCorpo;
            let rigidezConexao = (alvoValido.manuseavel === true) ? 1.0 : 0.95;
            s.matter.body.setVelocity(h, { x: 0, y: 0 });
            let dx = h.position.x - alvoValido.position.x, dy = h.position.y - alvoValido.position.y;
            let r = alvoValido.rotation ? alvoValido.rotation : 0; if (isNaN(r)) r = 0;
            let localOffset = { x: dx * Math.cos(-r) - dy * Math.sin(-r), y: dx * Math.sin(-r) + dy * Math.cos(-r) };
            if (alvoValido.isStatic) {
                p[jKey] = s.matter.add.worldConstraint(h, 0, 1.0, { pointA: { x: h.position.x, y: h.position.y }, pointB: { x: 0, y: 0 } });
            } else {
                p[jKey] = s.matter.add.constraint(h, alvoValido, 0, rigidezConexao, { pointA: { x: 0, y: 0 }, pointB: localOffset });
            }
            p[jKey + 'Target'] = alvoValido; p[jKey + 'LocalOffset'] = localOffset;
        }
    } else if (!grab && p[jKey]) {
        s.matter.world.remove(p[jKey]);
        p[jKey] = null; p[jKey + 'Target'] = null; p[jKey + 'LocalOffset'] = null;
    }
}
function executarRespawnIndividual(scene, pNum) {
    let p = (pNum === 0) ? player1 : player2; if (!p) return;
    let todasAsJuntasMundo = scene.matter.world.localWorld.constraints;
    for (let i = todasAsJuntasMundo.length - 1; i >= 0; i--) {
        let c = todasAsJuntasMundo[i];
        if (c && (c.bodyA === p.body || c.bodyB === p.body || c.bodyA === p.leftHand || c.bodyB === p.leftHand || c.bodyA === p.rightHand || c.bodyB === p.rightHand)) {
            scene.matter.world.remove(c);
        }
    }
    if (p.leftJoint) scene.matter.world.remove(p.leftJoint);
    if (p.rightJoint) scene.matter.world.remove(p.rightJoint);
    if (p.juntasEstruturaisDosBramos) p.juntasEstruturaisDosBramos.forEach(j => scene.matter.world.remove(j));
    scene.matter.world.remove(p.body); scene.matter.world.remove(p.leftHand); scene.matter.world.remove(p.rightHand);
    if (p.leftElos) p.leftElos.forEach(e => scene.matter.world.remove(e));
    if (p.rightElos) p.rightElos.forEach(e => scene.matter.world.remove(e));
    if (p.gfx) { p.gfx.clear(); p.gfx.destroy(); }
    if (pNum === 0) player1 = createHeaveHoCharacter(scene, 300, WORLD_HEIGHT - 150, p.pad, 0, 0x00ff00);
    else player2 = createHeaveHoCharacter(scene, 500, WORLD_HEIGHT - 150, p.pad, 1, 0xffff00);
}

function update() {
    let sAct = this;
    if (cursors.left.isDown) sAct.cameras.main.scrollX -= 10;
    if (cursors.right.isDown) sAct.cameras.main.scrollX += 10;
    if (cursors.up.isDown) sAct.cameras.main.scrollY -= 10;
    if (cursors.down.isDown) sAct.cameras.main.scrollY += 10;
    
    if (player1 && player1.pad) {
        processarGarra(sAct, player1, player1.leftHand, 'leftJoint', player1.pad.left.isDown);
        processarGarra(sAct, player1, player1.rightHand, 'rightJoint', player1.pad.right.isDown);
        if (player1.pad.up.isDown) executarRespawnIndividual(sAct, 0);
    }
    if (player2 && player2.pad) {
        processarGarra(sAct, player2, player2.leftHand, 'leftJoint', player2.pad.A.isDown);
        processarGarra(sAct, player2, player2.rightHand, 'rightJoint', player2.pad.D.isDown);
        if (player2.pad.W.isDown) executarRespawnIndividual(sAct, 1);
    }
    if (player1) desenharBonecoHeaveHo(player1);
    if (player2) desenharBonecoHeaveHo(player2);
    listaObjetosEditaveis.forEach(obj => {
        if (!obj || !obj.body || obj.body.isStatic) return;
        if (obj.maxVel && obj.maxVel > 0) {
            let velX = obj.body.velocity.x, velY = obj.body.velocity.y;
            let velLin = Math.sqrt(velX * velX + velY * velY);
            if (velLin > obj.maxVel) sAct.matter.body.setVelocity(obj.body, { x: (velX / velLin) * obj.maxVel, y: (velY / velLin) * obj.maxVel });
        }
        if (obj.maxRot && obj.maxRot > 0) {
            let giro = obj.body.angularVelocity;
            if (Math.abs(giro) > obj.maxRot) sAct.matter.body.setAngularVelocity(obj.body, obj.maxRot * Math.sign(giro));
        }
        if (obj.lockPos) {
            if (obj.body.position.x !== obj.posicaoTravadaX || obj.body.position.y !== obj.posicaoTravadaY) {
                sAct.matter.body.setPosition(obj.body, { x: obj.posicaoTravadaX, y: obj.posicaoTravadaY });
                sAct.matter.body.setVelocity(obj.body, { x: 0, y: 0 });
            }
        }
        desenharObjetoEditor(obj);
    });
}
</script>

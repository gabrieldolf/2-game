<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>limite6</title>
    <style>
        body { margin:0; background:#111; display:flex; font-family:Arial, sans-serif; overflow:hidden; height:100vh; }
        #sidebar { width:260px; background:#222; color:#fff; padding:15px; display:none; flex-direction:column; gap:10px; border-right:2px solid #444; z-index:10; font-size:13px; box-sizing:border-box; overflow-y:auto; }
        #canvas-container { flex-grow:1; display:flex; justify-content:center; align-items:center; position:relative; }
        button { background:#444; color:white; border:none; padding:8px; cursor:pointer; border-radius:4px; font-weight:bold; width:100%; }
        button:hover { background:#555; } button.active { background:#00ff00; color:black; }
        .section { border-top:1px solid #444; padding-top:10px; display:flex; flex-direction:column; gap:6px; }
        .prop-row { display:flex; justify-content:space-between; align-items:center; gap:10px; }
        input[type="number"], input[type="color"], select { width:80px; background:#333; color:white; border:1px solid #555; padding:4px; border-radius:4px; }
        input[type="checkbox"] { width:18px; height:18px; cursor: pointer; }
        h3 { margin:0; font-size:12px; color:#aaa; text-transform:uppercase; }
        #aviso-modo { position:absolute; top:10px; left:10px; background:rgba(0,0,0,0.7); color:#fff; padding:8px 12px; border-radius:5px; font-weight:bold; font-size:14px; pointer-events:none; z-index:5; }
    </style>
    <script src="phaser.min.js"></script>
</head>
<body>
<div id="sidebar">
    <h2>EDITOR</h2>
        <div class="section" style="background:#2c3e50; padding:8px; border-radius:4px; margin-bottom:5px;">
        <h3 style="color:#3498db; font-weight:bold;">Ajuste do Ragdoll</h3>
        <div class="prop-row">
            <label style="color:#fff; font-size:11px;">Modificador Peso Queda:</label>
            <!-- PONTO 1: Ajustado valor inicial padrão para 1.0 -->
            <input type="number" id="prop-fall-weight-mod" value="1.0" min="0.0" step="0.1" onchange="if(this.value<0)this.value=0;">
        </div>
    </div>
    <div class="section"><h3>Controles</h3><p style="font-size:11px; color:#aaa; margin:0;">Use as <b>Setas</b> para mover a câmera. No modo Polígono, clique na tela para criar vértices e aperte Enter para finalizar.</p></div>
    <div>
        <button id="btn-create" class="active" onclick="setFerramenta('create')">Criar Novo Objeto</button>
        <button id="btn-select" style="margin-top:5px;" onclick="setFerramenta('select')">Selecionar e Mover</button>
    </div>
    <div class="section">
        <h3>Auxílios</h3>
        <div class="prop-row"><label>Mostrar Grade:</label><input type="checkbox" id="prop-grid-active" onchange="alternarVisibilidadeGrade()"></div>
        <div class="prop-row"><label>Tamanho Grade:</label><input type="number" id="prop-grid-size" value="64" min="8" max="128" onchange="alternarVisibilidadeGrade()"></div>
        <div class="prop-row"><label style="color:#55ff55; font-weight:bold;">Alinhamento Ímã:</label><input type="checkbox" id="prop-snap-active" checked></div>
    </div>
    <div class="section">
        <h3 id="status-modo" style="color:#55ff55;">Criando novos objetos</h3>
        <div class="prop-row"><label>Forma:</label><select id="prop-shape" onchange="atualizarInterfaceForma(); atualizarObjetoExistente();"><option value="box">Retângulo</option><option value="circle">Esfera</option><option value="polygon">Polígono Customizado</option><option value="rope">Corda / Corrente</option></select></div>
        <div id="painel-propriedades-comuns">
            <div class="prop-row" style="background:#27ae60; padding:6px; border-radius:4px;"><label style="color:#fff; font-weight:bold;">Objeto Manuseável:</label><input type="checkbox" id="prop-manuseavel" onchange="atualizarObjetoExistente()"></div>
            <div class="prop-row" style="background:#2980b9; padding:6px; border-radius:4px;"><label style="color:#fff; font-weight:bold;">Fixar no Ar (isStatic):</label><input type="checkbox" id="prop-is-static" onchange="atualizarObjetoExistente()"></div>
            <div class="prop-row" id="row-w"><label id="label-w">Largura (px):</label><input type="number" id="prop-w" value="100" min="10" max="400" onchange="atualizarObjetoExistente()"></div>
            <div class="prop-row" id="row-h"><label>Altura (px):</label><input type="number" id="prop-h" value="100" min="10" max="400" onchange="atualizarObjetoExistente()"></div>
            <div class="prop-row" id="row-gravity"><label>Gravidade:</label><input type="checkbox" id="prop-gravity" checked onchange="atualizarObjetoExistente()"></div>
            <div class="prop-row" id="row-lock-pos"><label style="color:#3498db; font-weight:bold;">Fixar Posição (Eixo X/Y):</label><input type="checkbox" id="prop-lock-pos" onchange="atualizarObjetoExistente()"></div>
            <div class="prop-row" id="row-lock-rot"><label>Bloquear Rotação:</label><input type="checkbox" id="prop-lock-rot" onchange="atualizarObjetoExistente()"></div>
            <div class="prop-row" id="row-mass"><label>Massa (Peso):</label><input type="number" id="prop-mass" value="1.0" step="0.1" onchange="atualizarObjetoExistente()"></div>
            <div class="prop-row" id="row-air"><label>Arrasto Ar:</label><input type="number" id="prop-air" value="0.02" step="0.01" onchange="atualizarObjetoExistente()"></div>
            <div class="prop-row" id="row-max-vel"><label style="color:#ffaa00;">Limite Vel. (px):</label><input type="number" id="prop-max-vel" value="0" min="0" max="100" step="1" title="0 significa sem limite" onchange="atualizarObjetoExistente()"></div>
            <div class="prop-row" id="row-max-rot"><label style="color:#ffaa00;">Limite Giro (rad):</label><input type="number" id="prop-max-rot" value="0" min="0" max="2" step="0.01" title="0 significa sem limite" onchange="atualizarObjetoExistente()"></div>
            <div class="prop-row" id="row-bounce"><label>Elasticidade:</label><input type="number" id="prop-bounce" value="0.1" step="0.05" min="0" max="1" onchange="atualizarObjetoExistente()"></div>
        </div>
        <div id="painel-propriedades-corda" style="display:none; background:#8e44ad; padding:8px; border-radius:4px; margin-top:5px; flex-direction:column; gap:6px;">
            <h3 style="color:#fff; font-weight:bold;">Ajustes da Corda</h3>
            <div class="prop-row"><label>Comprimento Total:</label><input type="number" id="prop-rope-len" value="250" min="30" max="800" onchange="atualizarObjetoExistente()"></div>
            <div class="prop-row"><label>Número de Juntas:</label><input type="number" id="prop-rope-segments" value="8" min="2" max="25" onchange="atualizarObjetoExistente()"></div>
            <div class="prop-row"><label>Cor da Corda:</label><input type="color" id="prop-rope-color" value="#ffffff" onchange="atualizarObjetoExistente()"></div>
        </div>
        <button id="btn-delete" style="background:#ff4757; display:none; margin-top:10px;" onclick="deletarObjetoSelecionado()">Deletar Objeto</button>
    </div>
</div>
<div id="canvas-container">
    <div id="aviso-modo">Aperte [E] para abrir o Editor</div>
</div>
<script>
const SCREEN_WIDTH = 1024, SCREEN_HEIGHT = 768, WORLD_WIDTH = 3000, WORLD_HEIGHT = 2000;
const config = {
    type: Phaser.AUTO, width: SCREEN_WIDTH, height: SCREEN_HEIGHT, parent: 'canvas-container', backgroundColor: '#4488aa',
    physics: { 
        default: 'matter', 
        matter: { 
            gravity: { y:1.5 }, debug: true,
            runner: { constraintIterations: 8, positionIterations: 8, velocityIterations: 6 }
        } 
    },
    input: { gamepad: true }, scene: { preload: preload, create: create, update: update }
};
const game = new Phaser.Game(config);
let player1, player2, ferramentaAtual = 'create', objetoSelecionado = null, listaObjetosEditaveis = [];
let gridGraphics, bordasFixasDoCenario = [], cursorsKeyboard;
let modoEditorAtivo = false, cameraSalvaX = 0, cameraSalvaY = 0, cameraSalvaZoom = 1;
let clickOffsetX = 0, clickOffsetY = 0;
let verticesCriacaoAtiva = [], previewGraphicsPoligono = null;
const CAT_AMBIENTE = 0x0001, CAT_PLAYER = 0x0002;
function desmarcarObjetoDoEditor() { objetoSelecionado = null; document.getElementById('btn-delete').style.display = 'none'; clickOffsetX = 0; clickOffsetY = 0; }
function setFerramenta(f) { ferramentaAtual = f; document.getElementById('btn-create').className = f==='create'?'active':''; document.getElementById('btn-select').className = f==='select'?'active':''; }

function alternarModoEditor(scene) {
    modoEditorAtivo = !modoEditorAtivo;
    const panel = document.getElementById('sidebar');
    const aviso = document.getElementById('aviso-modo');
    verticesCriacaoAtiva = []; previewGraphicsPoligono.clear();
    
    if (modoEditorAtivo) {
        cameraSalvaX = scene.cameras.main.scrollX; cameraSalvaY = scene.cameras.main.scrollY; cameraSalvaZoom = scene.cameras.main.zoom;
        scene.cameras.main.setZoom(1.0); scene.matter.world.pause();
        panel.style.display = 'flex'; aviso.innerText = "Modo Editor Ativo - Aperte [TAB] para Jogar"; aviso.style.color = "#00ff00";
        if (player1) { colocarRespawnIndividualSeExistir(scene, 0); player1 = null; }
        if (player2) { colocarRespawnIndividualSeExistir(scene, 1); player2 = null; }
    } else {
        desmarcarObjetoDoEditor(); scene.cameras.main.scrollX = cameraSalvaX; scene.cameras.main.scrollY = cameraSalvaY; scene.cameras.main.setZoom(cameraSalvaZoom);
        scene.matter.world.resume(); panel.style.display = 'none'; aviso.innerText = "Aperte [TAB] para abrir o Editor"; aviso.style.color = "#fff";
        
        // CORREÇÃO DEFINITIVA: Usa o método oficial do Phaser 3 para puxar o controle físico da porta 0 e porta 1
        let g1 = scene.input.gamepad ? scene.input.gamepad.getPad(0) : null;
        let g2 = scene.input.gamepad ? scene.input.gamepad.getPad(1) : null;
        
        player1 = createHeaveHoCharacter(scene, 300, WORLD_HEIGHT - 150, g1, 0, 0x00ff00);
        player2 = createHeaveHoCharacter(scene, 500, WORLD_HEIGHT - 150, g2, 1, 0xffff00);
    }
    alternarVisibilidadeGrade();
}

function alternarVisibilidadeGrade() {
    gridGraphics.clear(); if (!modoEditorAtivo || !document.getElementById('prop-grid-active').checked) return;
    const gSize = parseInt(document.getElementById('prop-grid-size').value) || 64; gridGraphics.lineStyle(1, 0xffffff, 0.15);
    for (let x = 0; x < WORLD_WIDTH; x += gSize) gridGraphics.lineBetween(x, 0, x, WORLD_HEIGHT);
    for (let y = 0; y < WORLD_HEIGHT; y += gSize) gridGraphics.lineBetween(0, y, WORLD_WIDTH, y);
}
function preload() {}
function create() {
    this.cameras.main.setBounds(0, 0, WORLD_WIDTH, WORLD_HEIGHT);
    this.matter.world.setBounds(0, 0, WORLD_WIDTH, WORLD_HEIGHT, 64, true, true, true, true);
    
    // Armazena as 4 bordas pretas limites fixas do mundo Matter para colisões das mãos
    this.matter.world.walls.left.label = 'borda_fixa';
    this.matter.world.walls.right.label = 'borda_fixa';
    this.matter.world.walls.top.label = 'borda_fixa';
    this.matter.world.walls.bottom.label = 'borda_fixa';
    bordasFixasDoCenario = [this.matter.world.walls.left, this.matter.world.walls.right, this.matter.world.walls.top, this.matter.world.walls.bottom];
    
    gridGraphics = this.add.graphics().setDepth(1);
    previewGraphicsPoligono = this.add.graphics().setDepth(9999);
    alternarVisibilidadeGrade();
    
    cursorsKeyboard = this.input.keyboard.createCursorKeys();
    cursors = this.input.keyboard.addKeys({
        up: Phaser.Input.Keyboard.KeyCodes.W, down: Phaser.Input.Keyboard.KeyCodes.S,
        left: Phaser.Input.Keyboard.KeyCodes.A, right: Phaser.Input.Keyboard.KeyCodes.D,
        respawnP1: Phaser.Input.Keyboard.KeyCodes.R, respawnP2: Phaser.Input.Keyboard.KeyCodes.P,
        actionL1: Phaser.Input.Keyboard.KeyCodes.C, actionR1: Phaser.Input.Keyboard.KeyCodes.V,
        actionL2: Phaser.Input.Keyboard.KeyCodes.N, actionR2: Phaser.Input.Keyboard.KeyCodes.M
    });

    this.input.keyboard.on('keydown-ENTER', () => {
        if (modoEditorAtivo && document.getElementById('prop-shape').value === 'polygon') {
            finalizarCriacaoPoligono(this);
        }
    });

    this.input.keyboard.on('keydown-TAB', (event) => {
        event.preventDefault();
        alternarModoEditor();
    });

    // LISTENER DE CLIQUE: Inicializa o preview e guarda vértices de forma síncrona com a rolagem da câmera
    this.input.on('pointerdown', (p) => {
        if (!modoEditorAtivo) return;
        if (document.getElementById('prop-shape').value === 'polygon') {
            if (!this.listaBolinhasGuiaCena) { this.listaBolinhasGuiaCena = []; }
            if (!previewGraphicsPoligono) { previewGraphicsPoligono = this.add.graphics().setDepth(9999); }
            
            verticesCriacaoAtiva.push({ x: p.worldX, y: p.worldY });
            console.log(`[POLÍGONO] Vértice adicionado: X=${Math.round(p.worldX)}, Y=${Math.round(p.worldY)}`);
            
            let bolaVisual = this.add.circle(p.worldX, p.worldY, 7, 0xff0000).setStrokeStyle(2, 0xffffff).setDepth(9999);
            this.listaBolinhasGuiaCena.push(bolaVisual);
            
            previewGraphicsPoligono.clear();
            if (verticesCriacaoAtiva.length > 1) {
                previewGraphicsPoligono.lineStyle(3, 0xff0000, 0.9);
                previewGraphicsPoligono.beginPath();
                previewGraphicsPoligono.moveTo(verticesCriacaoAtiva[0].x, verticesCriacaoAtiva[0].y);
                for (let i = 1; i < verticesCriacaoAtiva.length; i++) {
                    previewGraphicsPoligono.lineTo(verticesCriacaoAtiva[i].x, verticesCriacaoAtiva[i].y);
                }
                previewGraphicsPoligono.strokePath();
            }
        } else if (ferramentaAtual === 'create') {
            executarCriacaoObjeto(this, p.worldX, p.worldY);
        } else {
            executarSelecaoObjeto(this, p.worldX, p.worldY, p);
        }
    });

    if (typeof configurarEventosDeColisao === 'function') configurarEventosDeColisao(this);

    // LIMITADOR ATÔMICO PÓS-ANALÓGICO: Roda no último instante do frame para impedir que o applyForce ignore o teto [2-game/]
    this.matter.world.on('beforeupdate', () => {
        if (modoEditorAtivo) return; // Só atua durante a simulação do jogo
        
        listaObjetosEditaveis.forEach(obj => {
            if (!obj || !obj.body || obj.body.isStatic) return;

            // 1. Aplica o teto de velocidade linear (movimento do analógico/gravidade)
            if (obj.maxVel && obj.maxVel > 0) {
                let velX = obj.body.velocity.x;
                let velY = obj.body.velocity.y;
                let velocidadeLinearCombinada = Math.sqrt(velX * velX + velY * velY);
                if (velocidadeLinearCombinada > obj.maxVel && velocidadeLinearCombinada > 0) {
                    this.matter.body.setVelocity(obj.body, {
                        x: (velX / velocidadeLinearCombinada) * obj.maxVel,
                        y: (velY / velocidadeLinearCombinada) * obj.maxVel
                    });
                }
            }

            // 2. Aplica o teto de velocidade angular (giro por alavanca do analógico)
            if (obj.maxRot && obj.maxRot > 0) {
                let velocidadeGiroAtual = obj.body.angularVelocity;
                if (Math.abs(velocidadeGiroAtual) > obj.maxRot) {
                    this.matter.body.setAngularVelocity(obj.body, obj.maxRot * Math.sign(velocidadeGiroAtual));
                }
            }
        });
    });

    document.getElementById('prop-manuseavel').checked = false;
    atualizarInterfaceForma();
}
function atualizarInterfaceForma() {
    const s = document.getElementById('prop-shape').value;
    document.getElementById('painel-propriedades-comuns').style.display = (s === 'rope') ? 'none' : 'block';
    document.getElementById('painel-propriedades-corda').style.display = (s === 'rope') ? 'flex' : 'none';
    document.getElementById('row-h').style.display = (s === 'circle' || s === 'polygon' || s === 'rope') ? 'none' : 'flex';
    document.getElementById('row-w').style.display = (s === 'polygon' || s === 'rope') ? 'none' : 'flex';
    document.getElementById('label-w').innerText = s === 'circle' ? "Raio (px):" : "Largura (px):";
}
function extrairCamposPainel() {
    return {
        shape: document.getElementById('prop-shape').value, manuseavel: document.getElementById('prop-manuseavel').checked, isStatic: document.getElementById('prop-is-static').checked,
        w: parseFloat(document.getElementById('prop-w').value) || 50, h: parseFloat(document.getElementById('prop-h').value) || 50,
        gravity: document.getElementById('prop-gravity').checked, lockPos: document.getElementById('prop-lock-pos').checked, lockRot: document.getElementById('prop-lock-rot').checked,
        mass: parseFloat(document.getElementById('prop-mass').value) || 1, air: parseFloat(document.getElementById('prop-air').value) || 0.02, bounce: parseFloat(document.getElementById('prop-bounce').value) || 0,
        ropeLen: parseFloat(document.getElementById('prop-rope-len').value) || 200, ropeSegments: parseInt(document.getElementById('prop-rope-segments').value) || 6, ropeColor: document.getElementById('prop-rope-color').value,
        maxVel: parseFloat(document.getElementById('prop-max-vel').value) || 0,
        maxRot: parseFloat(document.getElementById('prop-max-rot').value) || 0
    };
}
function executarCriacaoObjeto(scene, x, y) {
    let ax = x, ay = y; const c = extrairCamposPainel();
        if (c.shape === 'rope') {
        let elos = [], constraints = []; let segmentLen = c.ropeLen / c.ropeSegments; let lastBody = null;
        for (let i = 0; i < c.ropeSegments; i++) {
            let alturaCalculadaElo = (i === c.ropeSegments - 1) ? segmentLen : (segmentLen + 6);
            let elo = scene.matter.add.rectangle(ax, ay + (i * segmentLen) + segmentLen/2, 14, alturaCalculadaElo, { 
                isStatic: false, isSensor: true, density: 0.008, frictionAir: 0.008, 
                // PONTO 6: Alterado label de 'ambiente' para 'corpo_elo' para a varredura regional das mãos detectar o contato
                label: 'corpo_elo',
                collisionFilter: { category: CAT_AMBIENTE, mask: CAT_PLAYER | CAT_AMBIENTE } 
            });
            elo.manuseavel = false; elos.push(elo);
            if (i === 0) constraints.push(scene.matter.add.worldConstraint(elo, 0, 1.0, { pointA: { x: ax, y: ay }, pointB: { x: 0, y: -segmentLen/2 } }));
            else constraints.push(scene.matter.add.constraint(lastBody, elo, 0, 1.0, { pointA: { x: 0, y: segmentLen/2 }, pointB: { x: 0, y: -segmentLen/2 } }));
            lastBody = elo;
        }
        listaObjetosEditaveis.push({ body: body, gfx: scene.add.graphics().setDepth(3), shape: c.shape, w: c.w, h: c.h, gravity: c.gravity, lockPos: c.lockPos, lockRot: c.lockRot, mass: c.mass, air: c.air, bounce: c.bounce, maxVel: c.maxVel, maxRot: c.maxRot, posicaoTravadaX: ax, posicaoTravadaY: ay, physicsActive: true, visualX: ax, visualY: ay, dadosDesenhoVisual: null, manuseavel: c.manuseavel, isStatic: c.isStatic });
        return;
    }
    let conf = { isStatic: c.isStatic, label: 'ambiente', ignoreGravity: !c.gravity, mass: c.mass, friction: 0.8, frictionAir: c.air, restitution: c.bounce, collisionFilter: { category: CAT_AMBIENTE, mask: CAT_PLAYER | CAT_AMBIENTE } };
    let body = (c.shape === 'box') ? scene.matter.add.rectangle(ax, ay, c.w, c.h, conf) : scene.matter.add.circle(ax, ay, c.w, conf);
    body.manuseavel = c.manuseavel; body.label = 'ambiente';
    if (!body.isStatic) { scene.matter.body.setInertia(body, c.lockRot ? Infinity : body.inertia); }
    listaObjetosEditaveis.push({ body: body, gfx: scene.add.graphics().setDepth(3), shape: c.shape, w: c.w, h: c.h, gravity: c.gravity, lockPos: c.lockPos, lockRot: c.lockRot, mass: c.mass, air: c.air, bounce: c.bounce, maxVel: c.maxVel, maxRot: c.maxRot, posicaoTravadaX: ax, posicaoTravadaY: ay, physicsActive: true, visualX: ax, visualY: ay, dadosDesenhoVisual: null, manuseavel: c.manuseavel, isStatic: c.isStatic });
}
function limparBolinhasGuiaDoPoligono(scene) {
    if (typeof previewGraphicsPoligono !== 'undefined' && previewGraphicsPoligono) { previewGraphicsPoligono.clear(); }
    if (scene && scene.listaBolinhasGuiaCena) {
        scene.listaBolinhasGuiaCena.forEach(bola => {
            if (bola && bola.destroy) { bola.destroy(); }
        });
        scene.listaBolinhasGuiaCena = []; // Esvazia o array limpando a tela
    }
}
function finalizarCriacaoPoligono(scene) {
    if (verticesCriacaoAtiva.length < 3) { alert("Polígonos precisam de pelo menos 3 vértices!"); return; }
    const c = extrairCamposPainel();
    let somatorioX = 0, somatorioY = 0; verticesCriacaoAtiva.forEach(v => { somatorioX += v.x; somatorioY += v.y; });
    let centroX = somatorioX / verticesCriacaoAtiva.length; let centroY = somatorioY / verticesCriacaoAtiva.length;
    let conf = { isStatic: c.isStatic, label: 'ambiente', ignoreGravity: !c.gravity, mass: c.manuseavel ? (c.mass / verticesCriacaoAtiva.length) : c.mass, friction: 0.8, frictionAir: c.air, restitution: c.bounce, collisionFilter: { category: CAT_AMBIENTE, mask: CAT_PLAYER | CAT_AMBIENTE } };
    let partesFisicasTriangulares = [];
    for (let i = 0; i < verticesCriacaoAtiva.length; i++) {
        let p1 = verticesCriacaoAtiva[i]; let p2 = verticesCriacaoAtiva[(i + 1) % verticesCriacaoAtiva.length];
        let trianguloVertices = [{ x: centroX, y: centroY }, { x: p1.x, y: p1.y }, { x: p2.x, y: p2.y }];
        let corpoFatiaPuro = Phaser.Physics.Matter.Matter.Bodies.fromVertices((centroX + p1.x + p2.x)/3, (centroY + p1.y + p2.y)/3, trianguloVertices, conf);
        if (corpoFatiaPuro) partesFisicasTriangulares.push(corpoFatiaPuro);
    }
    let body = scene.matter.body.create({ parts: partesFisicasTriangulares, isStatic: c.isStatic, label: 'ambiente', ignoreGravity: !c.gravity });
    body.manuseavel = c.manuseavel;
    scene.matter.world.add(body); scene.matter.body.setPosition(body, { x: centroX, y: centroY });
    if (!body.isStatic) { scene.matter.body.setInertia(body, c.lockRot ? Infinity : body.inertia); }
    let verticesLocaisRelativos = verticesCriacaoAtiva.map(v => { return { x: v.x - centroX, y: v.y - centroY }; });
    listaObjetosEditaveis.push({ body: body, gfx: scene.add.graphics().setDepth(3), shape: 'polygon', w: 0, h: 0, gravity: c.gravity, lockPos: c.lockPos, lockRot: c.lockRot, mass: c.mass, air: c.air, bounce: c.bounce, maxVel: c.maxVel, maxRot: c.maxRot, posicaoTravadaX: centroX, posicaoTravadaY: centroY, physicsActive: true, visualX: centroX, visualY: centroY, dadosDesenhoVisual: verticesLocaisRelativos, manuseavel: c.manuseavel, isStatic: c.isStatic });
    
    // Zera os pontos lidos e executa a trituração síncrona dos círculos visuais guias na tela
    verticesCriacaoAtiva = []; 
    limparBolinhasGuiaDoPoligono(scene);

        if (pad.leftStick) {
            let dX = p.body.position.x - elo.position.x, dY = p.body.position.y - elo.position.y, dist = Math.sqrt(dX*dX + dY*dY);
            if (dist > 20) { let intensity = Math.sqrt(pad.leftStick.x**2 + pad.leftStick.y**2); let fatorEmbaloX = elo.velocity.x * 0.0015; let forcaX = (dX / dist) * 0.0048 * intensity + fatorEmbaloX; let forcaY = (dY / dist) * 0.0035 * intensity; s.matter.body.applyForce(elo, elo.position, { x: forcaX, y: forcaY }); }
        }
    } else if (p.leftJoint && p.leftJointTarget && p.leftJointTarget.manuseavel) {
        if (pad.leftStick) s.matter.body.applyForce(p.leftHand, p.leftHand.position, { x: pad.leftStick.x * FORCA_MOVER_CAIXA, y: pad.leftStick.y * FORCA_MOVER_CAIXA });
    } else {
        if (movendoEsquerdo && !p.leftJoint) { let a = Math.atan2(pad.leftStick.y, pad.leftStick.x); let posXAlvo = p.body.position.x + Math.cos(a)*RAIO_ORBITA_BRACO; let posYAlvo = p.body.position.y + Math.sin(a)*RAIO_ORBITA_BRACO; s.matter.body.setVelocity(p.leftHand, { x: (posXAlvo - p.leftHand.position.x)*0.22, y: (posYAlvo - p.leftHand.position.y)*0.22 }); }
    }
    if (p.rightJoint && p.rightJointTarget && !p.rightJointTarget.manuseavel) {
        if (pad.rightStick) s.matter.body.applyForce(p.body, p.body.position, { x: pad.rightStick.x * FORCA_ESCALADA_CENARIO, y: pad.rightStick.y * FORCA_ESCALADA_CENARIO });
        let elo = p.rightJointTarget;
        if (pad.rightStick) {
            let dX = p.body.position.x - elo.position.x, dY = p.body.position.y - elo.position.y, dist = Math.sqrt(dX*dX + dY*dY);
            if (dist > 20) { let intensity = Math.sqrt(pad.rightStick.x**2 + pad.rightStick.y**2); let fatorEmbaloX = elo.velocity.x * 0.0015; let forcaX = (dX / dist) * 0.0048 * intensity + fatorEmbaloX; let forcaY = (dY / dist) * 0.0035 * intensity; s.matter.body.applyForce(elo, elo.position, { x: forcaX, y: forcaY }); }
        }
    } else if (p.rightJoint && p.rightJointTarget && p.rightJointTarget.manuseavel) {
        if (pad.rightStick) s.matter.body.applyForce(p.rightHand, p.rightHand.position, { x: pad.rightStick.x * FORCA_MOVER_CAIXA, y: pad.rightStick.y * FORCA_MOVER_CAIXA });
    } else {
        if (movendoDireito && !p.rightJoint) { let a = Math.atan2(pad.rightStick.y, pad.rightStick.x); let posXAlvo = p.body.position.x + Math.cos(a)*RAIO_ORBITA_BRACO; let posYAlvo = p.body.position.y + Math.sin(a)*RAIO_ORBITA_BRACO; s.matter.body.setVelocity(p.rightHand, { x: (posXAlvo - p.rightHand.position.x)*0.22, y: (posYAlvo - p.rightHand.position.y)*0.22 }); }
    }
    processarGarra(s, p, p.leftHand, 'leftJoint', lL); processarGarra(s, p, p.rightHand, 'rightJoint', rR);
}
function executarRespawnIndividual(scene, pNum) {
    let p = (pNum === 0) ? player1 : player2; if (!p) return;
    
    // 1. Remove os ganchos ativos de agarre nas quinas
    if (p.leftJoint) { scene.matter.world.remove(p.leftJoint); }
    if (p.rightJoint) { scene.matter.world.remove(p.rightJoint); }
    
    // 2. Remove todas as juntas e pinos internos que estruturavam o braço ragdoll anterior
    if (p.juntasEstruturaisDosBramos) {
        p.juntasEstruturaisDosBramos.forEach(junta => { scene.matter.world.remove(junta); });
    }
    
    // 3. Destrói os círculos físicos e os elos intermediários de massa leve do motor
    scene.matter.world.remove(p.body); 
    scene.matter.world.remove(p.leftHand); 
    scene.matter.world.remove(p.rightHand);
    if (p.leftElos) p.leftElos.forEach(e => scene.matter.world.remove(e));
    if (p.rightElos) p.rightElos.forEach(e => scene.matter.world.remove(e));
    if (p.gfx) { p.gfx.clear(); p.gfx.destroy(); }
    
    // Spawna o novo personagem com a inércia e a tela de colisões 100% limpas
    if (pNum === 0) player1 = createHeaveHoCharacter(scene, 300, WORLD_HEIGHT - 150, p.pad, 0, 0x00ff00);
    else player2 = createHeaveHoCharacter(scene, 500, WORLD_HEIGHT - 150, p.pad, 1, 0xffff00);
}
function update() {
    let sAct = game.scene.getScene('default'); if (!sAct) return;
    if (modoEditorAtivo && document.getElementById('prop-shape').value === 'polygon') {
        if (!previewGraphicsPoligono) {
            previewGraphicsPoligono = this.add.graphics().setDepth(9999);
        }
        previewGraphicsPoligono.clear();
        
        // Desenha as bolinhas guias vermelhas com contorno branco em cada quina clicada
        verticesCriacaoAtiva.forEach(v => {
            previewGraphicsPoligono.lineStyle(2, 0xffffff, 1);
            previewGraphicsPoligono.fillStyle(0xff0000, 1);
            previewGraphicsPoligono.fillCircle(v.x, v.y, 7);
            previewGraphicsPoligono.strokeCircle(v.x, v.y, 7);
        });
        
        // Conecta os pontos com uma linha guia vermelha visível
        if (verticesCriacaoAtiva.length > 1) {
            previewGraphicsPoligono.lineStyle(3, 0xff0000, 0.9);
            previewGraphicsPoligono.beginPath();
            previewGraphicsPoligono.moveTo(verticesCriacaoAtiva.id ? verticesCriacaoAtiva.id : verticesCriacaoAtiva[0].x, verticesCriacaoAtiva.id ? verticesCriacaoAtiva.id : verticesCriacaoAtiva[0].y);
            // Corrige a leitura sequencial das linhas do polígono
            for (let i = 1; i < verticesCriacaoAtiva.length; i++) {
                previewGraphicsPoligono.lineTo(verticesCriacaoAtiva[i].x, verticesCriacaoAtiva[i].y);
            }
            previewGraphicsPoligono.strokePath();
        }
    } else if (previewGraphicsPoligono) {
        previewGraphicsPoligono.clear();
    }
    if (modoEditorAtivo) {
        let camSpeed = 12; if (cursorsKeyboard.left.isDown) this.cameras.main.scrollX -= camSpeed; if (cursorsKeyboard.right.isDown) this.cameras.main.scrollX += camSpeed;
        if (cursorsKeyboard.up.isDown) this.cameras.main.scrollY -= camSpeed; if (cursorsKeyboard.down.isDown) this.cameras.main.scrollY += camSpeed;
        previewGraphicsPoligono.clear();     // PONTO 5 RESOLVIDO: Se a trava X/Y estiver ativa, zera a velocidade linear e força o retorno à coordenada original sem anular a rotação
    listaObjetosEditaveis.forEach(obj => {
        if (obj && obj.body && obj.lockPos) {
            if (obj.body.position.x !== obj.posicaoTravadaX || obj.body.position.y !== obj.posicaoTravadaY) {
                game.scene.getScene('default').matter.body.setPosition(obj.body, { x: obj.posicaoTravadaX, y: obj.posicaoTravadaY });
                game.scene.getScene('default').matter.body.setVelocity(obj.body, { x: 0, y: 0 });
            }
        }
        if (obj) desenharObjetoEditor(obj);
    }); return;
    }
    if (player1) handlePlayerInput(this, player1); if (player2) handlePlayerInput(this, player2); [player1, player2].forEach(p => { if (!p) return; aplicarLimiteFrame(sAct, p.body, 10); });
    // TRAVA DE ELASTICIDADE ZERO: Mantém as mãos agarradas coladas cirurgicamente no pixel exato do clique
    [player1, player2].forEach(p => {
        if (!p) return;
        if (p.leftJoint && p.leftJointPontoPivorMundo) {
            sAct.matter.body.setPosition(p.leftHand, { x: p.leftJointPontoPivorMundo.x, y: p.leftJointPontoPivorMundo.y });
            sAct.matter.body.setVelocity(p.leftHand, { x: 0, y: 0 });
        }
        if (p.rightJoint && p.rightJointPontoPivorMundo) {
            sAct.matter.body.setPosition(p.rightHand, { x: p.rightJointPontoPivorMundo.x, y: p.rightJointPontoPivorMundo.y });
            sAct.matter.body.setVelocity(p.rightHand, { x: 0, y: 0 });
        }
    });

    if (player1) { player1.gfx.clear(); desenharJogador(player1); } if (player2) { player2.gfx.clear(); desenharJogador(player2); }     // PONTO 5 RESOLVIDO: Se a trava X/Y estiver ativa, zera a velocidade linear e força o retorno à coordenada original sem anular a rotação
    listaObjetosEditaveis.forEach(obj => {
        // Mantém apenas a trava de Eixo X/Y original operando aqui no update
        if (obj && obj.body && obj.lockPos) {
            if (obj.body.position.x !== obj.posicaoTravadaX || obj.body.position.y !== obj.posicaoTravadaY) {
                game.scene.getScene('default').matter.body.setPosition(obj.body, { x: obj.posicaoTravadaX, y: obj.posicaoTravadaY });
                game.scene.getScene('default').matter.body.setVelocity(obj.body, { x: 0, y: 0 });
            }
        }
        if (obj) desenharObjetoEditor(obj);
    });
    if (player1 && player2) {
        const mX = (player1.body.position.x + player2.body.position.x) / 2, mY = (player1.body.position.y + player2.body.position.y) / 2;
        let z = Math.min(SCREEN_WIDTH / (Math.abs(player1.body.position.x - player2.body.position.x) + 250), SCREEN_HEIGHT / (Math.abs(player1.body.position.y - player2.body.position.y) + 250));
        z = Phaser.Math.Clamp(z, 0.45, 1.0); this.cameras.main.scrollX = Phaser.Math.Linear(this.cameras.main.scrollX, (mX - SCREEN_WIDTH / 2), 0.08); this.cameras.main.scrollY = Phaser.Math.Linear(this.cameras.main.scrollY, (mY - SCREEN_HEIGHT / 2), 0.08); this.cameras.main.setZoom(Phaser.Math.Linear(this.cameras.main.zoom, z, 0.05));
    } else if (player1) {
        this.cameras.main.scrollX = Phaser.Math.Linear(this.cameras.main.scrollX, (player1.body.position.x - SCREEN_WIDTH / 2), 0.08); this.cameras.main.scrollY = Phaser.Math.Linear(this.cameras.main.scrollY, (player1.body.position.y - SCREEN_HEIGHT / 2), 0.08);
    } else if (player2) {
        this.cameras.main.scrollX = Phaser.Math.Linear(this.cameras.main.scrollX, (player2.body.position.x - SCREEN_WIDTH / 2), 0.08); this.cameras.main.scrollY = Phaser.Math.Linear(this.cameras.main.scrollY, (player2.body.position.y - SCREEN_HEIGHT / 2), 0.08);
    }
}

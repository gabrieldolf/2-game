<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Clone Heave Ho - Garra Corrigida</title>
    <style>
        body { margin: 0; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        canvas { box-shadow: 0 0 20px rgba(0,0,0,0.8); }
    </style>
    <script src="phaser.min.js"></script>
</head>
<body>

<script>
const config = {
    type: Phaser.AUTO,
    width: 1024,
    height: 768,
    backgroundColor: '#4488aa',
    physics: {
        default: 'matter',
        matter: {
            gravity: { y: 1.5 }, 
            debug: true 
        }
    },
    input: { gamepad: true },
    scene: { preload: preload, create: create, update: update }
};

const game = new Phaser.Game(config);
let player1, player2;

function preload() {}

function create() {
    this.add.text(20, 20, "Garra Corrigida! Aproxime a mão da parede e SEGURE L2 ou R2.", { font: "20px Arial", fill: "#ffffff" });

    // Cenário estático
    this.matter.add.rectangle(512, 740, 1024, 50, { isStatic: true, label: 'ambiente', friction: 0.5 }); 
    this.matter.add.rectangle(512, 25, 1024, 50, { isStatic: true, label: 'ambiente', friction: 0.5 });  
    this.matter.add.rectangle(25, 384, 50, 768, { isStatic: true, label: 'ambiente', friction: 0.5 });  
    this.matter.add.rectangle(999, 384, 50, 768, { isStatic: true, label: 'ambiente', friction: 0.5 });  

    // Plataformas
    this.matter.add.rectangle(250, 450, 300, 40, { isStatic: true, label: 'ambiente', friction: 0.5 }); 
    this.matter.add.rectangle(774, 350, 300, 40, { isStatic: true, label: 'ambiente', friction: 0.5 }); 

    this.input.gamepad.on('down', (pad, button, index) => {
        if (pad.index === 0 && !player1) {
            player1 = createHeaveHoCharacter(this, 250, 300, pad);
        }
        if (pad.index === 1 && !player2) {
            player2 = createHeaveHoCharacter(this, 750, 200, pad);
        }
    });
}

function createArmSegment(scene, bodyA, bodyB, numLinks, linkLength) {
    let lastBody = bodyA;
    
    // Grupo negativo (-1) faz com que os elos ignorem a colisão com o cenário e com o próprio jogador
    // Isso garante que a mão consiga encostar fisicamente nas superfícies para agarrar
    const armGroup = scene.matter.world.nextGroup(true);

    for (let i = 0; i < numLinks; i++) {
        const isLast = (i === numLinks - 1);
        let link;
        
        if (isLast) {
            link = bodyB;
        } else {
            link = scene.matter.add.rectangle(bodyA.position.x, bodyA.position.y, 10, linkLength, { 
                density: 0.005, 
                frictionAir: 0.02,
                label: 'braco',
                collisionFilter: { group: armGroup }
            });
        }

        scene.matter.add.constraint(lastBody, link, linkLength, 1.0, {
            pointA: lastBody === bodyA ? { x: 0, y: 0 } : { x: 0, y: linkLength / 2 },
            pointB: isLast ? { x: 0, y: 0 } : { x: 0, y: -linkLength / 2 }
        });

        lastBody = link;
    }
}

function createHeaveHoCharacter(scene, x, y, gamepad) {
    const body = scene.matter.add.circle(x, y, 22, { friction: 0.3, density: 0.05, label: 'body' });
    
    // Mãos ativas (sem grupo de exclusão) para colidirem perfeitamente com o ambiente
    const leftHand = scene.matter.add.circle(x - 50, y, 14, { density: 0.01, friction: 0.8, frictionAir: 0.01, label: 'leftHand' });
    const rightHand = scene.matter.add.circle(x + 50, y, 14, { density: 0.01, friction: 0.8, frictionAir: 0.01, label: 'rightHand' });

    createArmSegment(scene, body, leftHand, 3, 16);
    createArmSegment(scene, body, rightHand, 3, 16);

    return {
        body: body,
        leftHand: leftHand,
        rightHand: rightHand,
        pad: gamepad,
        leftJoint: null,
        rightJoint: null
    };
}

function update() {
    if (player1) handlePlayerInput(this, player1);
    if (player2) handlePlayerInput(this, player2);
}

function handlePlayerInput(scene, player) {
    const pad = player.pad;
    if (!pad) return;

    const grabbingLeft = pad.buttons[6].pressed || pad.buttons[4].pressed;  // L2 ou L1
    const grabbingRight = pad.buttons[7].pressed || pad.buttons[5].pressed; // R2 ou R1

    // 1. MOVIMENTO DA MÃO ESQUERDA
    if (pad.leftStick) {
        const forceX = pad.leftStick.x;
        const forceY = pad.leftStick.y;

        if (player.leftJoint) {
            scene.matter.body.applyForce(player.body, player.body.position, { x: forceX * 0.07, y: forceY * 0.07 });
        } else {
            scene.matter.body.applyForce(player.leftHand, player.leftHand.position, { x: forceX * 0.018, y: forceY * 0.018 });
        }
    }

    // 2. MOVIMENTO DA MÃO DIREITA
    if (pad.rightStick) {
        const forceX = pad.rightStick.x;
        const forceY = pad.rightStick.y;

        if (player.rightJoint) {
            scene.matter.body.applyForce(player.body, player.body.position, { x: forceX * 0.07, y: forceY * 0.07 });
        } else {
            scene.matter.body.applyForce(player.rightHand, player.rightHand.position, { x: forceX * 0.018, y: forceY * 0.018 });
        }
    }

    // 3. SELETOR DE GARRA - MÃO ESQUERDA (Aumentei a área de detecção para facilitar)
    if (grabbingLeft && !player.leftJoint) {
        const bodies = scene.matter.world.localWorld.bodies;
        const targets = scene.matter.query.region(bodies, {
            min: { x: player.leftHand.position.x - 25, y: player.leftHand.position.y - 25 },
            max: { x: player.leftHand.position.x + 25, y: player.leftHand.position.y + 25 }
        });
        
        const staticTarget = targets.find(b => b.isStatic && b.label === 'ambiente');
        
        if (staticTarget) {
            player.leftJoint = scene.matter.add.constraint(player.leftHand, staticTarget, 0, 1.0, {
                pointA: { x: 0, y: 0 },
                pointB: { x: player.leftHand.position.x - staticTarget.position.x, y: player.leftHand.position.y - staticTarget.position.y }
            });
        }
    } else if (!grabbingLeft && player.leftJoint) {
        scene.matter.world.remove(player.leftJoint);
        player.leftJoint = null;
    }

    // 4. SELETOR DE GARRA - MÃO DIREITA
    if (grabbingRight && !player.rightJoint) {
        const bodies = scene.matter.world.localWorld.bodies;
        const targets = scene.matter.query.region(bodies, {
            min: { x: player.rightHand.position.x - 25, y: player.rightHand.position.y - 25 },
            max: { x: player.rightHand.position.x + 25, y: player.rightHand.position.y + 25 }
        });
        
        const staticTarget = targets.find(b => b.isStatic && b.label === 'ambiente');
        
        if (staticTarget) {
            player.rightJoint = scene.matter.add.constraint(player.rightHand, staticTarget, 0, 1.0, {
                pointA: { x: 0, y: 0 },
                pointB: { x: player.rightHand.position.x - staticTarget.position.x, y: player.rightHand.position.y - staticTarget.position.y }
            });
        }
    } else if (!grabbingRight && player.rightJoint) {
        scene.matter.world.remove(player.rightJoint);
        player.rightJoint = null;
    }
}
</script>
</body>
</html>

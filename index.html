<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Escalada - Matter.js & Phaser</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Container principal do jogo */
        #game-container {
            border: 2px solid #333;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.8);
            border-radius: 8px;
            overflow: hidden;
        }

        /* Painel de interface superior */
        #ui-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.75);
            padding: 12px 16px;
            border-radius: 6px;
            border: 1px solid #444;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 14px;
            z-index: 10;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-group label {
            font-size: 12px;
            color: #ccc;
        }

        .input-group input[type="number"] {
            width: 60px;
            padding: 4px;
            background: #222;
            border: 1px solid #555;
            color: #fff;
            border-radius: 4px;
            text-align: center;
        }

        /* Dicas de Controle */
        #controls-hint {
            position: absolute;
            bottom: 15px;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            color: #aaa;
            pointer-events: none;
        }
    </style>

    <!-- Engine Phaser 3 (com Matter.js incluso) -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
</head>
<body>

    <!-- Painel de Ajustes da UI -->
    <div id="ui-panel">
        <div class="input-group">
            <label for="prop-fall-weight-mod">Modificador de Peso (Queda):</label>
            <input type="number" id="prop-fall-weight-mod" value="10.0" step="0.5" min="0">
        </div>
    </div>

    <!-- Legenda de Controles -->
    <div id="controls-hint">
        <b>Teclado (P1):</b> [W,A,S,D] Mover | [J] Mão Esq | [K] Mão Dir | [R] Respawn
    </div>

    <!-- Código Completo do Jogo em JavaScript -->
    <script>
        // ==========================================
        // CONSTANTES DE CONFIGURAÇÃO DE FÍSICA
        // ==========================================
        const FORCA_ESCALADA_BASE = 0.008;       // Força suave para não esticar as joints
        const VELOCIDADE_MAX_AGARRADO = 6.0;     // Teto de velocidade durante o agarre
        const RAIO_MAXIMO_BRACO = 65;            // Alcance máximo do braço
        const VELOCIDADE_MAXIMA_LANCAMENTO = 12; // Impulso máximo ao soltar na diagonal

        let keyControls;

        // ==========================================
        // CENA PRINCIPAL DO JOGO
        // ==========================================
        class GameScene extends Phaser.Scene {
            constructor() {
                super({ key: 'GameScene' });
                this.players = [];
            }

            preload() {
                // Carregamento de assets se necessário
            }

            create() {
                // Criar Jogador
                this.players.push(this.criarPlayer(0, 640, 360));

                // Configuração do Teclado (Jogador 1)
                if (this.input.keyboard) {
                    keyControls = {
                        left: this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.A),
                        right: this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.D),
                        up: this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.W),
                        down: this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.S),
                        grabLeft: this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.J),
                        grabRight: this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.K),
                        respawn: this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.R)
                    };
                }

                // Plataforma Estática para Testes
                this.matter.add.rectangle(640, 500, 600, 40, { 
                    isStatic: true, 
                    manuseavel: false 
                });
            }

            update() {
                // Loop principal de atualização dos jogadores
                this.players.forEach(player => {
                    handlePlayerInput(this, player);
                });
            }

            criarPlayer(id, x, y) {
                // Corpo Central
                let body = this.matter.add.circle(x, y, 20, {
                    restitution: 0.1,
                    friction: 0.8,
                    density: 0.01
                });

                // Mão Esquerda e Direita
                let leftHand = this.matter.add.circle(x - 30, y, 10, {
                    restitution: 0,
                    friction: 0.9,
                    density: 0.005
                });

                let rightHand = this.matter.add.circle(x + 30, y, 10, {
                    restitution: 0,
                    friction: 0.9,
                    density: 0.005
                });

                // Articulações dos Braços
                let leftArm = this.matter.add.constraint(body, leftHand, RAIO_MAXIMO_BRACO, 0.9, {
                    damping: 0.1
                });

                let rightArm = this.matter.add.constraint(body, rightHand, RAIO_MAXIMO_BRACO, 0.9, {
                    damping: 0.1
                });

                return {
                    id: id,
                    body: body,
                    leftHand: leftHand,
                    rightHand: rightHand,
                    leftArm: leftArm,
                    rightArm: rightArm,
                    leftJoint: null,
                    rightJoint: null,
                    leftJointTarget: null,
                    rightJointTarget: null,
                    pad: null
                };
            }
        }

        // ==========================================
        // FUNÇÕES AUXILIARES E CONTROLES
        // ==========================================

        function isButtonPressed(pad, buttonIndex) {
            return pad && pad.buttons[buttonIndex] && pad.buttons[buttonIndex].pressed;
        }

        function executarRespawnIndividual(scene, playerId) {
            console.log(`Respawn no jogador ${playerId}`);
        }

        function aplicarMovimentoMaoAgarrada(s, p, stick) {
            if (Math.abs(stick.x) < 0.1 && Math.abs(stick.y) < 0.1) return;

            // 1. Normalização do vetor para ajustar o movimento diagonal
            let magnitude = Math.sqrt(stick.x * stick.x + stick.y * stick.y);
            let dirX = stick.x / (magnitude || 1);
            let dirY = stick.y / (magnitude || 1);
            let intensidade = Math.min(magnitude, 1.0);

            // 2. Trava de distância física
            let hand = (p.leftJoint ? p.leftHand : p.rightHand);
            if (!hand) return;

            let dist = Phaser.Math.Distance.Between(p.body.position.x, p.body.position.y, hand.position.x, hand.position.y);

            if (dist >= RAIO_MAXIMO_BRACO) {
                intensidade *= Math.max(0, 1 - (dist - RAIO_MAXIMO_BRACO) / 20);
            }

            // 3. Aplicação de força controlada
            let forcaX = dirX * FORCA_ESCALADA_BASE * intensidade;
            let forcaY = dirY * FORCA_ESCALADA_BASE * intensidade;

            s.matter.body.applyForce(p.body, p.body.position, { x: forcaX, y: forcaY });

            // 4. Clampar velocidade máxima para conter a "explosão"
            let vx = p.body.velocity.x;
            let vy = p.body.velocity.y;
            let velAtual = Math.sqrt(vx * vx + vy * vy);

            if (velAtual > VELOCIDADE_MAX_AGARRADO) {
                let fator = VELOCIDADE_MAX_AGARRADO / velAtual;
                s.matter.body.setVelocity(p.body, { x: vx * fator, y: vy * fator });
            }
        }

        function handlePlayerInput(s, p) {
            const pad = p.pad;
            let stickLeft = { x: 0, y: 0 }, stickRight = { x: 0, y: 0 };
            let lL = false, rR = false;

            // --- 1. LEITURA DE ENTRADAS ---
            if (pad) {
                lL = isButtonPressed(pad, 6) || isButtonPressed(pad, 4);
                rR = isButtonPressed(pad, 7) || isButtonPressed(pad, 5);
                if (pad.leftStick) stickLeft = pad.leftStick;
                if (pad.rightStick) stickRight = pad.rightStick;

                if (isButtonPressed(pad, 8)) { 
                    executarRespawnIndividual(s, p.id); 
                    return; 
                }
            } 
            else if (p.id === 0 && keyControls) {
                if (keyControls.left.isDown) stickLeft.x = -1;
                if (keyControls.right.isDown) stickLeft.x = 1;
                if (keyControls.up.isDown) stickLeft.y = -1;
                if (keyControls.down.isDown) stickLeft.y = 1;

                stickRight = { ...stickLeft };
                lL = keyControls.grabLeft.isDown;
                rR = keyControls.grabRight.isDown;

                if (Phaser.Input.Keyboard.JustDown(keyControls.respawn)) {
                    executarRespawnIndividual(s, p.id);
                    return;
                }
            }
            
            // --- 2. MODIFICADOR DE PESO EM QUEDA ---
            let campoMod = document.getElementById('prop-fall-weight-mod');
            let valorModificador = campoMod ? parseFloat(campoMod.value) : 10.0;
            if (isNaN(valorModificador) || valorModificador < 0) { valorModificador = 0; if(campoMod) campoMod.value = 0; }
            
            let MASSA_PADRAO = 6.8;
            let massaCalculadaCorpo = MASSA_PADRAO;
            
            let totalmenteLivreNoVazio = (!p.leftJoint && !p.rightJoint);
            let estaCaindo = (p.body.velocity.y > 0.5);
            
            const ZONA_MORTA_CIMA = -0.15;
            let esquerdoParaCima = (stickLeft.y < ZONA_MORTA_CIMA);
            let direitoParaCima = (stickRight.y < ZONA_MORTA_CIMA);
            
            if (estaCaindo && (esquerdoParaCima || direitoParaCima) && totalmenteLivreNoVazio) {
                let pesoExtraEsq = 0, pesoExtraDir = 0;
                let deltaYEsq = p.body.position.y - p.leftHand.position.y;
                if (deltaYEsq > 0) pesoExtraEsq = deltaYEsq * valorModificador * 0.1;
                let deltaYDir = p.body.position.y - p.rightHand.position.y;
                if (deltaYDir > 0) pesoExtraDir = deltaYDir * valorModificador * 0.1;
                massaCalculadaCorpo += (pesoExtraEsq + pesoExtraDir);
            }
            if (p.body.mass !== massaCalculadaCorpo) { s.matter.body.setMass(p.body, massaCalculadaCorpo); }
            
            // --- 3. ANALÓGICOS ---
            let movendoEsquerdo = (stickLeft.x * stickLeft.x + stickLeft.y * stickLeft.y > 0.15 * 0.15);
            let movendoDireito = (stickRight.x * stickRight.x + stickRight.y * stickRight.y > 0.15 * 0.15);
            
            // --- 4. MÃO ESQUERDA ---
            let segurandoEsq = p.leftJoint && p.leftJointTarget && (p.leftJointTarget.manuseavel === false);
            
            if (segurandoEsq) {
                aplicarMovimentoMaoAgarrada(s, p, stickLeft);
            } else {
                let posXAlvo = p.body.position.x - 35; 
                let posYAlvo = p.body.position.y + 30;
                
                if (movendoEsquerdo) {
                    let anguloAnalogo = Math.atan2(stickLeft.y, stickLeft.x);
                    posXAlvo = p.body.position.x + Math.cos(anguloAnalogo) * RAIO_MAXIMO_BRACO;
                    posYAlvo = p.body.position.y + Math.sin(anguloAnalogo) * RAIO_MAXIMO_BRACO;
                }
                
                let velX = (posXAlvo - p.leftHand.position.x) * 0.25;
                let velY = (posYAlvo - p.leftHand.position.y) * 0.25;
                s.matter.body.setVelocity(p.leftHand, { x: velX + p.body.velocity.x, y: velY + p.body.velocity.y });
            }
            
            // --- 5. MÃO DIREITA ---
            let segurandoDir = p.rightJoint && p.rightJointTarget && (p.rightJointTarget.manuseavel === false);
            
            if (segurandoDir) {
                aplicarMovimentoMaoAgarrada(s, p, stickRight);
            } else {
                let posXAlvo = p.body.position.x + 35; 
                let posYAlvo = p.body.position.y + 30;
                
                if (movendoDireito) {
                    let anguloAnalogo = Math.atan2(stickRight.y, stickRight.x);
                    posXAlvo = p.body.position.x + Math.cos(anguloAnalogo) * RAIO_MAXIMO_BRACO;
                    posYAlvo = p.body.position.y + Math.sin(anguloAnalogo) * RAIO_MAXIMO_BRACO;
                }
                
                let velX = (posXAlvo - p.rightHand.position.x) * 0.25;
                let velY = (posYAlvo - p.rightHand.position.y) * 0.25;
                s.matter.body.setVelocity(p.rightHand, { x: velX + p.body.velocity.x, y: velY + p.body.velocity.y });
            }
            
            // --- 6. AGARRAR E SOLTAR ---
            processarGarra(s, p, p.leftHand, 'leftJoint', lL); 
            processarGarra(s, p, p.rightHand, 'rightJoint', rR);
        }

        function processarGarra(s, p, hand, jointProp, isGrabbing) {
            let joint = p[jointProp];

            // A. SOLTAR A MÃO
            if (!isGrabbing && joint) {
                s.matter.world.remove(joint);
                p[jointProp] = null;
                if (p[jointProp + 'Target']) p[jointProp + 'Target'] = null;

                let vx = p.body.velocity.x;
                let vy = p.body.velocity.y;
                let velAtual = Math.sqrt(vx * vx + vy * vy);

                if (velAtual > VELOCIDADE_MAXIMA_LANCAMENTO) {
                    let fator = VELOCIDADE_MAXIMA_LANCAMENTO / velAtual;
                    s.matter.body.setVelocity(p.body, { x: vx * fator, y: vy * fator });
                }
                p.body.angularVelocity *= 0.2;
                return;
            }

            // B. TENTAR AGARRAR
            if (isGrabbing && !joint) {
                let corposProximos = s.matter.intersectBody(hand);
                
                for (let target of corposProximos) {
                    if (target === p.body || target === p.leftHand || target === p.rightHand) continue;

                    p[jointProp] = s.matter.add.constraint(hand, target, 0, 0.95, {
                        pointA: { x: 0, y: 0 },
                        pointB: { 
                            x: hand.position.x - target.position.x, 
                            y: hand.position.y - target.position.y 
                        }
                    });
                    p[jointProp + 'Target'] = target;
                    break;
                }
            }

            // C. CLAMPER DE DISTÂNCIA
            let dist = Phaser.Math.Distance.Between(p.body.position.x, p.body.position.y, hand.position.x, hand.position.y);

            if (dist > RAIO_MAXIMO_BRACO) {
                let angle = Phaser.Math.Angle.Between(hand.position.x, hand.position.y, p.body.position.x, p.body.position.y);
                let correctX = hand.position.x + Math.cos(angle) * RAIO_MAXIMO_BRACO;
                let correctY = hand.position.y + Math.sin(angle) * RAIO_MAXIMO_BRACO;
                
                s.matter.body.setPosition(p.body, { x: correctX, y: correctY });
            }
        }

        // ==========================================
        // INICIALIZAÇÃO DA ENGINE
        // ==========================================
        const config = {
            type: Phaser.AUTO,
            width: 1280,
            height: 720,
            physics: {
                default: 'matter',
                matter: {
                    gravity: { y: 1 },
                    debug: true // Troque para false para desativar a renderização das linhas de física
                }
            },
            scene: GameScene
        };

        const game = new Phaser.Game(config);
    </script>

</body>
</html>

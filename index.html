<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Clone Heave Ho - Física Corrigida</title>
    <style>
        body { margin: 0; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        canvas { box-shadow: 0 0 20px rgba(0,0,0,0.8); }
    </style>
    <script src="phaser.min.js"></script>
</head>
<body>

<script>
const config = {
    type: Phaser.AUTO,
    width: 1024,
    height: 768,
    backgroundColor: '#4488aa',
    physics: {
        default: 'matter',
        matter: {
            gravity: { y: 1.2 }, // Gravidade ligeiramente maior para o corpo parecer pesado
            debug: true 
        }
    },
    input: { gamepad: true },
    scene: { preload: preload, create: create, update: update }
};

const game = new Phaser.Game(config);
let player1, player2;

function preload() {}

function create() {
    this.add.text(20, 20, "L2 / R2 para AGARRAR. Analógico move o corpo APENAS quando agarrado.", { font: "20px Arial", fill: "#ffffff" });

    // Criando o cenário completo com a tag 'ambiente'
    this.matter.add.rectangle(512, 740, 1024, 50, { isStatic: true, label: 'ambiente' }); 
    this.matter.add.rectangle(512, 25, 1024, 50, { isStatic: true, label: 'ambiente' });  
    this.matter.add.rectangle(25, 384, 50, 768, { isStatic: true, label: 'ambiente' });  
    this.matter.add.rectangle(999, 384, 50, 768, { isStatic: true, label: 'ambiente' });  

    // Plataformas
    this.matter.add.rectangle(250, 450, 300, 40, { isStatic: true, label: 'ambiente' }); 
    this.matter.add.rectangle(774, 350, 300, 40, { isStatic: true, label: 'ambiente' }); 

    this.input.gamepad.on('down', (pad, button, index) => {
        if (pad.index === 0 && !player1) {
            player1 = createHeaveHoCharacter(this, 250, 300, '#ff4757', pad);
        }
        if (pad.index === 1 && !player2) {
            player2 = createHeaveHoCharacter(this, 750, 200, '#1e90ff', pad);
        }
    });
}

function createChain(scene, bodyA, bodyB, numLinks, length) {
    let lastBody = bodyA;
    const group = scene.matter.world.nextGroup(true);

    for (let i = 0; i < numLinks; i++) {
        const isLast = (i === numLinks - 1);
        let link;
        
        if (isLast) {
            link = bodyB;
        } else {
            // Elos extremamente leves para não puxarem o corpo sozinhos
            link = scene.matter.add.rectangle(bodyA.position.x, bodyA.position.y, 6, 10, { 
                density: 0.0001, 
                frictionAir: 0.05,
                collisionFilter: { group: group } 
            });
        }

        scene.matter.add.constraint(lastBody, link, length, 0.8, {
            pointA: lastBody === bodyA ? { x: 0, y: 0 } : { x: 0, y: 4 },
            pointB: isLast ? { x: 0, y: 0 } : { x: 0, y: -4 }
        });

        lastBody = link;
    }
}

function createHeaveHoCharacter(scene, x, y, color, gamepad) {
    // Corpo principal pesado
    const body = scene.matter.add.circle(x, y, 22, { friction: 0.1, density: 0.02, label: 'body' });
    
    // Mãos muito leves e que sofrem efeito da gravidade para não flutuarem como jatos
    const leftHand = scene.matter.add.circle(x - 60, y, 14, { density: 0.001, frictionAir: 0.08, label: 'leftHand' });
    const rightHand = scene.matter.add.circle(x + 60, y, 14, { density: 0.001, frictionAir: 0.08, label: 'rightHand' });

    createChain(scene, body, leftHand, 4, 15);
    createChain(scene, body, rightHand, 4, 15);

    return {
        body: body,
        leftHand: leftHand,
        rightHand: rightHand,
        pad: gamepad,
        leftJoint: null,
        rightJoint: null
    };
}

function update() {
    if (player1) handlePlayerInput(this, player1);
    if (player2) handlePlayerInput(this, player2);
}

function handlePlayerInput(scene, player) {
    const pad = player.pad;
    if (!pad) return;

    const grabbingLeft = pad.buttons[6].pressed || pad.buttons[4].pressed;  // L2 ou L1
    const grabbingRight = pad.buttons[7].pressed || pad.buttons[5].pressed; // R2 ou R1

    // CORREÇÃO 1: MOVIMENTO DA MÃO ESQUERDA
    if (pad.leftStick) {
        const forceX = pad.leftStick.x;
        const forceY = pad.leftStick.y;

        if (player.leftJoint) {
            // Se estiver AGARRADO, o analógico empurra o CORPO PRINCIPAL (escalada/impulso)
            scene.matter.body.applyForce(player.body, player.body.position, { x: forceX * 0.03, y: forceY * 0.03 });
        } else {
            // Se estiver SOLTO, aplica uma força sutil APENAS na mão (não move o corpo de jeito nenhum)
            scene.matter.body.applyForce(player.leftHand, player.leftHand.position, { x: forceX * 0.0008, y: forceY * 0.0008 });
        }
    }

    // CORREÇÃO 1: MOVIMENTO DA MÃO DIREITA
    if (pad.rightStick) {
        const forceX = pad.rightStick.x;
        const forceY = pad.rightStick.y;

        if (player.rightJoint) {
            scene.matter.body.applyForce(player.body, player.body.position, { x: forceX * 0.03, y: forceY * 0.03 });
        } else {
            scene.matter.body.applyForce(player.rightHand, player.rightHand.position, { x: forceX * 0.0008, y: forceY * 0.0008 });
        }
    }

    // CORREÇÃO 2: DETECÇÃO DE GARRA AMPLIADA (MÃO ESQUERDA)
    if (grabbingLeft && !player.leftJoint) {
        // Cria uma pequena área de colisão circular virtual de raio 25 ao redor da mão para facilitar o clique
        const bodies = scene.matter.world.localWorld.bodies;
        const targets = scene.matter.query.region(bodies, {
            min: { x: player.leftHand.position.x - 25, y: player.leftHand.position.y - 25 },
            max: { x: player.leftHand.position.x + 25, y: player.leftHand.position.y + 25 }
        });
        
        const staticTarget = targets.find(b => b.isStatic && b.label === 'ambiente');
        
        if (staticTarget) {
            player.leftJoint = scene.matter.add.constraint(player.leftHand, staticTarget, 0, 1, {
                pointA: { x: 0, y: 0 },
                pointB: { x: player.leftHand.position.x - staticTarget.position.x, y: player.leftHand.position.y - staticTarget.position.y }
            });
        }
    } else if (!grabbingLeft && player.leftJoint) {
        scene.matter.world.remove(player.leftJoint);
        player.leftJoint = null;
    }

    // CORREÇÃO 2: DETECÇÃO DE GARRA AMPLIADA (MÃO DIREITA)
    if (grabbingRight && !player.rightJoint) {
        const bodies = scene.matter.world.localWorld.bodies;
        const targets = scene.matter.query.region(bodies, {
            min: { x: player.rightHand.position.x - 25, y: player.rightHand.position.y - 25 },
            max: { x: player.rightHand.position.x + 25, y: player.rightHand.position.y + 25 }
        });
        
        const staticTarget = targets.find(b => b.isStatic && b.label === 'ambiente');
        
        if (staticTarget) {
            player.rightJoint = scene.matter.add.constraint(player.rightHand, staticTarget, 0, 1, {
                pointA: { x: 0, y: 0 },
                pointB: { x: player.rightHand.position.x - staticTarget.position.x, y: player.rightHand.position.y - staticTarget.position.y }
            });
        }
    } else if (!grabbingRight && player.rightJoint) {
        scene.matter.world.remove(player.rightJoint);
        player.rightJoint = null;
    }
}
</script>
</body>
</html>
